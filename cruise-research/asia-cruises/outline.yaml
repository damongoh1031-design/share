topic: 亚洲（中日韩）长程邮轮深度调研
topic_slug: asia-cruises
time_range: 最近12个月 + 2026-2028 已公布船期
purpose: 全谱系覆盖（4 晚短线 → 60 晚大环线），四个维度：航线与船期 / 运营公司与船 / 价格与性价比 / 签证与政策
created: 2026-10-06

# 11 条「航线类」调研对象（输出结构化 JSON）
items:
  - name: 中国母港日韩短线
    category: 短线3-6晚
    description: 上海/天津/香港/深圳/厦门/广州母港出发，停靠福冈、长崎、佐世保、冲绳、济州、釜山等，4-6 晚为主
  - name: 中日韩中长线
    category: 中长线7-15晚
    description: 中日韩深度串联，7-15 晚，含环日本、日韩双国深度、日本本州+北海道
  - name: 环日本深度长线
    category: 中长线7-15晚
    description: 环日本一周（本州+九州+四国+北海道），多为 10-15 晚，日本船公司与外国船公司均有运营
  - name: 日本国内与离岛航线
    category: 短线3-6晚
    description: 日本国内航线（横滨/神户/名古屋出发），含濑户内海、离岛、北海道，日本本土船公司为主
  - name: 韩国航线与韩国母港
    category: 短线3-6晚
    description: 釜山/仁川/济州/束草母港，日韩连线与韩国环线，含丽水世博、济州免签政策
  - name: 香港与台湾出发亚洲航线
    category: 短线3-6晚
    description: 香港母港（启德邮轮码头）与台湾基隆/高雄出发，日韩、东南亚、香港-台湾连线
  - name: 东南亚长线
    category: 长线16-29晚
    description: 新加坡/曼谷/巴生港母港，东南亚多国串联 10-20 晚，含越南、泰国、马来西亚、印尼、菲律宾
  - name: 亚洲区域大环线
    category: 超长线30晚+
    description: 30-60 晚亚洲大环线，含日韩+东南亚+印度洋+中东串联，如 HAL、Princess、Cunard 的亚洲长航程
  - name: 环球航线亚洲段
    category: 超长线30晚+
    description: 环球航线中可单独购买的亚洲段（30-70 晚），如南安普顿→新加坡→悉尼、横滨→开普敦等
  - name: 亚洲探险邮轮长线
    category: 长线16-29晚
    description: 庞洛、银海、世邦、Heritage 等在亚洲的探险长线，含日本离岛、印尼群岛、巴布亚、菲律宾
  - name: 亚洲跨洋长线
    category: 超长线30晚+
    description: 亚洲出发的跨太平洋/跨印度洋长线（30+ 晚），如日本→北美、新加坡→地中海、横滨→温哥华

# 3 个「专题类」调研（输出结构化 Markdown）
topics:
  - name: 中国母港2026-2027船队部署全清单
    description: 各公司在华部署的船、母港、航季、运力变化，含 MSC 荣耀号重返上海、皇家加勒比海洋光谱号、爱达魔都号、招商伊敦号、星梦云顶梦号等
  - name: 亚洲邮轮签证与政策总览
    description: 日本/韩国/东南亚签证要求、中国旅客免签与团签政策、岸上自由行限制、邮轮免签入境规则
  - name: 亚洲邮轮价格体系与性价比对比
    description: 分档人均每晚单价、淡旺季价差、含税与小费口径、各公司性价比横向对比

execution:
  batch_size: 5
  items_per_agent: 2
  output_dir: ./results
  notes_dir: ./notes
