<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>外呼 CRM · 交互原型</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0c0f15; --bg2:#11151d; --panel:#151a23; --panel2:#1a212c; --panel3:#202836;
  --line:#232b39; --line2:#2d3748;
  --tx:#e8ecf4; --tx2:#98a3b8; --tx3:#69748a;
  --blue:#4c8dff; --green:#2ecc8f; --amber:#f5a524; --red:#f0556b; --purple:#a78bfa; --slate:#66718a;
  --r:10px;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  font:14px/1.55 "Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a3342;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 布局 ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.side{width:212px;flex:0 0 212px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:15px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.brand .dot{width:8px;height:8px;border-radius:2px;background:var(--blue);box-shadow:0 0 10px var(--blue)}
.brand p{margin:4px 0 0;font-size:11px;color:var(--tx3);letter-spacing:.3px}
.nav{flex:1;padding:10px 8px;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:2px 0;border-radius:8px;
  color:var(--tx2);cursor:pointer;font-size:13.5px;transition:.14s}
.nav a:hover{background:#18202b;color:var(--tx)}
.nav a.on{background:rgba(76,141,255,.15);color:#cfe0ff;box-shadow:inset 2px 0 0 var(--blue)}
.nav a .ic{width:16px;text-align:center;font-size:13px;opacity:.9}
.nav a .cnt{margin-left:auto;font-size:11px;color:var(--tx3)}
.side-ft{padding:12px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--tx3);line-height:1.7}
.side-ft b{color:var(--tx2);font-weight:500}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:54px;flex:0 0 54px;border-bottom:1px solid var(--line);background:var(--bg2);
  display:flex;align-items:center;gap:14px;padding:0 18px}
.top .crumb{font-size:13px;color:var(--tx2)}
.top .crumb b{color:var(--tx);font-weight:500}
.top .sp{flex:1}
.content{flex:1;overflow:auto;padding:18px 20px 40px}

/* ---------- 通用 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--tx);font-size:13px;cursor:pointer;transition:.14s;white-space:nowrap}
.btn:hover{background:var(--panel3);border-color:#3a465c}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#3d7ef2}
.btn.ghost{background:transparent}
.btn.sm{height:26px;padding:0 9px;font-size:12px;border-radius:6px}
.btn.danger{color:#ffb4be;border-color:#5a2a35;background:#2a1820}
.btn.danger:hover{background:#3a1d27}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{font-family:inherit;font-size:13px;background:var(--panel2);color:var(--tx);
  border:1px solid var(--line2);border-radius:8px;padding:7px 9px;outline:none;width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(76,141,255,.13)}
textarea{resize:vertical;line-height:1.6}
label.fl{display:block;font-size:12px;color:var(--tx2);margin:0 0 5px}
.field{margin-bottom:12px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card-hd{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.card-hd h3{margin:0;font-size:13.5px;font-weight:500;letter-spacing:.2px}
.card-hd .sp{flex:1}
.card-bd{padding:14px 15px}
.card-bd.tight{padding:0}
.muted{color:var(--tx2)}
.dim{color:var(--tx3)}
.tiny{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums;font-family:"JetBrains Mono",Consolas,monospace}
.badge{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:5px;font-size:11.5px;white-space:nowrap;border:1px solid transparent}
.b-slate{background:rgba(102,113,138,.16);color:#a8b3c8;border-color:rgba(102,113,138,.3)}
.b-blue{background:rgba(76,141,255,.14);color:#8fb8ff;border-color:rgba(76,141,255,.3)}
.b-amber{background:rgba(245,165,36,.13);color:#f7c46a;border-color:rgba(245,165,36,.28)}
.b-green{background:rgba(46,204,143,.13);color:#5fe0ae;border-color:rgba(46,204,143,.28)}
.b-red{background:rgba(240,85,107,.13);color:#ff96a5;border-color:rgba(240,85,107,.3)}
.b-purple{background:rgba(167,139,250,.14);color:#c4b1ff;border-color:rgba(167,139,250,.3)}
.b-gray{background:rgba(120,130,150,.1);color:#7e8899;border-color:rgba(120,130,150,.22)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi .k{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi .k .lb{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.kpi .k .vl{font-size:27px;font-weight:600;margin-top:6px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .k .sub{font-size:11.5px;color:var(--tx3);margin-top:2px}
.kpi .k.alert .vl{color:#ff8b9b}
.kpi .k.ok .vl{color:#5fe0ae}
.kpi .k::after{content:"";position:absolute;right:-16px;top:-16px;width:62px;height:62px;border-radius:50%;background:rgba(76,141,255,.06)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--tx2);font-size:12px;padding:9px 12px;background:#131923;
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:10px 12px;border-bottom:1px solid #1c2431;vertical-align:middle}
tbody tr:hover{background:#161d27}
tbody tr.click{cursor:pointer}
tbody tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow:auto}
.empty{padding:40px 20px;text-align:center;color:var(--tx3);font-size:13px}
.pager{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--tx2)}
.pager .sp{flex:1}
.grid-2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:14px;align-items:start}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stack>*+*{margin-top:14px}
.hr{height:1px;background:var(--line);margin:12px 0}
.hidden{display:none!important}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;background:#1e2635;color:#9fb0c8;font-size:11px;margin-right:4px}

/* ---------- 列表项 ---------- */
.item{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid #1c2431}
.item:last-child{border-bottom:none}
.item:hover{background:#161d27}
.item .tm{width:48px;flex:0 0 48px;font-size:12.5px;color:var(--tx2);font-variant-numeric:tabular-nums}
.item .bd{flex:1;min-width:0}
.item .bd .t1{font-size:13px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.item .bd .t2{font-size:11.5px;color:var(--tx3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ops{display:flex;gap:6px;opacity:.55;transition:.15s}
.item:hover .ops{opacity:1}
.avatar{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
  font-size:11.5px;background:#243044;color:#9db6dd;flex:0 0 26px;font-weight:500}

/* ---------- 日历 ---------- */
.calbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .wd{background:#131923;padding:8px;text-align:center;color:var(--tx2);font-size:12px}
.cal .cell{background:var(--panel);min-height:92px;padding:6px 8px;cursor:pointer;position:relative;transition:.12s}
.cal .cell:hover{background:#1a212c}
.cal .cell.dim{background:#10141c;color:var(--tx3)}
.cal .cell .d{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums}
.cal .cell.dim .d{color:#4d5668}
.cal .cell.today .d{color:#fff;background:var(--blue);width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px}
.cal .cell .n{position:absolute;right:8px;top:7px;font-size:11px;color:var(--tx2)}
.cal .cell .ev{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.cal .cell .ev span{font-size:10.5px;padding:1px 5px;border-radius:4px;background:#1e2635;color:#9fb0c8;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .cell .ev span.od{background:rgba(240,85,107,.16);color:#ff96a5}
.cal .cell .ev span.dn{background:rgba(46,204,143,.13);color:#5fe0ae}
.cal .cell .ev span.cn{background:#1a1f29;color:#5d6779;text-decoration:line-through}

/* ---------- 抽屉 / 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(6,9,14,.62);backdrop-filter:blur(2px);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:60px 20px 20px;overflow:auto}
.modal{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;
  box-shadow:0 24px 60px rgba(0,0,0,.55);animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.99)}to{opacity:1;transform:none}}
.modal-hd{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-hd h3{margin:0;font-size:14px;font-weight:500}
.modal-hd .x{margin-left:auto;background:none;border:none;color:var(--tx2);font-size:20px;cursor:pointer;line-height:1;padding:0 2px}
.modal-hd .x:hover{color:#fff}
.modal-bd{padding:16px 18px;max-height:64vh;overflow:auto}
.modal-ft{display:flex;justify-content:flex-end;gap:9px;padding:13px 18px;border-top:1px solid var(--line)}
.drawer-mask{position:fixed;inset:0;background:rgba(6,9,14,.5);z-index:55}
.drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:94vw;background:var(--bg2);
  border-left:1px solid var(--line2);z-index:56;display:flex;flex-direction:column;
  box-shadow:-20px 0 50px rgba(0,0,0,.45);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.drawer-hd{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-hd h3{margin:0;font-size:14px;font-weight:500}
.drawer-hd .x{margin-left:auto;background:none;border:none;color:var(--tx2);font-size:20px;cursor:pointer}
.drawer-bd{flex:1;overflow:auto;padding:16px}
.drawer-ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.notif{position:absolute;right:12px;top:48px;width:340px;background:var(--panel);border:1px solid var(--line2);
  border-radius:10px;box-shadow:0 18px 44px rgba(0,0,0,.5);z-index:50;overflow:hidden}
.notif-hd{display:flex;align-items:center;padding:10px 13px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--tx2)}
.notif-hd .sp{flex:1}
.notif-bd{max-height:340px;overflow:auto}
.nitem{padding:11px 13px;border-bottom:1px solid #1c2431;cursor:pointer}
.nitem:hover{background:#1a212c}
.nitem.unread{background:rgba(76,141,255,.055)}
.nitem .t{font-size:12.5px;display:flex;gap:6px;align-items:center}
.nitem .t .p{width:5px;height:5px;border-radius:50%;background:var(--blue);flex:0 0 5px}
.nitem .b{font-size:11.5px;color:var(--tx3);margin-top:2px}

/* ---------- 时间线 ---------- */
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tl .n{position:relative;padding:0 0 18px}
.tl .n::before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--panel);border:2px solid #3a465c}
.tl .n.ok::before{border-color:var(--green)}
.tl .n.miss::before{border-color:var(--amber)}
.tl .n .h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2)}
.tl .n .c{margin-top:5px;font-size:13px;line-height:1.65;color:#cfd7e6}
.tl .n .f{margin-top:5px;font-size:11.5px;color:var(--tx3);display:flex;gap:10px}

/* ---------- 图表 ---------- */
.bars{display:flex;align-items:flex-end;gap:14px;height:132px;padding:6px 4px 0}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b .bar{width:100%;max-width:38px;background:linear-gradient(180deg,#4c8dff,#2b5fc4);border-radius:5px 5px 2px 2px;
  min-height:3px;transition:.2s;position:relative}
.bars .b .bar:hover{filter:brightness(1.18)}
.bars .b .v{font-size:11px;color:var(--tx2);font-variant-numeric:tabular-nums}
.bars .b .l{font-size:11px;color:var(--tx3)}
.pbar{height:5px;border-radius:3px;background:#1e2635;overflow:hidden;width:78px;display:inline-block;vertical-align:middle}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:3px}

/* ---------- 登录 ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 500px at 20% 0%,#16233a 0%,transparent 60%),var(--bg)}
.login .box{width:100%;max-width:900px;display:grid;grid-template-columns:1fr 1fr;gap:0;
  background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.login .lft{padding:38px 34px;border-right:1px solid var(--line)}
.login .lft h2{margin:0 0 6px;font-size:20px;letter-spacing:.5px}
.login .lft p{margin:0 0 22px;font-size:12.5px;color:var(--tx3);line-height:1.7}
.login .rgt{padding:34px;background:#12171f}
.login .rgt h4{margin:0 0 4px;font-size:13px;font-weight:500;color:var(--tx2)}
.login .rgt .hint{font-size:11.5px;color:var(--tx3);margin:0 0 14px}
.pick{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line2);border-radius:9px;
  background:var(--panel2);cursor:pointer;margin-bottom:9px;transition:.14s;width:100%;text-align:left;color:var(--tx)}
.pick:hover{border-color:#3d4b63;background:var(--panel3);transform:translateX(2px)}
.pick .av{width:32px;height:32px;border-radius:8px;background:#243044;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#9db6dd;flex:0 0 32px}
.pick .nm{display:block;font-size:13px;line-height:1.4}
.pick .rl{display:block;font-size:11.5px;color:var(--tx3);margin-top:1px;line-height:1.4}
.pick .go{margin-left:auto;color:var(--tx3);font-size:16px}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:99;
  background:#1d2735;border:1px solid #33415a;color:#dfe7f5;padding:10px 16px;border-radius:9px;font-size:13px;
  box-shadow:0 14px 34px rgba(0,0,0,.5);animation:tin .18s ease-out;display:flex;align-items:center;gap:8px}
.toast.ok{border-color:#2b6b52;background:#152a22;color:#a9ebcd}
.toast.warn{border-color:#6b5324;background:#2a2317;color:#f6d79a}
.toast.err{border-color:#6b2b36;background:#2a161c;color:#ffb3bf}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.kbd{font-family:Consolas,monospace;font-size:11.5px;background:#1e2635;border:1px solid var(--line2);
  border-radius:4px;padding:0 5px;color:#9fb0c8}
.help{font-size:11.5px;color:var(--tx3);margin-top:5px;line-height:1.6}
.warnbox{background:rgba(245,165,36,.09);border:1px solid rgba(245,165,36,.28);border-radius:8px;
  padding:9px 12px;font-size:12px;color:#f0cd94;line-height:1.65}
.infobox{background:rgba(76,141,255,.08);border:1px solid rgba(76,141,255,.24);border-radius:8px;
  padding:9px 12px;font-size:12px;color:#a9c6f5;line-height:1.65}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   外呼 CRM 交互原型 · 纯前端 + localStorage
   ========================================================= */
const $app = document.getElementById('app');
const KEY = 'crm_proto_v1';

/* ---------- 时间工具 ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const ts = s => new Date(s).getTime();
const now = () => new Date();
function dAt(off, h, m) { const d = new Date(); d.setDate(d.getDate() + off); d.setHours(h || 9, m || 0, 0, 0); return d; }
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function sameDay(a, b) { return ymd(a) === ymd(b); }
const WD = ['一', '二', '三', '四', '五', '六', '日'];
function fmtDate(s) { const d = new Date(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
function fmtDT(s) { const d = new Date(s); return (d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtHm(s) { const d = new Date(s); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtMD(s) { const d = new Date(s); return pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dayLabel(s) {
  const d = new Date(s);
  if (sameDay(d, now())) return '今天';
  if (sameDay(d, addDays(now(), -1))) return '昨天';
  if (sameDay(d, addDays(now(), 1))) return '明天';
  return fmtDate(s);
}
function ago(s) {
  const diff = Date.now() - ts(s), h = diff / 36e5;
  if (h < 1) return Math.max(1, Math.round(diff / 6e4)) + ' 分钟前';
  if (h < 24) return Math.round(h) + ' 小时前';
  return Math.round(h / 24) + ' 天前';
}

/* ---------- 种子数据 ---------- */
const CUST_SEED = [
  ['张伟', '13801234567', '杭州云启科技', '官网表单', 'A类', '有意向', 3, '已发送报价，等待内部讨论', 0, 12],
  ['李娜', '13912345678', '上海恒信贸易', '展会', 'A类', '跟进中', 4, '对价格敏感，需申请折扣', 0, 9],
  ['王强', '13698765432', '北京智联信息', '转介绍', 'B类', '待联系', 5, '尚未首次联系，来源为老客户推荐', 0, 3],
  ['刘洋', '13787654321', '深圳锐拓电子', '电话名单', 'B类', '跟进中', 3, '已加微信，约定下周联系', 0, 20],
  ['陈静', '13509876543', '广州明诚物流', '官网表单', 'A类', '有意向', 4, '需要提供完整实施方案', 0, 15],
  ['杨帆', '13456789012', '成都天工机械', '展会', 'C类', '无意向', 5, '预算不足，明年初再看', 0, 30],

  const audit = [
    { id: 1, at: iso(dAt(0, 9, 12)), userId: 2, action: '导出客户', detail: '筛选：团队范围 · 共 26 条' },

  return {

function loadDB() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { }
  if (raw) {
    try {
      const d = JSON.parse(raw);
      if (d && d.meta && d.meta.seedDay === ymd(now()) && d.customers && d.customers.length) return d;
    } catch (e) { }
  }
  const d = buildSeed();
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { }
  return d;
}

function visibleUserIds() {
  const u = state.user;
  if (!u) return [];
  if (u.role === 'admin') return DB.users.map(x => x.id);
  if (u.role === 'supervisor') return [u.id, ...teamIds(u.id)];
  return [u.id];
}

  if (!c || !state.user) return false;
  if (state.user.role === 'admin') return true;
  return visibleUserIds().includes(c.ownerId);
}

  const ids = visibleUserIds();
  return DB.tasks.filter(t => ids.includes(t.assigneeId));
}

  const ids = visibleUserIds();

function taskState(t) {
  if (t.status === 'completed') return { k: 'done', label: '已完成', cls: 'green' };
  if (t.status === 'cancelled') return { k: 'cancel', label: '已取消', cls: 'gray' };
  const left = ts(t.scheduledAt) - Date.now();
  if (left < 0) return { k: 'overdue', label: '已逾期', cls: 'red' };
  if (left < 2 * 36e5) return { k: 'soon', label: '即将到期', cls: 'amber' };
  return { k: 'pending', label: '待回访', cls: 'blue' };
}
function taskBadge(t) { const s = taskState(t); return '<span class="badge b-' + s.cls + '">' + s.label + '</span>'; }
function nextCallback(custId) {
  const list = DB.tasks.filter(t => t.custId === +custId && t.status === 'pending').sort((a, b) => ts(a.scheduledAt) - ts(b.scheduledAt));
  return list.length ? list[0].scheduledAt : null;
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'ok');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.transition = '.2s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 220); }, 2400);
}
function audit(action, detail) {
  DB.audit.unshift({ id: ++DB.meta.seq.audit, at: iso(now()), userId: state.user.id, action, detail });
  if (DB.audit.length > 200) DB.audit.pop();
}
function avatar(name) { return '<span class="avatar">' + esc(shortName(name)) + '</span>'; }
function shortName(name) {
  const s = String(name || '');
  return s.length > 3 ? s.slice(0, 2) : s.slice(-2);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function crumb() {

function notifPanel() {

    .sort((a, b) => ts(b.createdAt) - ts(a.createdAt));

    '<div class="nitem ' + (n.status === 'unread' ? 'unread' : '') + '" data-act="open-notif" data-id="' + n.id + '">' +

/* ---------- 工作台 ---------- */
function dashboardView() {
  const u = state.user;
  const tasks = visibleTasks();
  const today0 = startOfDay(now()).getTime();
  const tomorrow0 = addDays(startOfDay(now()), 1).getTime();

  const todayPending = tasks.filter(t => t.status === 'pending' && ts(t.scheduledAt) >= today0 && ts(t.scheduledAt) < tomorrow0)
    .sort((a, b) => ts(a.scheduledAt) - ts(b.scheduledAt));
  const overdue = tasks.filter(t => t.status === 'pending' && ts(t.scheduledAt) < today0)
    .sort((a, b) => ts(a.scheduledAt) - ts(b.scheduledAt));
  const notesToday = visibleNotes().filter(n => !n.voided && sameDay(new Date(n.at), now()));
  const doneToday = tasks.filter(t => t.status === 'completed' && t.completedAt && sameDay(new Date(t.completedAt), now()));
  const myCust = visibleCustomers().filter(c => !c.archived);

  const kpi = '<div class="kpi">' +
    kpiCard('今日待回访', todayPending.length, '含今日已过时 ' + todayPending.filter(t => ts(t.scheduledAt) < Date.now()).length + ' 条', '') +
    kpiCard('逾期未回访', overdue.length, overdue.length ? '最早逾期 ' + ago(overdue[0].scheduledAt) : '暂无逾期', overdue.length ? 'alert' : 'ok') +
    kpiCard('今日已登记外呼', notesToday.length, '其中已接通 ' + notesToday.filter(n => n.result === '已接通').length + ' 条', '') +
    kpiCard(u.role === 'agent' ? '我的客户' : '可见客户', myCust.length, u.role === 'agent' ? '仅本人负责' : '含下属客户', '') +
    '</div>';

  const todayList = todayPending.length ? todayPending.map(t => {
    const c = getCustomer(t.custId);
    const st = taskState(t);
    return '<div class="item">' +
      '<div class="tm mono">' + fmtHm(t.scheduledAt) + '</div>' +
      '<div class="bd"><div class="t1">' + (c ? esc(c.name) : '?') + ' <span class="dim tiny">' + (c ? esc(c.company) : '') + '</span>' +
      (st.k === 'overdue' ? ' <span class="badge b-red">已超时</span>' : st.k === 'soon' ? ' <span class="badge b-amber">即将到期</span>' : '') + '</div>' +
      '<div class="t2">' + esc(t.title) + (c && c.dnc ? ' · <span style="color:#ff96a5">禁止联系</span>' : '') + '</div></div>' +
      '<div class="ops">' +
      '<button class="btn sm" data-act="open-customer" data-id="' + t.custId + '">详情</button>' +
      '<button class="btn sm primary" data-act="new-note" data-id="' + t.custId + '" data-task="' + t.id + '">写跟进</button>' +
      '</div></div>';
  }).join('') : '<div class="empty">今天没有待回访，可以安排新客户</div>';

  const overdueList = overdue.length ? overdue.slice(0, 6).map(t => {
    const c = getCustomer(t.custId);
    return '<div class="item">' +
      '<div class="tm" style="color:#ff96a5">' + fmtMD(t.scheduledAt) + '</div>' +
      '<div class="bd"><div class="t1">' + (c ? esc(c.name) : '?') + ' <span class="badge b-red">逾期 ' + Math.round((Date.now() - ts(t.scheduledAt)) / 36e5 / 24) + ' 天</span></div>' +
      '<div class="t2">' + esc(t.title) + ' · 执行人 ' + (getUser(t.assigneeId) || {}).name + (t.rescheduleCount ? ' · 已改期 ' + t.rescheduleCount + ' 次' : '') + '</div></div>' +
      '<div class="ops"><button class="btn sm" data-act="open-task" data-id="' + t.id + '">处理</button></div></div>';
  }).join('') : '<div class="empty">没有逾期，保持住</div>';

  const recent = visibleNotes().filter(n => !n.voided).sort((a, b) => ts(b.at) - ts(a.at)).slice(0, 6);
  const recentList = recent.length ? recent.map(n => {
    const c = getCustomer(n.custId), uu = getUser(n.userId);
    return '<div class="item"><div class="tm">' + fmtMD(n.at) + '</div>' +
      '<div class="bd"><div class="t1">' + (c ? esc(c.name) : '?') + ' ' + resultBadge(n.result) + '</div>' +
      '<div class="t2">' + esc(n.content) + '</div></div>' +
      '<div class="tiny dim" style="text-align:right">' + (uu ? esc(uu.name) : '') + '<br>' + fmtHm(n.at) + '</div></div>';

    '<span class="tiny dim">按计划时间升序</span></div><div class="card-bd tight">' + overdueList + '</div></div>' +
    '</div>' +

    '<div class="card"><div class="card-hd"><h3>最近呼叫记事</h3><span class="sp"></span>' +

    '<button class="btn" data-act="nav" data-id="customers">▤ 客户列表 / 导入导出</button>' +

    '</div></div>' +
    '</div></div>';
}
function kpiCard(label, val, sub, cls) {
  return '<div class="k ' + (cls || '') + '"><div class="lb">' + label + '</div><div class="vl">' + val + '</div><div class="sub">' + sub + '</div></div>';

  if (state.fStatus) list = list.filter(c => c.status === state.fStatus);
  if (state.fOwner) list = list.filter(c => c.ownerId === +state.fOwner);
  return list.sort((a, b) => b.id - a.id);

/* ---------- 回访日历 ---------- */
function calendarView() {
  const y = state.calY, m = state.calM;
  const first = new Date(y, m, 1);
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  let lead = first.getDay() - 1; if (lead < 0) lead = 6;
  const start = addDays(first, -lead);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    const key = ymd(d);
    const dayTasks = visibleTasks().filter(t => ymd(new Date(t.scheduledAt)) === key);
    const inMonth = d.getMonth() === m;
    const isToday = sameDay(d, now());
    const evs = dayTasks.slice(0, 3).map(t => {
      const c = getCustomer(t.custId);
      const st = taskState(t);
      const cls = st.k === 'overdue' ? 'od' : st.k === 'done' ? 'dn' : st.k === 'cancel' ? 'cn' : '';
      return '<span class="' + cls + '">' + fmtHm(t.scheduledAt) + ' ' + (c ? c.name : '') + '</span>';
    }).join('');
    cells.push('<div class="cell ' + (inMonth ? '' : 'dim') + (isToday ? ' today' : '') + '" data-act="open-day" data-id="' + key + '">' +
      '<span class="d">' + d.getDate() + '</span>' +
      (dayTasks.length ? '<span class="n">' + dayTasks.length + '</span>' : '') +
      '<div class="ev">' + evs + '</div></div>');
  }
  const wd = WD.map(w => '<div class="wd">周' + w + '</div>').join('');
  const monthName = y + ' 年 ' + (m + 1) + ' 月';
  const pendingAll = visibleTasks().filter(t => t.status === 'pending');

  const listRows = pendingAll.sort((a, b) => ts(a.scheduledAt) - ts(b.scheduledAt)).map(t => {
    const c = getCustomer(t.custId);
    return '<tr class="click" data-act="open-task" data-id="' + t.id + '">' +
      '<td class="mono tiny">' + fmtDT(t.scheduledAt) + '</td>' +
      '<td>' + (c ? esc(c.name) : '') + '<div class="tiny dim">' + esc(t.title) + '</div></td>' +

    '<button class="btn sm" data-act="cal-today">今天</button>' +

    '<button class="btn sm ' + (state.calMode === 'month' ? 'primary' : '') + '" data-act="cal-mode" data-id="month">月视图</button>' +

    (state.calMode === 'month' ?
      '<div class="cal">' + wd + cells.join('') + '</div>' +
      '<div class="help" style="margin-top:10px">日历直接读取回访任务，不维护第二套日期。红=逾期 · 绿=已完成 · 灰划线=已取消。点击任意日期查看当天安排。</div>'
      : '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>计划时间</th><th>客户 / 事项</th><th>执行人</th><th>状态</th></tr></thead><tbody>' + listRows + '</tbody></table></div></div>');
}

  const resultOpts = ['', '已接通', '无人接听', '占线', '号码无效', '拒绝联系'].map(r =>

    '<option value="' + u.id + '"' + (+state.fEmp === u.id ? ' selected' : '') + '>' + u.name + '</option>').join('');

/* ---------- 主管看板 ---------- */
function boardView() {
  const ids = visibleUserIds();
  const team = DB.users.filter(u => ids.includes(u.id));
  const custs = visibleCustomers().filter(c => !c.archived);
  const today0 = startOfDay(now()).getTime();
  const notes = visibleNotes().filter(n => !n.voided);
  const notesToday = notes.filter(n => sameDay(new Date(n.at), now()));
  const tasks = visibleTasks();
  const pending = tasks.filter(t => t.status === 'pending');
  const overdue = pending.filter(t => ts(t.scheduledAt) < today0);

  const kpi = '<div class="kpi">' +
    kpiCard('团队客户', custs.length, '今日新增 ' + custs.filter(c => sameDay(new Date(c.createdAt), now())).length, '') +
    kpiCard('今日登记外呼', notesToday.length, '较昨日 ' + deltaText(notesToday.length, notes.filter(n => sameDay(new Date(n.at), addDays(now(), -1))).length), '') +
    kpiCard('当前逾期回访', overdue.length, '涉及 ' + new Set(overdue.map(t => t.assigneeId)).size + ' 名员工', overdue.length ? 'alert' : 'ok') +
    kpiCard('今日完成回访', tasks.filter(t => t.status === 'completed' && t.completedAt && sameDay(new Date(t.completedAt), now())).length, '按完成时间统计', '') +
    '</div>';

  const rows = team.map(u => {
    const uc = custs.filter(c => c.ownerId === u.id);
    const un = notesToday.filter(n => n.userId === u.id);
    const ut = pending.filter(t => t.assigneeId === u.id);
    const uo = ut.filter(t => ts(t.scheduledAt) < today0);
    const udone = tasks.filter(t => t.assigneeId === u.id && t.status === 'completed' && t.completedAt && sameDay(new Date(t.completedAt), now()));
    const rate = ut.length ? Math.round((ut.length - uo.length) / ut.length * 100) : null;
    return '<tr class="click" data-act="open-agent" data-id="' + u.id + '">' +
      '<td><div style="display:flex;align-items:center;gap:8px">' + avatar(u.name) + '<div>' + u.name +
      '<div class="tiny dim">' + ({ admin: '管理员', supervisor: '主管', agent: '员工' }[u.role]) + '</div></div></div></td>' +
      '<td class="num">' + uc.length + '</td>' +
      '<td class="num">' + un.length + '</td>' +
      '<td class="num">' + new Set(un.map(n => n.custId)).size + '</td>' +
      '<td class="num">' + un.filter(n => n.result === '已接通').length + '</td>' +
      '<td class="num">' + udone.length + '</td>' +
      '<td class="num">' + (uo.length ? '<span class="badge b-red">' + uo.length + '</span>' : '<span class="dim">0</span>') + '</td>' +
      '<td>' + (rate === null ? '<span class="dim">—</span>' : '<span class="pbar"><i style="width:' + rate + '%"></i></span> <span class="tiny dim">' + rate + '%</span>') + '</td>' +
      '</tr>';
  }).join('');

  // 近 7 日登记外呼
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(now(), -i);
    days.push({ d, n: notes.filter(x => sameDay(new Date(x.at), d)).length });
  }
  const max = Math.max(1, ...days.map(x => x.n));
  const bars = days.map(x => '<div class="b"><span class="v">' + x.n + '</span>' +
    '<div class="bar" style="height:' + Math.max(3, Math.round(x.n / max * 96)) + '%"></div>' +
    '<span class="l">' + (sameDay(x.d, now()) ? '今天' : (x.d.getMonth() + 1) + '/' + x.d.getDate()) + '</span></div>').join('');

  const recent = notes.sort((a, b) => ts(b.at) - ts(a.at)).slice(0, 7).map(n => {
    const c = getCustomer(n.custId), uu = getUser(n.userId);
    return '<div class="item"><div class="tm">' + fmtMD(n.at) + '</div><div class="bd">' +
      '<div class="t1">' + (uu ? esc(uu.name) : '') + ' → ' + (c ? esc(c.name) : '') + ' ' + resultBadge(n.result) + '</div>' +
      '<div class="t2">' + esc(n.content) + '</div></div></div>';
  }).join('');

  return kpi +
    '<div class="card" style="margin-bottom:14px"><div class="card-hd"><h3>下属统计</h3><span class="sp"></span>' +
    '<span class="tiny dim">点击姓名查看预览 · 数据为当前团队范围</span></div>' +
    '<div class="tbl-wrap"><table><thead><tr>' +
    '<th>员工</th><th class="num">客户数</th><th class="num">今日登记</th><th class="num">联系客户</th><th class="num">已接通</th><th class="num">今日完成</th><th class="num">当前逾期</th><th>按时率</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
    '<div class="grid-2">' +
    '<div class="card"><div class="card-hd"><h3>近 7 日登记外呼</h3><span class="sp"></span><span class="tiny dim">人工登记次数</span></div>' +
    '<div class="card-bd"><div class="bars">' + bars + '</div></div></div>' +
    '<div class="card"><div class="card-hd"><h3>最近团队动态</h3></div><div class="card-bd tight">' + (recent || '<div class="empty">暂无</div>') + '</div></div>' +
    '</div>' +
    '<div class="help" style="margin-top:10px">统计口径：登记外呼 = 未作废记事数；联系客户 = 有记事的客户去重数；已接通 = 人工标记为已接通；' +
    '当前逾期 = 待处理且计划时间早于今日 0 点。系统不采集通话时长与真实接通率。</div>';
}
function deltaText(a, b) { const d = a - b; return (d > 0 ? '+' : '') + d + ' 条'; }

/* ---------- 抽屉 ---------- */
function drawerHtml() {
  const d = state.drawer;
  let title = '', body = '', foot = '';
  if (d.type === 'day') {
    const key = d.id;
    const list = visibleTasks().filter(t => ymd(new Date(t.scheduledAt)) === key).sort((a, b) => ts(a.scheduledAt) - ts(b.scheduledAt));
    title = key.replace(/-/g, '/') + '（周' + WD[(new Date(key + 'T09:00').getDay() + 6) % 7] + '）';
    body = list.length ? list.map(t => {
      const c = getCustomer(t.custId);
      return '<div class="card" style="margin-bottom:9px"><div class="card-bd" style="padding:11px 13px">' +
        '<div style="display:flex;align-items:center;gap:8px"><b style="font-size:13px">' + fmtHm(t.scheduledAt) + '</b>' +
        '<span style="font-size:13px">' + (c ? esc(c.name) : '') + '</span>' + taskBadge(t) + '</div>' +
        '<div class="tiny dim" style="margin-top:3px">' + esc(t.title) + ' · ' + (getUser(t.assigneeId) || {}).name +
        (t.rescheduleCount ? ' · 改期 ' + t.rescheduleCount + ' 次' : '') + '</div>' +
        (t.status === 'pending' ? '<div style="display:flex;gap:6px;margin-top:8px">' +
          '<button class="btn sm primary" data-act="new-note" data-id="' + t.custId + '" data-task="' + t.id + '">写跟进并完成</button>' +
          '<button class="btn sm" data-act="reschedule" data-id="' + t.id + '">改期</button>' +
          '<button class="btn sm" data-act="cancel-task" data-id="' + t.id + '">取消</button>' +
          '<button class="btn sm" data-act="open-customer" data-id="' + t.custId + '">客户</button></div>' : '') +
        '</div></div>';
    }).join('') : '<div class="empty">这天没有回访安排</div>';
    foot = '<button class="btn" data-act="close-drawer" style="flex:1">关闭</button>';
  } else if (d.type === 'task') {
    const t = getTask(d.id);
    if (!t) return '';
    const c = getCustomer(t.custId);
    title = '回访任务';
    body = '<div style="font-size:15px;font-weight:600">' + esc(t.title) + '</div>' +
      '<div class="tiny dim" style="margin:4px 0 12px">' + (c ? esc(c.name) + ' · ' + esc(c.company) : '') + '</div>' +
      '<table style="font-size:12.5px"><tbody>' +
      '<tr><td class="dim" style="border:none;padding:5px 0;width:80px">计划时间</td><td style="border:none;padding:5px 0">' + fmtDT(t.scheduledAt) + ' ' + taskBadge(t) + '</td></tr>' +
      '<tr><td class="dim" style="border:none;padding:5px 0">原计划</td><td style="border:none;padding:5px 0">' + fmtDT(t.originalScheduledAt) + (t.rescheduleCount ? ' <span class="badge b-amber">改期 ' + t.rescheduleCount + ' 次</span>' : '') + '</td></tr>' +
      '<tr><td class="dim" style="border:none;padding:5px 0">执行人</td><td style="border:none;padding:5px 0">' + (getUser(t.assigneeId) || {}).name + '</td></tr>' +
      '<tr><td class="dim" style="border:none;padding:5px 0">提前提醒</td><td style="border:none;padding:5px 0">' + t.remindBefore + ' 分钟</td></tr>' +
      (t.completedAt ? '<tr><td class="dim" style="border:none;padding:5px 0">完成时间</td><td style="border:none;padding:5px 0">' + fmtDT(t.completedAt) + '</td></tr>' : '') +
      (t.cancelReason ? '<tr><td class="dim" style="border:none;padding:5px 0">取消原因</td><td style="border:none;padding:5px 0">' + t.cancelReason + '</td></tr>' : '') +
      '</tbody></table>' +
      (t.status === 'pending' ? '<div class="warnbox" style="margin-top:12px">完成回访必须同时填写本次记事；新增记事不会自动完成其他任务。</div>' : '');
    foot = t.status === 'pending'
      ? '<button class="btn primary" data-act="new-note" data-id="' + t.custId + '" data-task="' + t.id + '" style="flex:1">写跟进并完成</button>' +
        '<button class="btn" data-act="reschedule" data-id="' + t.id + '">改期</button>' +
        '<button class="btn" data-act="cancel-task" data-id="' + t.id + '">取消</button>'
      : '<button class="btn" data-act="close-drawer" style="flex:1">关闭</button>';
  } else if (d.type === 'agent') {
    const u = getUser(d.id);
    if (!u) return '';
    const uc = visibleCustomers().filter(c => c.ownerId === u.id);
    const ut = visibleTasks().filter(t => t.assigneeId === u.id);
    const today0 = startOfDay(now()).getTime();
    const pend = ut.filter(t => t.status === 'pending');
    const od = pend.filter(t => ts(t.scheduledAt) < today0);
    const un = visibleNotes().filter(n => n.userId === u.id).sort((a, b) => ts(b.at) - ts(a.at));
    title = u.name + ' · 工作预览';
    body = '<div class="kpi" style="grid-template-columns:1fr 1fr;margin-bottom:12px">' +
      kpiCard('负责客户', uc.length, '', '') + kpiCard('当前逾期', od.length, '', od.length ? 'alert' : 'ok') + '</div>' +
      '<div style="font-size:12.5px;color:#98a3b8;margin:10px 0 6px">今日待办</div>' +
      (pend.filter(t => sameDay(new Date(t.scheduledAt), now())).map(t => {
        const c = getCustomer(t.custId);
        return '<div class="item" style="padding:9px 0;border-color:#1c2431"><div class="tm">' + fmtHm(t.scheduledAt) + '</div>' +
          '<div class="bd"><div class="t1">' + (c ? esc(c.name) : '') + ' ' + taskBadge(t) + '</div><div class="t2">' + esc(t.title) + '</div></div></div>';
      }).join('') || '<div class="tiny dim" style="padding:6px 0">今天没有安排</div>') +
      '<div class="hr"></div><div style="font-size:12.5px;color:#98a3b8;margin:6px 0">最近记事</div>' +
      (un.slice(0, 5).map(n => {
        const c = getCustomer(n.custId);
        return '<div style="padding:8px 0;border-bottom:1px solid #1c2431"><div class="tiny">' +
          '<b>' + (c ? esc(c.name) : '') + '</b> ' + resultBadge(n.result) + ' <span class="dim">' + fmtDT(n.at) + '</span></div>' +
          '<div class="tiny dim" style="margin-top:2px">' + esc(n.content) + '</div></div>';
      }).join('') || '<div class="tiny dim">暂无</div>');
    foot = '<button class="btn" data-act="close-drawer" style="flex:1">关闭</button>';
  } else if (d.type === 'stat') {
    title = d.title || '明细';
    const list = d.list || [];
    body = list.length ? '<table style="font-size:12.5px"><thead><tr><th>时间</th><th>客户</th><th>说明</th></tr></thead><tbody>' +
      list.map(x => '<tr><td class="mono tiny">' + fmtDT(x.at) + '</td><td class="tiny">' + x.name + '</td><td class="tiny dim">' + x.text + '</td></tr>').join('') +
      '</tbody></table>' : '<div class="empty">没有明细</div>';
    foot = '<button class="btn" data-act="close-drawer" style="flex:1">关闭</button>';
  }
  return '<div class="drawer-mask" data-act="close-drawer"></div>' +
    '<div class="drawer"><div class="drawer-hd"><h3>' + title + '</h3><button class="x" data-act="close-drawer">×</button></div>' +
    '<div class="drawer-bd">' + body + '</div>' +
    (foot ? '<div class="drawer-ft">' + foot + '</div>' : '') + '</div>';
}

/* ---------- 渲染 ---------- */
function viewHtml() {
  switch (state.view) {
    case 'dashboard': return dashboardView();
    case 'customers': return customersView();
    case 'customer': return customerView();
    case 'calendar': return calendarView();
    case 'notes': return notesView();
    case 'board': return boardView();
    case 'users': return usersView();
    case 'settings': return settingsView();
    default: return '';
  }
}
function render() {
  if (!state.user) { $app.innerHTML = loginView(); return; }
  const sc = document.getElementById('content');
  const st = sc ? sc.scrollTop : 0;
  $app.innerHTML = shell(viewHtml());
  const nc = document.getElementById('content');
  if (nc) nc.scrollTop = st;
}

/* ---------- 交互 ---------- */
function nextId(kind) {
  const map = { customer: 'customer', note: 'note', task: 'task', notif: 'notif' };
  return ++DB.meta.seq[map[kind]];
}
function expireNotifs(taskId) {
  DB.notifications.forEach(n => { if (n.taskId === taskId && n.status !== 'expired') n.status = 'expired'; });
}

document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('mask')) { closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, task = el.dataset.task;
  const A = {
    login() { state.user = getUser(id); state.view = 'dashboard'; state.page = 1; render(); },
    logout() { state.user = null; state.view = 'dashboard'; state.notif = false; render(); },
    nav() { state.view = id; state.page = 1; state.notif = false; state.drawer = null; render(); },
    reset() {
      if (!confirm('重置会清空当前浏览器里的演示数据，恢复初始状态。继续？')) return;
      DB = buildSeed(); saveDB(); state.user = state.user ? getUser(state.user.id) : null; render(); toast('演示数据已重置');
    },
    'open-customer'() { state.custId = +id; state.view = 'customer'; state.drawer = null; render(); },
    'open-task'() { state.drawer = { type: 'task', id: +id }; render(); },
    'open-day'() { state.drawer = { type: 'day', id: id }; render(); },
    'open-agent'() { state.drawer = { type: 'agent', id: +id }; render(); },
    'close-drawer'() { state.drawer = null; render(); },
    'close-modal'() { closeModal(); },
    'new-note'() { state.modal = { type: 'note', custId: +id, taskId: task ? +task : null }; state.drawer = null; render(); },
    'new-task'() { state.modal = { type: 'task', custId: +id }; state.drawer = null; render(); },
    'new-customer'() { state.modal = { type: 'customer', id: null }; render(); },
    'edit-customer'() { state.modal = { type: 'customer', id: +id }; render(); },
    transfer() { state.modal = { type: 'transfer', id: +id }; render(); },
    reschedule() { state.modal = { type: 'reschedule', id: +id }; state.drawer = null; render(); },
    'cancel-task'() { state.modal = { type: 'cancel-task', id: +id }; state.drawer = null; render(); },
    import() { state.modal = { type: 'import' }; render(); },
    export() {
      const n = filteredCustomers().length;
      audit('导出客户', '范围：' + ({ admin: '全部', supervisor: '团队', agent: '本人' }[state.user.role]) + ' · 共 ' + n + ' 条');
      saveDB(); toast('已导出 ' + n + ' 条客户（原型仅演示流程）');
    },
    'import-confirm'() {
      const owner = +document.getElementById('impOwner').value;
      const add = [
        ['林小雨', '13600001111', '宁波恒达五金', '展会', 'B类'],
        ['陈可', '13600002222', '温州嘉禾食品', '电话名单', 'C类'],
        ['黄伟', '13600003333', '绍兴越光纺织', '转介绍', 'A类'],
        ['刘婷', '13600004444', '嘉兴南湖电子', '官网表单', 'B类'],
        ['吴迪', '13600006666', '台州海翔模具', '转介绍', 'A类']
      ];
      add.forEach(r => DB.customers.push({
        id: nextId('customer'), name: r[0], phone: r[1], company: r[2], source: r[3], category: r[4],
        status: '待联系', ownerId: owner, remark: 'XLSX 导入', dnc: false, lastContactAt: null,
        archived: false, version: 1, createdAt: iso(now())
      }));
      audit('导入客户', '批次 #' + ymd(now()).replace(/-/g, '') + '-01 · 成功 5 / 跳过 2 / 失败 1');
      saveDB(); closeModal(); render();
      toast('导入完成：成功 5 条，跳过重复 2 条，失败 1 条');
    },
    'toggle-dnc'() {
      const c = getCustomer(id);
      if (c.dnc) {
        const r = prompt('解除禁止联系需要填写原因：');
        if (!r) return;
        c.dnc = false; audit('解除禁呼', c.name + ' · 原因：' + r);
        DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').forEach(t => {
          t.status = 'cancelled'; t.cancelReason = '客户已解除禁呼，需重新确认意向'; expireNotifs(t.id);
        });
        saveDB(); render(); toast('已解除禁止联系，原待办已取消，请重新安排');
      } else {
        const r = prompt('标记禁止联系需要填写原因：');
        if (!r) return;
        c.dnc = true; c.status = '无意向'; audit('标记禁呼', c.name + ' · 原因：' + r);
        DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').forEach(t => {
          t.status = 'cancelled'; t.cancelReason = '客户标记禁止联系'; expireNotifs(t.id);
        });
        saveDB(); render(); toast('已标记禁止联系，相关待办已取消');
      }
    },
    'toggle-notif'() { state.notif = !state.notif; render(); },
    'open-notif'() {
      const n = DB.notifications.find(x => x.id === +id);
      if (!n) return;
      n.status = 'read'; saveDB();
      state.notif = false;
      if (n.taskId) { state.drawer = { type: 'task', id: n.taskId }; }
      render();
    },
    'read-all'() {
      DB.notifications.filter(n => n.userId === state.user.id).forEach(n => { if (n.status === 'unread') n.status = 'read'; });
      saveDB(); render(); toast('提醒已全部标记为已读');
    },
    page() { state.page = +id; render(); },
    'cal-prev'() { state.calM--; if (state.calM < 0) { state.calM = 11; state.calY--; } render(); },
    'cal-next'() { state.calM++; if (state.calM > 11) { state.calM = 0; state.calY++; } render(); },
    'cal-today'() { state.calY = now().getFullYear(); state.calM = now().getMonth(); render(); },
    'cal-mode'() { state.calMode = id; render(); },
    backup() { audit('手动备份', '生成一致性备份 crm-' + ymd(now()) + '.db'); saveDB(); toast('备份完成（原型模拟）'); },
    'toggle-user'() {
      const u = getUser(id);
      if (u.id === state.user.id) { toast('不能禁用当前登录账号', 'warn'); return; }
      u.active = !u.active;
      audit(u.active ? '启用账号' : '禁用账号', u.name + '（' + u.username + '）');
      saveDB(); render(); toast(u.active ? '账号已启用' : '账号已禁用，会话立即失效');
    },
    'reset-pwd'() {
      const u = getUser(id);
      audit('重置密码', u.name + ' · 生成一次性初始密码，要求首次登录修改');
      saveDB(); toast('已为 ' + u.name + ' 生成初始密码（原型模拟）');
    },
    'new-user'() { state.modal = { type: 'user' }; render(); }
  };
  if (A[act]) { e.preventDefault(); A[act](); }
});

function closeModal() { state.modal = null; render(); }

document.addEventListener('change', e => {
  const el = e.target;
  const ch = el.dataset.change;
  if (ch === 'switch-user') {
    state.user = getUser(el.value); state.view = 'dashboard'; state.page = 1;
    state.drawer = null; state.notif = false; render();
    toast('已切换为 ' + state.user.name + '（' + ({ admin: '管理员', supervisor: '主管', agent: '员工' }[state.user.role]) + '）');
  } else if (ch === 'f-status') { state.fStatus = el.value; state.page = 1; render(); }
  else if (ch === 'f-owner') { state.fOwner = el.value; state.page = 1; render(); }
  else if (ch === 'f-result') { state.fResult = el.value; render(); }
  else if (ch === 'f-emp') { state.fEmp = el.value; render(); }
  else if (ch === 'toggle-next') {
    const box = document.getElementById('nextBox');
    if (box) box.classList.toggle('hidden', !el.checked);
  }
});

let qTimer = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.input === 'q') {
    state.q = el.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      state.page = 1;
      const content = document.getElementById('content');
      const focus = document.activeElement === el;
      render();
      if (focus) {
        const box = document.querySelector('[data-input="q"]');
        if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
      }
    }, 260);
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  const fd = new FormData(f);

  if (kind === 'note') {
    const custId = +f.dataset.cust, taskId = f.dataset.task ? +f.dataset.task : 0;
    const c = getCustomer(custId);
    const note = {
      id: nextId('note'), custId, at: fd.get('at'), result: fd.get('result'),
      content: (fd.get('content') || '').trim(), userId: state.user.id, voided: false
    };
    if (!note.content) { toast('请填写记事内容', 'warn'); return; }
    DB.notes.push(note);
    c.lastContactAt = note.at;
    const st = fd.get('status');
    if (st) c.status = st;
    let msg = '记事已保存';
    if (taskId) {
      const t = getTask(taskId);
      t.status = 'completed'; t.completedAt = note.at; t.completedBy = state.user.id;
      t.completionNoteId = note.id; t.version++;
      expireNotifs(taskId);
      msg = '回访已完成，记事已记录';
    }
    if (fd.get('next') && !c.dnc) {
      DB.tasks.push({
        id: nextId('task'), custId, title: (fd.get('nextTitle') || '后续跟进').trim() || '后续跟进',
        assigneeId: c.ownerId, scheduledAt: fd.get('nextAt'), originalScheduledAt: fd.get('nextAt'),
        status: 'pending', remindBefore: +fd.get('nextRemind') || 30, rescheduleCount: 0,
        completedAt: null, completedBy: null, cancelReason: null, createdAt: iso(now()), version: 1
      });
      msg += '，已安排下次回访';
    }
    if (note.result === '拒绝联系') msg += '；建议标记禁止联系';
    audit('新增记事', c.name + ' · ' + note.result + (taskId ? ' · 完成回访' : ''));
    saveDB(); state.modal = null; state.drawer = null; render(); toast(msg);
  }

  if (kind === 'task') {
    const custId = +f.dataset.cust, c = getCustomer(custId);
    if (c.dnc) { toast('该客户已禁止联系，无法安排回访', 'err'); return; }
    const assignee = fd.get('assignee') ? +fd.get('assignee') : c.ownerId;
    DB.tasks.push({
      id: nextId('task'), custId, title: fd.get('title').trim(),
      assigneeId: assignee, scheduledAt: fd.get('at'), originalScheduledAt: fd.get('at'),
      status: 'pending', remindBefore: +fd.get('remind') || 30, rescheduleCount: 0,
      completedAt: null, completedBy: null, cancelReason: null, createdAt: iso(now()), version: 1
    });
    audit('安排回访', c.name + ' · ' + fd.get('title') + ' · ' + fmtDT(fd.get('at')));
    saveDB(); state.modal = null; render(); toast('回访已安排：' + fmtDT(fd.get('at')));
  }

  if (kind === 'customer') {
    const id = f.dataset.id ? +f.dataset.id : 0;
    const phone = (fd.get('phone') || '').trim();
    const dup = DB.customers.find(x => x.phone === phone && x.id !== id);
    if (dup) { toast('该号码已存在客户：' + dup.name, 'err'); return; }
    if (id) {
      const c = getCustomer(id);
      Object.assign(c, {
        name: fd.get('name').trim(), phone, company: fd.get('company').trim(),
        source: fd.get('source'), category: fd.get('category'),
        status: fd.get('status'), remark: fd.get('remark').trim(), version: c.version + 1
      });
      const newOwner = +fd.get('owner');
      if (newOwner !== c.ownerId) {
        const old = c.ownerId; c.ownerId = newOwner;
        audit('转移客户', c.name + ' · ' + (getUser(old) || {}).name + ' → ' + (getUser(newOwner) || {}).name);
      } else {
        audit('编辑客户', c.name);
      }
      saveDB(); state.modal = null; render(); toast('客户资料已更新');
    } else {
      const c = {
        id: nextId('customer'), name: fd.get('name').trim(), phone,
        company: fd.get('company').trim(), source: fd.get('source'), category: fd.get('category'),
        status: fd.get('status'), ownerId: +fd.get('owner'), remark: fd.get('remark').trim(),
        dnc: false, lastContactAt: null, archived: false, version: 1, createdAt: iso(now())
      };
      DB.customers.push(c);
      audit('新增客户', c.name + ' · ' + c.company);
      saveDB(); state.modal = null; state.view = 'customer'; state.custId = c.id; render();
      toast('客户已创建');
    }
  }

  if (kind === 'reschedule') {
    const t = getTask(f.dataset.id);
    const at = fd.get('at');
    t.scheduledAt = at; t.rescheduleCount++; t.scheduleVersion = (t.scheduleVersion || 0) + 1; t.version++;
    expireNotifs(t.id);
    audit('回访改期', (getCustomer(t.custId) || {}).name + ' · ' + fmtDT(t.originalScheduledAt) + ' → ' + fmtDT(at) + ' · 原因：' + fd.get('reason'));
    saveDB(); state.modal = null; state.drawer = null; render();
    toast('已改期至 ' + fmtDT(at) + '，原提醒已失效');
  }

  if (kind === 'cancel-task') {
    const t = getTask(f.dataset.id);
    t.status = 'cancelled'; t.cancelReason = fd.get('reason'); t.version++;
    expireNotifs(t.id);
    audit('取消回访', (getCustomer(t.custId) || {}).name + ' · 原因：' + fd.get('reason'));
    saveDB(); state.modal = null; state.drawer = null; render(); toast('回访已取消');
  }

  if (kind === 'transfer') {
    const c = getCustomer(f.dataset.id);
    const newOwner = +fd.get('owner'), old = c.ownerId;
    c.ownerId = newOwner;
    let moved = 0;
    if (fd.get('moveTasks')) {
      DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').forEach(t => {
        t.assigneeId = newOwner; moved++;
        DB.notifications.filter(n => n.taskId === t.id).forEach(n => { n.status = 'expired'; });
      });
    }
    audit('转移客户', c.name + ' · ' + (getUser(old) || {}).name + ' → ' + (getUser(newOwner) || {}).name + ' · 同步转移 ' + moved + ' 条回访');
    saveDB(); state.modal = null; render();
    toast('已转给 ' + (getUser(newOwner) || {}).name + '，同步转移 ' + moved + ' 条未完成回访');
  }

  if (kind === 'user') {
    const name = fd.get('name').trim(), username = fd.get('username').trim();
    if (DB.users.some(u => u.username === username)) { toast('账号已存在', 'err'); return; }
    const role = fd.get('role');
    const managerId = fd.get('manager') ? +fd.get('manager') : null;
    if (role === 'agent' && !managerId) { toast('员工必须指定直属主管', 'warn'); return; }
    DB.users.push({
      id: Math.max(...DB.users.map(u => u.id)) + 1, username, name, role,
      managerId: role === 'agent' ? managerId : managerId, active: true,
      canExport: role !== 'agent', canImport: true
    });
    audit('新增账号', name + ' · ' + ({ admin: '管理员', supervisor: '主管', agent: '员工' }[role]));
    saveDB(); state.modal = null; render(); toast('账号已创建，初始密码需首次登录修改');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (state.modal) { closeModal(); }
    else if (state.drawer) { state.drawer = null; render(); }
  }
});

render();
</script>
</body>
</html>
