    audit('重置密码', u.name + ' · 生成一次性初始密码，要求首次登录修改');
    saveDB(); toast('已为 ' + u.name + ' 生成初始密码（原型模拟）');
  },
  'new-user'(id, task) { if (!can('user.manage')) return; state.modal = { type: 'user' }; render(); },
  'edit-user'(id, task) { if (state.user.role !== 'admin') return; state.modal = { type: 'edit-user', id: +id }; render(); },
  'toggle-prefs'(id, task) { state.prefs = !state.prefs; render(); },
  'set-theme'(id, task) { DB.settings.theme = id; saveDB(); applyPrefs(); state.prefs = true; render(); },
  'set-fs'(id, task) { DB.settings.fs = id; saveDB(); applyPrefs(); state.prefs = true; render(); },
  'set-lang'(id, task) { DB.settings.lang = id; saveDB(); applyPrefs(); state.prefs = true; render(); toast(id === 'en' ? 'Language switched to English' : '界面已切换为中文'); },
  'log-tab'(id, task) { state.logTab = id; render(); },
  'call-result'(id, task) { state.callResult = id; render(); },
  'call-skip'(id, task) {
    const q = callQueue();
    if (q.length) { state.callSkip.add(q[0].c.id); state.callResult = ''; state.callNote = ''; state.callStatus = ''; }
    render();
  },
  'call-reset'(id, task) { state.callSkip.clear(); state.callDone.clear(); state.callResult = ''; state.callNote = ''; render(); toast('队列已重新加载'); },
  'call-save'(id, task) { saveCall(); },
  'call-dnc'(id, task) {
    const c = getCustomer(id);
    const r = prompt('标记禁止联系需要填写原因：');
    if (!r) return;
    c.dnc = true; c.status = '无意向';
    DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').forEach(t => {
      t.status = 'cancelled'; t.cancelReason = '客户在呼叫中要求停止联系'; expireNotifs(t.id);
    });
    audit('标记禁呼', c.name + ' · 原因：' + r);
    state.callDone.add(c.id); saveDB(); render(); toast('已标记禁止联系，跳到下一位');
  },
  'change-pwd'(id, task) { state.modal = { type: 'change-pwd' }; render(); },
  'set-pwd'(id, task) {
    const u = getUser(id);
    if (!u) return;
    if (state.user.role !== 'admin' && u.managerId !== state.user.id) { toast('只能重设自己组员的密码', 'err'); return; }
    state.modal = { type: 'set-pwd', userId: u.id, suggest: 'Crm' + Math.floor(100000 + Math.random() * 899999) };
    render();
  },
  'assign-plan'(id, task) {
    if (!can('customer.assign')) return toast('无分配权限', 'err');
    state.modal = { type: 'assign-plan' }; render();
  },
  'team-edit'(id, task) {
    if (state.user.role !== 'admin') return toast('只有管理员可以修改小组', 'err');
    state.modal = { type: 'team', teamId: +id }; render();
  },
  'new-team'(id, task) {
    if (state.user.role !== 'admin') return;
    state.modal = { type: 'team', teamId: 0 }; render();
  },

  /* ---- 客户池 ---- */
  'pool-tab'(id, task) {
    state.selected.clear(); state.page = 1;
    if (id === 'approvals') { state.view = 'approvals'; render(); return; }
    state.poolTab = id; state.view = 'customers';
    if (id === 'recycle' && DB.settings.autoRecycle) runAutoRecycle(true);
    render();
  },
  'pool-claim'(id, task) {
    if (!can('customer.claim')) return toast('没有领取公海客户的权限', 'err');
    const c = getCustomer(id);
    if (!c || c.pool !== 'public') return;
    if (privateCount(state.user.id) >= DB.settings.claimLimit) {
      return toast('已达持有上限 ' + DB.settings.claimLimit + ' 位，先退回一些再领取', 'warn');
    }
    c.pool = 'private'; c.ownerId = state.user.id; c.claimedAt = iso(now());
    audit('领取公海客户', c.name + ' · 保护期 ' + DB.settings.protectDays + ' 天');
    saveDB(); render();
    toast('已领取 ' + c.name + '，' + DB.settings.protectDays + ' 天内要有一次跟进');
  },
  'bulk-claim'(id, task) {
    if (!can('customer.claim')) return;
    const ids = [...state.selected];
    let ok = 0, cap = 0;
    ids.forEach(cid => {
      const c = getCustomer(cid);
      if (!c || c.pool !== 'public') return;
      if (privateCount(state.user.id) >= DB.settings.claimLimit) { cap++; return; }
      c.pool = 'private'; c.ownerId = state.user.id; c.claimedAt = iso(now());
      ok++;
    });
    state.selected.clear();
    if (ok) audit('批量领取公海客户', ok + ' 位');
    saveDB(); render();
    toast(cap ? ('已领取 ' + ok + ' 位，' + cap + ' 位因达到上限跳过') : ('已领取 ' + ok + ' 位'), cap ? 'warn' : 'ok');
  },
  'pool-release'(id, task) {
    if (!can('customer.recycle')) return toast('没有退回公海的权限', 'err');
    const c = getCustomer(id);
    if (!c || c.pool === 'public') return;
    c.pool = 'public'; c.ownerId = null; c.claimedAt = null;
    DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').forEach(t => {
      t.status = 'cancelled'; t.cancelReason = '客户退回公海'; expireNotifs(t.id);
    });
    audit('退回公海', c.name);
    saveDB(); render(); toast(c.name + ' 已退回公海');
  },
  'bulk-release'(id, task) {
    if (!can('customer.recycle')) return;
    const ids = [...state.selected];
    ids.forEach(cid => {
      const c = getCustomer(cid);
      if (!c || c.pool === 'public') return;
      c.pool = 'public'; c.ownerId = null; c.claimedAt = null;
      DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').forEach(t => {
        t.status = 'cancelled'; t.cancelReason = '客户退回公海'; expireNotifs(t.id);
      });
    });
    state.selected.clear();
    audit('批量退回公海', ids.length + ' 位');
    saveDB(); render(); toast('已退回 ' + ids.length + ' 位客户');
  },
  'run-recycle'(id, task) {
    if (!can('customer.recycle')) return;
    const n = runAutoRecycle(false);
    if (!n) toast('没有需要回收的客户');
    render();
  },

  /* ---- 跨组流转 ---- */
  'req-cross'(id, task) {
    const c = getCustomer(id);
    if (!c) return;
    if (c.pool === 'public') return toast('公海客户不需要转组，直接领取即可', 'warn');
    state.modal = { type: 'cross', custId: c.id }; render();
  },
  'req-approve'(id, task) {
    if (!can('customer.approve')) return;
    const r = (DB.requests || []).find(x => x.id === +id);
    if (!r || r.status !== 'pending') return;
    const c = getCustomer(r.custId);
    r.status = 'approved'; r.decidedAt = iso(now()); r.decidedBy = state.user.id;
    if (c) {
      const old = c.ownerId;
      c.pool = 'private'; c.ownerId = r.toId; c.claimedAt = iso(now());
      DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').forEach(t => { t.assigneeId = r.toId; });
      audit('同意跨组流转', c.name + ' · ' + (getUser(old) || {}).name + ' → ' + (getUser(r.toId) || {}).name);
    }
    saveDB(); render(); toast('已同意，客户转到 ' + (getUser(r.toId) || {}).name + ' 名下');
  },
  'req-reject'(id, task) {
    if (!can('customer.approve')) return;
    const r = (DB.requests || []).find(x => x.id === +id);
    if (!r || r.status !== 'pending') return;
    r.status = 'rejected'; r.decidedAt = iso(now()); r.decidedBy = state.user.id;
    audit('驳回跨组流转', (getCustomer(r.custId) || {}).name + ' → ' + (getUser(r.toId) || {}).name);
    saveDB(); render(); toast('已驳回');
  }
};

function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
function saveCall() {
  const q = callQueue();
  if (!q.length) return;
  const cur = q[0], c = cur.c;
  if (!state.callResult) { toast('请先选择联系结果', 'warn'); return; }
  const gate = gateCheck(c);
  if (!gate.ok) { toast(gate.reason, 'warn'); return; }
  const at = iso(now());
  const note = {
    id: nextId('note'), custId: c.id, at, result: state.callResult,
    content: state.callNote.trim() || ('（' + state.callResult + '）'), userId: state.user.id, voided: false
  };
  DB.notes.push(note);
  c.lastContactAt = at;
  if (state.callStatus) c.status = state.callStatus;
  if (cur.t) {
    cur.t.status = 'completed'; cur.t.completedAt = at; cur.t.completedBy = state.user.id;
    cur.t.completionNoteId = note.id; expireNotifs(cur.t.id);
  }
  if (state.callResult === '号码无效') {
    c.invalid = true; c.invalidReason = '呼叫台标记：号码无效';
    DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').forEach(t => {
      t.status = 'cancelled'; t.cancelReason = '号码无效，停止呼叫'; expireNotifs(t.id);
    });
  } else if (state.callResult === '无人接听' || state.callResult === '占线') {
    const a = attemptsOf(c.id);
    if (a.miss < DB.settings.cycleMax && !hasPending(c.id)) {
      const d = addDays(now(), DB.settings.cycleDays); d.setHours(10, 0, 0, 0);
      DB.tasks.push({
        id: nextId('task'), custId: c.id, title: '周期重呼（第 ' + (a.miss + 1) + ' 次）',
        assigneeId: c.ownerId, scheduledAt: iso(d), originalScheduledAt: iso(d),
        status: 'pending', remindBefore: 30, rescheduleCount: 0,
        completedAt: null, completedBy: null, cancelReason: null, createdAt: iso(now()), version: 1
      });
    }
  }
  state.callDone.add(c.id);
  state.callResult = ''; state.callNote = ''; state.callStatus = '';
  audit('呼叫台登记', c.name + ' · ' + note.result);
  saveDB(); render();
  const nq = callQueue();
  toast(nq.length ? '已保存，下一位：' + nq[0].c.name : '已保存，队列已清空');
}

document.addEventListener('click', e => {
  if (e.target.type === 'checkbox' && !e.target.dataset.act) return;
  if (e.target.classList && e.target.classList.contains('mask')) { closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, task = el.dataset.task;
  if (A[act]) { e.preventDefault(); A[act](id, task, el); }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.sel) {
    const sid = +el.dataset.sel;
    if (el.checked) state.selected.add(sid); else state.selected.delete(sid);
    const tr = el.closest('tr');
    if (tr) tr.classList.toggle('sel', el.checked);
    const mount = document.getElementById('bulkMount');
    if (mount) mount.innerHTML = (state.selected.size && state.view === 'customers') ? bulkBar() : '';
    return;
  }
  if (el.dataset.rolePerm) {
    const [role, perm] = el.dataset.rolePerm.split('|');
    if (role === 'admin') return;
    const arr = DB.roles[role] || [];
    if (el.checked) { if (!arr.includes(perm)) arr.push(perm); }
    else { DB.roles[role] = arr.filter(x => x !== perm); }
    audit('修改角色权限', role + ' · ' + perm + (el.checked ? ' 开启' : ' 关闭'));
    saveDB(); render(); toast('权限已更新');
    return;
  }
  if (el.dataset.userPerm) {
    const pu = getUser(state.permUser || DB.users[0].id);
    if (!pu) return;
    pu.extra = pu.extra || [];
    if (el.checked) { if (!pu.extra.includes(el.dataset.userPerm)) pu.extra.push(el.dataset.userPerm); }
    else pu.extra = pu.extra.filter(x => x !== el.dataset.userPerm);
    audit('个人授权', pu.name + ' · ' + el.dataset.userPerm + (el.checked ? ' 授予' : ' 撤销'));
    saveDB(); render(); toast('个人权限已更新');
    return;
  }
  if (el.dataset.set) {
    const k = el.dataset.set;
    DB.settings[k] = el.type === 'checkbox' ? el.checked : Math.max(1, +el.value || 1);
    audit('修改系统设置', k + ' = ' + DB.settings[k]);
    saveDB(); render(); toast('设置已保存');
    return;
  }
  const ch = el.dataset.change;
  if (ch === 'switch-user') {
    state.user = getUser(el.value); state.view = homeView(); state.page = 1;
    state.drawer = null; state.notif = false; state.selected.clear(); state.revealed.clear();
    render(); toast('已切换为 ' + state.user.name);
  } else if (ch === 'f-status') { state.fStatus = el.value; state.page = 1; render(); }
  else if (ch === 'f-owner') { state.fOwner = el.value; state.page = 1; render(); }
  else if (ch === 'f-quality') { state.fQuality = el.value; state.page = 1; render(); }
  else if (ch === 'f-result') { state.fResult = el.value; render(); }
  else if (ch === 'f-emp') { state.fEmp = el.value; render(); }
  else if (ch === 'perm-user') { state.permUser = el.value; render(); }
  else if (ch === 'toggle-next') {
    const box = document.getElementById('nextBox');
    if (box) box.classList.toggle('hidden', !el.checked);
  }
});

let qTimer = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.input === 'q') {
    state.q = el.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      state.page = 1;
      render();
      const box = document.querySelector('[data-input="q"]');
      if (box && document.activeElement !== box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
    }, 260);
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  const fd = new FormData(f);

  if (kind === 'login') {
    const ok = doLogin(fd.get('username') || '', fd.get('password') || '');
    if (ok) { render(); toast('欢迎回来，' + state.user.name); }
    else { render(); }
    return;
  }

  if (kind === 'note') {
    const custId = +f.dataset.cust, taskId = f.dataset.task ? +f.dataset.task : 0;
    const c = getCustomer(custId);
    const gateN = gateCheck(c);
    if (!gateN.ok) { toast(gateN.reason, 'warn'); return; }
    const note = {
      id: nextId('note'), custId, at: fd.get('at'), result: fd.get('result'),
      content: (fd.get('content') || '').trim(), userId: state.user.id, voided: false
    };
    if (!note.content) { toast('请填写记事内容', 'warn'); return; }
    DB.notes.push(note);
    c.lastContactAt = note.at;
    const st = fd.get('status');
    if (st) c.status = st;
    let msg = '记事已保存';
    if (taskId) {
      const t = getTask(taskId);
      t.status = 'completed'; t.completedAt = note.at; t.completedBy = state.user.id;
      t.completionNoteId = note.id; t.version++;
      expireNotifs(taskId);
      msg = '回访已完成，记事已记录';
    }
    if (fd.get('next') && !c.dnc) {
      DB.tasks.push({
        id: nextId('task'), custId, title: (fd.get('nextTitle') || '后续跟进').trim() || '后续跟进',
        assigneeId: c.ownerId, scheduledAt: fd.get('nextAt'), originalScheduledAt: fd.get('nextAt'),
        status: 'pending', remindBefore: +fd.get('nextRemind') || 30, rescheduleCount: 0,
        completedAt: null, completedBy: null, cancelReason: null, createdAt: iso(now()), version: 1
      });
      msg += '，已安排下次回访';
    }
    if (note.result === '号码无效') msg += '；建议标记无效号码';
    audit('新增记事', c.name + ' · ' + note.result + (taskId ? ' · 完成回访' : ''));
    saveDB(); state.modal = null; state.drawer = null; render(); toast(msg);
    return;
  }

  if (kind === 'task') {
    const custId = +f.dataset.cust, c = getCustomer(custId);
    if (c.dnc) { toast('该客户已禁止联系，无法安排回访', 'err'); return; }
    if (c.invalid) { toast('该客户号码已标记无效，无法安排回访', 'err'); return; }
    const assignee = fd.get('assignee') ? +fd.get('assignee') : c.ownerId;
    DB.tasks.push({
      id: nextId('task'), custId, title: fd.get('title').trim(),
      assigneeId: assignee, scheduledAt: fd.get('at'), originalScheduledAt: fd.get('at'),
      status: 'pending', remindBefore: +fd.get('remind') || 30, rescheduleCount: 0,
      completedAt: null, completedBy: null, cancelReason: null, createdAt: iso(now()), version: 1
    });
    audit('安排回访', c.name + ' · ' + fd.get('title') + ' · ' + fmtDT(fd.get('at')));
    saveDB(); state.modal = null; render(); toast('回访已安排：' + fmtDT(fd.get('at')));
    return;
  }

  if (kind === 'customer') {
    const id = f.dataset.id ? +f.dataset.id : 0;
    const phone = (fd.get('phone') || '').trim();
    const dup = DB.customers.find(x => normPhone(x.phone) === normPhone(phone) && x.id !== id && !x.mergedInto);
    if (dup) { toast('该号码已存在客户：' + dup.name + '（负责人 ' + (getUser(dup.ownerId) || {}).name + '）', 'err'); return; }
    if (id) {
      const c = getCustomer(id);
      Object.assign(c, {
        name: fd.get('name').trim(), phone, company: fd.get('company').trim(),
        source: fd.get('source'), category: fd.get('category'),
        status: fd.get('status'), remark: fd.get('remark').trim(), version: c.version + 1
      });
      const newOwner = fd.get('owner') ? +fd.get('owner') : c.ownerId;
      if (newOwner !== c.ownerId) {
        const old = c.ownerId; c.ownerId = newOwner;
        audit('转移客户', c.name + ' · ' + (getUser(old) || {}).name + ' → ' + (getUser(newOwner) || {}).name);
      } else audit('编辑客户', c.name);
      saveDB(); state.modal = null; render(); toast('客户资料已更新');
    } else {
      const c = {
        id: nextId('customer'), name: fd.get('name').trim(), phone,
        company: fd.get('company').trim(), source: fd.get('source'), category: fd.get('category'),
        status: fd.get('status'), ownerId: fd.get('owner') ? +fd.get('owner') : state.user.id,
        remark: fd.get('remark').trim(), dnc: false, invalid: false, invalidReason: null, mergedInto: null,
        lastContactAt: null, archived: false, version: 1, createdAt: iso(now())
      };
      DB.customers.push(c);
      audit('新增客户', c.name + ' · ' + c.company);
      saveDB(); state.modal = null; state.view = 'customer'; state.custId = c.id; render();
      toast('客户已创建');
    }
    return;
  }

  if (kind === 'reschedule') {
    const t = getTask(f.dataset.id);
    const at = fd.get('at');
    t.scheduledAt = at; t.rescheduleCount++; t.scheduleVersion = (t.scheduleVersion || 0) + 1; t.version++;
    expireNotifs(t.id);
    audit('回访改期', (getCustomer(t.custId) || {}).name + ' · ' + fmtDT(t.originalScheduledAt) + ' → ' + fmtDT(at) + ' · 原因：' + fd.get('reason'));
    saveDB(); state.modal = null; state.drawer = null; render();
    toast('已改期至 ' + fmtDT(at) + '，原提醒已失效');
    return;
  }

  if (kind === 'cancel-task') {
    const t = getTask(f.dataset.id);
    t.status = 'cancelled'; t.cancelReason = fd.get('reason'); t.version++;
    expireNotifs(t.id);
    audit('取消回访', (getCustomer(t.custId) || {}).name + ' · 原因：' + fd.get('reason'));
    saveDB(); state.modal = null; state.drawer = null; render(); toast('回访已取消');
    return;
  }

  if (kind === 'transfer') {
    const c = getCustomer(f.dataset.id);
    const newOwner = +fd.get('owner'), old = c.ownerId;
    c.ownerId = newOwner;
    let moved = 0;
    if (fd.get('moveTasks')) {
      DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').forEach(t => {
        t.assigneeId = newOwner; moved++;
        DB.notifications.filter(n => n.taskId === t.id).forEach(n => { n.status = 'expired'; });
      });
    }
    audit('转移客户', c.name + ' · ' + (getUser(old) || {}).name + ' → ' + (getUser(newOwner) || {}).name + ' · 同步转移 ' + moved + ' 条回访');
    saveDB(); state.modal = null; render();
    toast('已转给 ' + (getUser(newOwner) || {}).name + '，同步转移 ' + moved + ' 条未完成回访');
    return;
  }

  if (kind === 'bulk-assign') {
    const newOwner = +fd.get('owner');
    const ids = [...state.selected];
    let moved = 0;
    ids.forEach(cid => {
      const c = getCustomer(cid);
      if (!c) return;
      c.ownerId = newOwner;
      if (fd.get('moveTasks')) {
        DB.tasks.filter(t => t.custId === cid && t.status === 'pending').forEach(t => {
          t.assigneeId = newOwner; moved++;
          DB.notifications.filter(n => n.taskId === t.id).forEach(n => { n.status = 'expired'; });
        });
      }
    });
    if (fd.get('notify')) {
      DB.notifications.unshift({
        id: nextId('notif'), userId: newOwner, taskId: 0,
        title: '收到 ' + ids.length + ' 位新客户', body: '由 ' + state.user.name + ' 分配，请尽快首次联系',
        createdAt: iso(now()), status: 'unread'
      });
    }
    audit('批量分配', ids.length + ' 位客户 → ' + (getUser(newOwner) || {}).name + ' · 同步转移 ' + moved + ' 条回访');
    state.selected.clear(); saveDB(); state.modal = null; render();
    toast('已把 ' + ids.length + ' 位客户分配给 ' + (getUser(newOwner) || {}).name);
    return;
  }

  if (kind === 'merge') {
    const g = dupGroups()[+f.dataset.gi];
    if (!g) return;
    const master = getCustomer(+fd.get('master'));
    let movedNotes = 0, movedTasks = 0;
    g.items.filter(c => c.id !== master.id).forEach(c => {
      DB.notes.forEach(n => { if (n.custId === c.id) { n.custId = master.id; movedNotes++; } });
      DB.tasks.forEach(t => {
        if (t.custId === c.id) {
          if (t.status === 'pending') { t.custId = master.id; movedTasks++; }
          else t.custId = master.id;
        }
      });
      if (!master.lastContactAt && c.lastContactAt) master.lastContactAt = c.lastContactAt;
      c.mergedInto = master.id;
    });
    audit('合并重复客户', '主记录 ' + master.name + ' · 合并 ' + (g.items.length - 1) + ' 条 · 转移记事 ' + movedNotes + ' / 回访 ' + movedTasks);
    saveDB(); state.modal = null; render();
    toast('已合并到「' + master.name + '」，转移 ' + movedNotes + ' 条记事、' + movedTasks + ' 条待办');
    return;
  }

  if (kind === 'import') {
    const mode = fd.get('mode');
    const targets = assignTargets().filter(u => u.role === 'agent');
    const pool = targets.length ? targets : assignTargets();
    const add = [
      ['林小雨', '13600001111', '宁波恒达五金', '展会', 'B类'],
      ['陈可', '13600002222', '温州嘉禾食品', '电话名单', 'C类'],
      ['黄伟', '13600003333', '绍兴越光纺织', '转介绍', 'A类'],
      ['刘婷', '13600004444', '嘉兴南湖电子', '官网表单', 'B类'],
      ['吴迪', '13600006666', '台州海翔模具', '转介绍', 'A类']
    ];
    const counts = {};
    add.forEach((r, i) => {
      let owner;
      if (mode === 'single') owner = +fd.get('owner');
      else if (mode === 'even' && pool.length) owner = pool[i % pool.length].id;
      else owner = state.user.id;
      counts[owner] = (counts[owner] || 0) + 1;
      DB.customers.push({
        id: nextId('customer'), name: r[0], phone: r[1], company: r[2], source: r[3], category: r[4],
        status: '待联系', ownerId: owner, remark: 'XLSX 导入 · 批次 ' + ymd(now()),
        dnc: false, invalid: false, invalidReason: null, mergedInto: null,
        lastContactAt: null, archived: false, version: 1, createdAt: iso(now())
      });
    });
    const dist = Object.keys(counts).map(uid => (getUser(uid) || {}).name + ' ' + counts[uid]).join('、');
    audit('导入客户', '成功 5 / 跳过 2 / 失败 1 · 分配：' + dist);
    saveDB(); state.modal = null; state.view = 'customers'; state.page = 1; render();
    toast('导入完成：5 条已入库，分配给 ' + dist);
    return;
  }

  if (kind === 'export') {
    const scope = fd.get('scope'), mask = fd.get('mask');
    let list = scope === 'mine' ? visibleCustomers().filter(c => c.ownerId === state.user.id) : filteredCustomers();
    const limit = DB.settings.exportLimit;
    const over = list.length > limit;
    if (over) list = list.slice(0, limit);
    if (mask === 'full' && !can('customer.export.full')) { toast('你没有导出明文号码的权限', 'err'); return; }
    audit('导出客户', (mask === 'full' ? '明文' : '脱敏') + ' · ' + (scope === 'mine' ? '仅本人' : '当前筛选') + ' · ' + ({ admin: '全部', supervisor: '团队', agent: '本人' }[state.user.role]) + ' · ' + list.length + ' 条' + (over ? '（已达上限截断）' : ''));
    saveDB(); state.modal = null; render();
    toast('已导出 ' + list.length + ' 条（' + (mask === 'full' ? '明文' : '脱敏') + '）' + (over ? '，超出上限已截断' : '') + '，本次操作已记审计');
    return;
  }

  if (kind === 'user') {
    const name = fd.get('name').trim(), username = fd.get('username').trim();
    if (DB.users.some(u => u.username === username)) { toast('账号已存在', 'err'); return; }
    const role = state.user.role === 'admin' ? fd.get('role') : 'agent';
    const managerId = fd.get('manager') ? +fd.get('manager') : (state.user.role === 'admin' ? null : state.user.id);
    if (role === 'agent' && !managerId) { toast('员工必须指定直属主管', 'warn'); return; }
    DB.users.push({
      id: Math.max(...DB.users.map(u => u.id)) + 1, username, name, role,
      managerId, active: true, pwd: '123456', extra: []
    });
    audit('新增账号', name + ' · ' + ({ admin: '管理员', supervisor: '主管', agent: '员工' }[role]) + ' · 初始密码需首次登录修改');
    saveDB(); state.modal = null; render(); toast('账号已创建，初始密码需首次登录修改');
    return;
  }

  if (kind === 'edit-user') {
    const u = getUser(f.dataset.id);
    const role = fd.get('role');
    u.name = fd.get('name').trim();
    u.role = role;
    u.managerId = fd.get('manager') ? +fd.get('manager') : null;
    audit('编辑账号', u.name + ' · 角色 ' + role + ' · 直属 ' + (u.managerId ? (getUser(u.managerId) || {}).name : '无'));
    saveDB(); state.modal = null; render(); toast('账号已更新，数据范围随之变化');
    return;
  }

  if (kind === 'change-pwd') {
    const u = state.user;
    const old = fd.get('old'), p1 = fd.get('p1'), p2 = fd.get('p2');
    if (old !== u.pwd) { toast('当前密码不正确', 'err'); return; }
    if (String(p1).length < 6) { toast('新密码至少 6 位', 'warn'); return; }
    if (p1 !== p2) { toast('两次输入的新密码不一致', 'err'); return; }
    if (p1 === old) { toast('新密码不能与当前密码相同', 'warn'); return; }
    u.pwd = p1; u.mustChange = false;
    audit('修改密码', u.name + ' 修改了自己的密码');
    saveDB(); state.modal = null; render(); toast('密码已更新');
    return;
  }

  if (kind === 'set-pwd') {
    const u = getUser(f.dataset.id);
    const p1 = fd.get('p1'), p2 = fd.get('p2');
    if (u.id === state.user.id && fd.get('old') !== u.pwd) { toast('当前密码不正确', 'err'); return; }
    if (String(p1).length < 6) { toast('新密码至少 6 位', 'warn'); return; }
    if (p1 !== p2) { toast('两次输入的新密码不一致', 'err'); return; }
    u.pwd = p1;
    if (u.id !== state.user.id) u.mustChange = true;
    audit('重设密码', u.name + '（' + u.username + '）· 由 ' + state.user.name + ' 重设，下次登录需修改');
    saveDB(); state.modal = null; render();
    toast(u.id === state.user.id ? '密码已更新' : '已重设 ' + u.name + ' 的密码，请告知临时密码');
    return;
  }

  if (kind === 'assign-plan') {
    const targets = fd.getAll('t').map(Number).filter(Boolean);
    if (!targets.length) { toast('至少选择一名组员', 'warn'); return; }
    const count = Math.min(1000, Math.max(1, +fd.get('count') || 0));
    if (count < 50) { toast('批量分配最少 50 位；少量客户请用「分配给…」', 'warn'); return; }
    const scope = fd.get('scope'), mode = fd.get('mode');
    let pool;
    if (scope === 'mine') pool = visibleCustomers().filter(c => c.ownerId === state.user.id);
    else if (scope === 'team') pool = visibleCustomers();
    else pool = filteredCustomers();
    if (!fd.get('includeOwned')) pool = pool.filter(c => !targets.includes(c.ownerId));
    pool = pool.filter(c => !c.dnc);
    if (mode === 'rand') pool = shuffle(pool);
    const picked = pool.slice(0, count);
    if (!picked.length) { toast('客户池里没有可分配的客户', 'warn'); return; }
    const counts = {};
    picked.forEach((c, i) => {
      const owner = targets[i % targets.length];
      c.ownerId = owner;
      counts[owner] = (counts[owner] || 0) + 1;
      if (fd.get('moveTasks')) {
        DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').forEach(t => {
          t.assigneeId = owner;
          DB.notifications.filter(n => n.taskId === t.id).forEach(n => { n.status = 'expired'; });
        });
      }
    });
    const dist = Object.keys(counts).map(uid => (getUser(+uid) || {}).name + ' ' + counts[uid]).join('、');
    targets.forEach(uid => DB.notifications.unshift({
      id: nextId('notif'), userId: uid, taskId: 0,
      title: '收到 ' + (counts[uid] || 0) + ' 位新客户',
      body: '由 ' + state.user.name + ' 分配（' + (mode === 'rand' ? '随机' : '顺序') + '），请尽快首次联系',
      createdAt: iso(now()), status: 'unread'
    }));
    audit('按数量分配', picked.length + ' 位客户 · ' + (mode === 'rand' ? '随机' : '顺序') + ' · ' + dist);
    saveDB(); state.modal = null; render();
    toast('已分配 ' + picked.length + ' 位：' + dist);
    return;
  }

  if (kind === 'team') {
    const name = fd.get('name').trim();
    const sid = +fd.get('supervisor');
    if (!name) { toast('请填写小组名', 'warn'); return; }
    if (DB.teams.some(t => t.name === name && String(t.id) !== f.dataset.id)) { toast('已有同名小组', 'warn'); return; }
    let t = f.dataset.id ? DB.teams.find(x => x.id === +f.dataset.id) : null;
    if (t) {
      t.name = name; t.supervisorId = sid;
      audit('设置小组', t.name + ' · 组长 ' + (getUser(sid) || {}).name);
      toast('小组已更新');
    } else {
      t = { id: nextId('team'), name, supervisorId: sid };
      DB.teams.push(t);
      audit('新建小组', t.name + ' · 组长 ' + (getUser(sid) || {}).name);
      toast('小组已创建，去「转移组员」把员工放进来');
    }
    saveDB(); state.modal = null; render();
    return;
  }

  if (kind === 'cross') {
    const c = getCustomer(f.dataset.id);
    const toId = +fd.get('to');
    if (!c) return;
    if (!toId) { toast('没有可选的组', 'err'); return; }
    const reason = (fd.get('reason') || '').trim();
    if (DB.settings.crossApprove) {
      DB.requests.unshift({
        id: nextId('request'), type: 'cross', custId: c.id,
        fromId: c.ownerId || state.user.id, toId, reason,
        status: 'pending', createdAt: iso(now()), decidedAt: null, decidedBy: null
      });
      audit('申请跨组流转', c.name + ' → ' + (getUser(toId) || {}).name);
      saveDB(); state.modal = null; render();
      toast('已提交，等待 ' + (getUser(toId) || {}).name + ' 审批');
    } else {
      const old = c.ownerId;
      c.pool = 'private'; c.ownerId = toId; c.claimedAt = iso(now());
      DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').forEach(t => { t.assigneeId = toId; });
      audit('跨组流转', c.name + ' · ' + (getUser(old) || {}).name + ' → ' + (getUser(toId) || {}).name + (reason ? ' · ' + reason : ''));
      saveDB(); state.modal = null; render();
      toast('客户已转到 ' + (getUser(toId) || {}).name);
    }
    return;
  }

  if (kind === 'move-member') {
    const uid = +fd.get('member'), sid = +fd.get('supervisor');
    const u = getUser(uid);
    if (state.user.role !== 'admin') { toast('只有管理员可以转移组员', 'err'); return; }
    const old = u.managerId;
    if (old === sid) { toast(u.name + ' 已在该组', 'warn'); return; }
    u.managerId = sid;
    audit('转移组员', u.name + ' · ' + (getUser(old) || {}).name + ' → ' + (getUser(sid) || {}).name);
    saveDB(); render();
    toast(u.name + ' 已转给 ' + (getUser(sid) || {}).name);
    return;
  }
});

document.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const typing = /INPUT|TEXTAREA|SELECT/.test(tag);
  if (e.key === 'Escape') {
    if (state.modal) closeModal();
    else if (state.drawer) { state.drawer = null; render(); }
    return;
  }
  if (!typing && e.key === '/' && state.user) {
    const g = document.getElementById('gq');
    if (g) { e.preventDefault(); g.focus(); }
    return;
  }
  const gq = document.getElementById('gq');
  if (gq && document.activeElement === gq && e.key === 'Enter') {
    e.preventDefault();
    state.q = gq.value.trim(); state.view = 'customers'; state.poolTab = 'mine'; state.page = 1;
    gq.blur(); render();
    return;
  }
  if (state.view === 'call' && !typing && !state.modal) {
    const R = ['已接通', '无人接听', '占线', '号码无效', '拒绝联系'];
    if (/^[1-5]$/.test(e.key)) { e.preventDefault(); A['call-result'](R[+e.key - 1]); return; }
    if (e.key === 'Enter') { e.preventDefault(); A['call-save'](); return; }
    if (e.key === 'ArrowRight' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); A['call-skip'](); return; }
  }
});

// favicon 用同一张 logo，避免重复内联
(function () {
  try {
    const lk = document.createElement('link');
    lk.rel = 'icon'; lk.type = 'image/png'; lk.href = LOGO;
    document.head.appendChild(lk);
  } catch (e) { }
})();

/* ---------- 会话恢复 ---------- */
(function boot() {
  let sid = null;
  try { sid = localStorage.getItem(SESS); } catch (e) { }
  if (sid) {
    const u = getUser(+sid);
    if (u && u.active) state.user = u;
  }
  if (state.user) state.view = homeView();
  render();
})();
</script>
