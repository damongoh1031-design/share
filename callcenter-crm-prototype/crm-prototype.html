<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>外呼 CRM · 交互原型 v2.0</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0c0f15; --bg2:#11151d; --panel:#151a23; --panel2:#1a212c; --panel3:#202836;
  --line:#232b39; --line2:#2d3748;
  --tx:#e8ecf4; --tx2:#98a3b8; --tx3:#69748a;
  --blue:#4c8dff; --green:#2ecc8f; --amber:#f5a524; --red:#f0556b; --purple:#a78bfa; --slate:#66718a;
  --th:#131923; --hover:#161d27; --hover2:#1a212c; --cellline:#1c2431; --dimcell:#10141c;
  --avbg:#243044; --avtx:#9db6dd; --chipbg:#1e2635; --chipbd:#2b3546;
  --r:10px; --fs:1;
}
html[data-theme="light"]{
  --bg:#f4f6fa; --bg2:#ffffff; --panel:#ffffff; --panel2:#f4f6fa; --panel3:#e8edf5;
  --line:#e3e8f0; --line2:#cfd7e4;
  --tx:#17202e; --tx2:#536076; --tx3:#8792a6;
  --blue:#2563eb; --green:#0f9d68; --amber:#b8760a; --red:#d1344c; --purple:#7c5cd6; --slate:#6b7789;
  --th:#f7f9fc; --hover:#f4f7fb; --hover2:#eef3f9; --cellline:#e9eef5; --dimcell:#eef1f6;
  --avbg:#dde7f6; --avtx:#2f4f7d; --chipbg:#eef2f8; --chipbd:#d7dfea;
}
html[data-theme="contrast"]{
  --bg:#000000; --bg2:#000000; --panel:#080808; --panel2:#111111; --panel3:#1c1c1c;
  --line:#6a6a6a; --line2:#9a9a9a;
  --tx:#ffffff; --tx2:#f0f0f0; --tx3:#c8c8c8;
  --blue:#79b8ff; --green:#4ae3a0; --amber:#ffc247; --red:#ff7d8f; --purple:#c4b1ff; --slate:#b8c0cf;
  --th:#141414; --hover:#1a1a1a; --hover2:#222222; --cellline:#3a3a3a; --dimcell:#0a0a0a;
  --avbg:#1f1f1f; --avtx:#ffffff; --chipbg:#1c1c1c; --chipbd:#7a7a7a;
}
html[data-theme="eye"]{
  --bg:#dde8d3; --bg2:#e7f0dd; --panel:#f1f7ea; --panel2:#e8f1de; --panel3:#dbe8cf;
  --line:#c2d3b4; --line2:#a9bf99;
  --tx:#1d2a1a; --tx2:#42533c; --tx3:#6b7d63;
  --blue:#2f6b46; --green:#2f7a4a; --amber:#8a6316; --red:#a83328; --purple:#5b4a8a; --slate:#5f6f58;
  --th:#e2eed7; --hover:#e6f0da; --hover2:#dcead0; --cellline:#cfdec2; --dimcell:#d6e3c9;
  --avbg:#d3e3c4; --avtx:#33502b; --chipbg:#e4efd9; --chipbd:#bccfad;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  font:calc(14px * var(--fs))/1.55 "Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a3342;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;height:100vh;overflow:hidden}
.side{width:212px;flex:0 0 212px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:16px 16px 13px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:calc(15px * var(--fs));letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.brand .dot{width:8px;height:8px;border-radius:2px;background:var(--blue);box-shadow:0 0 10px var(--blue)}
.brand p{margin:4px 0 0;font-size:calc(11px * var(--fs));color:var(--tx3);letter-spacing:.3px}
.nav{flex:1;padding:9px 8px;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:2px 0;border-radius:8px;
  color:var(--tx2);cursor:pointer;font-size:calc(13.5px * var(--fs));transition:.14s}
.nav a:hover{background:#18202b;color:var(--tx)}
.nav a.on{background:rgba(76,141,255,.15);color:#cfe0ff;box-shadow:inset 2px 0 0 var(--blue)}
.nav a .ic{width:16px;text-align:center;font-size:calc(13px * var(--fs));opacity:.9}
.nav .grp{font-size:calc(10.5px * var(--fs));color:#4f5a6e;padding:12px 12px 4px;letter-spacing:1px}
.side-ft{padding:11px 14px;border-top:1px solid var(--line);font-size:calc(11px * var(--fs));color:var(--tx3);line-height:1.7}
.side-ft b{color:var(--tx2);font-weight:500}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:54px;flex:0 0 54px;border-bottom:1px solid var(--line);background:var(--bg2);
  display:flex;align-items:center;gap:12px;padding:0 18px}
.top .crumb{font-size:calc(13px * var(--fs));color:var(--tx2)}
.top .crumb b{color:var(--tx);font-weight:500}
.top .sp{flex:1}
.content{flex:1;overflow:auto;padding:18px 20px 90px}

.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--tx);font-size:calc(13px * var(--fs));cursor:pointer;transition:.14s;white-space:nowrap}
.btn:hover{background:var(--panel3);border-color:#3a465c}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#3d7ef2}
.btn.ghost{background:transparent}
.btn.sm{height:26px;padding:0 9px;font-size:calc(12px * var(--fs));border-radius:6px}
.btn.danger{color:#ffb4be;border-color:#5a2a35;background:#2a1820}
.btn.danger:hover{background:#3a1d27}
.btn:disabled{opacity:.4;cursor:not-allowed}
select,input,textarea{font-family:inherit;font-size:calc(13px * var(--fs));background:var(--panel2);color:var(--tx);
  border:1px solid var(--line2);border-radius:8px;padding:7px 9px;outline:none;width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(76,141,255,.13)}
textarea{resize:vertical;line-height:1.6}
label.fl{display:block;font-size:calc(12px * var(--fs));color:var(--tx2);margin:0 0 5px}
.field{margin-bottom:12px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card-hd{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.card-hd h3{margin:0;font-size:calc(13.5px * var(--fs));font-weight:500;letter-spacing:.2px}
.card-hd .sp{flex:1}
.card-bd{padding:14px 15px}
.card-bd.tight{padding:0}
.muted{color:var(--tx2)}
.dim{color:var(--tx3)}
.tiny{font-size:calc(11.5px * var(--fs))}
.mono{font-variant-numeric:tabular-nums;font-family:"JetBrains Mono",Consolas,monospace}
.badge{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:5px;font-size:calc(11.5px * var(--fs));white-space:nowrap;border:1px solid transparent}
.b-slate{background:rgba(102,113,138,.16);color:#a8b3c8;border-color:rgba(102,113,138,.3)}
.b-blue{background:rgba(76,141,255,.14);color:#8fb8ff;border-color:rgba(76,141,255,.3)}
.b-amber{background:rgba(245,165,36,.13);color:#f7c46a;border-color:rgba(245,165,36,.28)}
.b-green{background:rgba(46,204,143,.13);color:#5fe0ae;border-color:rgba(46,204,143,.28)}
.b-red{background:rgba(240,85,107,.13);color:#ff96a5;border-color:rgba(240,85,107,.3)}
.b-purple{background:rgba(167,139,250,.14);color:#c4b1ff;border-color:rgba(167,139,250,.3)}
.b-gray{background:rgba(120,130,150,.1);color:#7e8899;border-color:rgba(120,130,150,.22)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi .k{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi .k .lb{font-size:calc(12px * var(--fs));color:var(--tx2)}
.kpi .k .vl{font-size:calc(27px * var(--fs));font-weight:600;margin-top:6px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .k .sub{font-size:calc(11.5px * var(--fs));color:var(--tx3);margin-top:2px}
.kpi .k.alert .vl{color:#ff8b9b}
.kpi .k.ok .vl{color:#5fe0ae}
table{width:100%;border-collapse:collapse;font-size:calc(13px * var(--fs))}
th{text-align:left;font-weight:500;color:var(--tx2);font-size:calc(12px * var(--fs));padding:9px 12px;background:var(--th);
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:10px 12px;border-bottom:1px solid var(--cellline);vertical-align:middle}
tbody tr:hover{background:var(--hover)}
tbody tr.click{cursor:pointer}
tbody tr:last-child td{border-bottom:none}
tbody tr.sel{background:rgba(76,141,255,.07)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow:auto}
.empty{padding:40px 20px;text-align:center;color:var(--tx3);font-size:calc(13px * var(--fs))}
.pager{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:calc(12px * var(--fs));color:var(--tx2)}
.pager .sp{flex:1}
.grid-2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:14px;align-items:start}
.stack>*+*{margin-top:14px}
.hr{height:1px;background:var(--line);margin:12px 0}
.hidden{display:none!important}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;background:var(--chipbg);color:#9fb0c8;font-size:calc(11px * var(--fs));margin-right:4px}
.item{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid var(--cellline)}
.item:last-child{border-bottom:none}
.item:hover{background:var(--hover)}
.item .tm{width:48px;flex:0 0 48px;font-size:calc(12.5px * var(--fs));color:var(--tx2);font-variant-numeric:tabular-nums}
.item .bd{flex:1;min-width:0}
.item .bd .t1{font-size:calc(13px * var(--fs));display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.item .bd .t2{font-size:calc(11.5px * var(--fs));color:var(--tx3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ops{display:flex;gap:6px;opacity:.55;transition:.15s}
.item:hover .ops{opacity:1}
.avatar{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
  font-size:calc(11.5px * var(--fs));background:var(--avbg);color:var(--avtx);flex:0 0 26px;font-weight:500}

.calbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .wd{background:var(--th);padding:8px;text-align:center;color:var(--tx2);font-size:calc(12px * var(--fs))}
.cal .cell{background:var(--panel);min-height:92px;padding:6px 8px;cursor:pointer;position:relative;transition:.12s}
.cal .cell:hover{background:var(--hover2)}
.cal .cell.dim{background:var(--dimcell);color:var(--tx3)}
.cal .cell .d{font-size:calc(12px * var(--fs));color:var(--tx2);font-variant-numeric:tabular-nums}
.cal .cell.dim .d{color:#4d5668}
.cal .cell.today .d{color:#fff;background:var(--blue);width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:calc(11.5px * var(--fs))}
.cal .cell .n{position:absolute;right:8px;top:7px;font-size:calc(11px * var(--fs));color:var(--tx2)}
.cal .cell .ev{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.cal .cell .ev span{font-size:calc(10.5px * var(--fs));padding:1px 5px;border-radius:4px;background:var(--chipbg);color:#9fb0c8;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .cell .ev span.od{background:rgba(240,85,107,.16);color:#ff96a5}
.cal .cell .ev span.dn{background:rgba(46,204,143,.13);color:#5fe0ae}
.cal .cell .ev span.cn{background:#1a1f29;color:#5d6779;text-decoration:line-through}

.mask{position:fixed;inset:0;background:rgba(6,9,14,.62);backdrop-filter:blur(2px);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:56px 20px 20px;overflow:auto}
.modal{width:100%;max-width:540px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;
  box-shadow:0 24px 60px rgba(0,0,0,.55);animation:pop .16s ease-out}
.modal.wide{max-width:720px}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.99)}to{opacity:1;transform:none}}
.modal-hd{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-hd h3{margin:0;font-size:calc(14px * var(--fs));font-weight:500}
.modal-hd .x{margin-left:auto;background:none;border:none;color:var(--tx2);font-size:calc(20px * var(--fs));cursor:pointer;line-height:1;padding:0 2px}
.modal-hd .x:hover{color:#fff}
.modal-bd{padding:16px 18px;max-height:66vh;overflow:auto}
.modal-ft{display:flex;justify-content:flex-end;gap:9px;padding:13px 18px;border-top:1px solid var(--line)}
.drawer-mask{position:fixed;inset:0;background:rgba(6,9,14,.5);z-index:55}
.drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:94vw;background:var(--bg2);
  border-left:1px solid var(--line2);z-index:56;display:flex;flex-direction:column;
  box-shadow:-20px 0 50px rgba(0,0,0,.45);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.drawer-hd{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-hd h3{margin:0;font-size:calc(14px * var(--fs));font-weight:500}
.drawer-hd .x{margin-left:auto;background:none;border:none;color:var(--tx2);font-size:calc(20px * var(--fs));cursor:pointer}
.drawer-bd{flex:1;overflow:auto;padding:16px}
.drawer-ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.notif{position:absolute;right:12px;top:46px;width:344px;background:var(--panel);border:1px solid var(--line2);
  border-radius:10px;box-shadow:0 18px 44px rgba(0,0,0,.5);z-index:50;overflow:hidden}
.notif-hd{display:flex;align-items:center;padding:10px 13px;border-bottom:1px solid var(--line);font-size:calc(12.5px * var(--fs));color:var(--tx2)}
.notif-hd .sp{flex:1}
.notif-bd{max-height:330px;overflow:auto}
.nitem{padding:11px 13px;border-bottom:1px solid var(--cellline);cursor:pointer}
.nitem:hover{background:var(--hover2)}
.nitem.unread{background:rgba(76,141,255,.055)}
.nitem .t{font-size:calc(12.5px * var(--fs));display:flex;gap:6px;align-items:center}
.nitem .t .p{width:5px;height:5px;border-radius:50%;background:var(--blue);flex:0 0 5px}
.nitem .b{font-size:calc(11.5px * var(--fs));color:var(--tx3);margin-top:2px}

.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tl .n{position:relative;padding:0 0 18px}
.tl .n::before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--panel);border:2px solid #3a465c}
.tl .n.ok::before{border-color:var(--green)}
.tl .n.miss::before{border-color:var(--amber)}
.tl .n .h{display:flex;align-items:center;gap:8px;font-size:calc(12px * var(--fs));color:var(--tx2)}
.tl .n .c{margin-top:5px;font-size:calc(13px * var(--fs));line-height:1.65;color:#cfd7e6}
.tl .n .f{margin-top:5px;font-size:calc(11.5px * var(--fs));color:var(--tx3);display:flex;gap:10px}

.bars{display:flex;align-items:flex-end;gap:14px;height:132px;padding:6px 4px 0}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b .bar{width:100%;max-width:38px;background:linear-gradient(180deg,#4c8dff,#2b5fc4);border-radius:5px 5px 2px 2px;min-height:3px;transition:.2s}
.bars .b .bar:hover{filter:brightness(1.18)}
.bars .b .v{font-size:calc(11px * var(--fs));color:var(--tx2);font-variant-numeric:tabular-nums}
.bars .b .l{font-size:calc(11px * var(--fs));color:var(--tx3)}
.pbar{height:5px;border-radius:3px;background:var(--chipbg);overflow:hidden;width:78px;display:inline-block;vertical-align:middle}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:3px}

/* 字号档位 */
html[data-fs="sm"]{--fs:.92}
html[data-fs="md"]{--fs:1}
html[data-fs="lg"]{--fs:1.12}
html[data-fs="xl"]{--fs:1.26}

/* 外观面板 */
.prefs{position:absolute;right:10px;top:44px;width:300px;background:var(--panel);border:1px solid var(--line2);
  border-radius:11px;box-shadow:0 18px 44px rgba(0,0,0,.5);z-index:52;padding:13px 14px}
.prefs h4{margin:0 0 8px;font-size:calc(12px * var(--fs));color:var(--tx2);font-weight:500;letter-spacing:.4px}
.prefs .grp{margin-bottom:13px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:56px;height:28px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);
  color:var(--tx2);font-size:calc(12px * var(--fs));cursor:pointer;transition:.14s}
.seg button:hover{background:var(--panel3);color:var(--tx)}
.seg button.on{background:rgba(76,141,255,.16);border-color:var(--blue);color:#8fb8ff}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw i{width:38px;height:26px;border-radius:6px;border:2px solid transparent;cursor:pointer;display:block;position:relative}
.sw i.on{border-color:var(--blue)}
.sw i span{position:absolute;left:0;right:0;bottom:0;height:9px;border-radius:0 0 4px 4px}

/* 呼叫台 */
.callwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.callhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.callhead .prog{flex:1;height:6px;background:var(--panel3);border-radius:3px;overflow:hidden}
.callhead .prog i{display:block;height:100%;background:var(--blue)}
.callcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.callname{font-size:calc(22px * var(--fs));font-weight:600;letter-spacing:.5px}
.callphone{font-family:"JetBrains Mono",Consolas,monospace;font-size:calc(19px * var(--fs));letter-spacing:1px;margin-top:6px}
.resbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.resbtn{height:52px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);
  font-size:calc(13px * var(--fs));cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.14s}
.resbtn:hover{background:var(--panel3)}
.resbtn.on{border-color:var(--blue);background:rgba(76,141,255,.14);color:#8fb8ff;box-shadow:0 0 0 3px rgba(76,141,255,.1)}
.resbtn small{font-size:calc(10px * var(--fs));color:var(--tx3)}
.resbtn.on small{color:#8fb8ff}
.callhist{max-height:280px;overflow:auto}
.callhist .n{padding:9px 0;border-bottom:1px solid var(--cellline)}
.callhist .n:last-child{border-bottom:none}
.selbox{max-height:170px;overflow:auto;border:1px solid var(--line2);border-radius:8px;padding:6px}
.selbox label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:calc(12.5px * var(--fs));cursor:pointer}
.selbox label:hover{background:var(--hover2)}
.kbdrow{display:flex;gap:14px;flex-wrap:wrap;font-size:calc(11px * var(--fs));color:var(--tx3)}
.kbdrow b{color:var(--tx2);font-weight:500}
.qitem{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--cellline)}
.qitem:last-child{border-bottom:none}
.qitem .qn{width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:var(--panel3);color:var(--tx3);
  font-size:calc(10.5px * var(--fs));display:flex;align-items:center;justify-content:center}
.qitem .qname{font-size:calc(12.5px * var(--fs));color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .badge{flex:0 0 auto;white-space:nowrap}
.row2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const ts = s => new Date(s).getTime();
const now = () => new Date();
function dAt(off, h, m) { const d = new Date(); d.setDate(d.getDate() + off); d.setHours(h || 9, m || 0, 0, 0); return d; }
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function sameDay(a, b) { return ymd(a) === ymd(b); }
const WD = ['一', '二', '三', '四', '五', '六', '日'];
function fmtDate(s) { const d = new Date(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
function fmtDT(s) { const d = new Date(s); return (d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtHm(s) { const d = new Date(s); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtMD(s) { const d = new Date(s); return pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function ago(s) {
  const diff = Date.now() - ts(s), h = diff / 36e5;
  if (h < 1) return Math.max(1, Math.round(diff / 6e4)) + ' 分钟前';
  if (h < 24) return Math.round(h) + ' 小时前';
  return Math.round(h / 24) + ' 天前';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function shortName(name) { const s = String(name || ''); return s.length > 3 ? s.slice(0, 2) : s.slice(-2); }
function avatar(name) { return '<span class="avatar">' + esc(shortName(name)) + '</span>'; }
function normPhone(p) { return String(p || '').replace(/\D/g, '').replace(/^86/, ''); }
function isMobile(p) { return /^1[3-9]\d{9}$/.test(normPhone(p)); }
function maskPhone(p) { const n = normPhone(p); return n.length >= 7 ? n.slice(0, 3) + '****' + n.slice(-4) : '***'; }

function loadDB() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { }
  if (raw) {
    try {
      const d = JSON.parse(raw);
      if (d && d.meta && d.meta.seedDay === ymd(now()) && d.customers && d.customers.length && d.roles) return d;
    } catch (e) { }
  }
  const d = buildSeed();
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { }
  return d;
}

const getUser = id => DB.users.find(u => u.id === +id);
const getTask = id => DB.tasks.find(t => t.id === +id);
const teamIds = mid => DB.users.filter(u => u.managerId === mid).map(u => u.id);
const activeUsers = () => DB.users.filter(u => u.active);
// 小组归属：员工看自己主管是哪个组的组长；主管看自己是哪个组的组长
function teamOfUser(u) {
  if (!u) return null;
  if (u.role === 'agent') return DB.teams.find(t => t.supervisorId === u.managerId) || null;
  return DB.teams.find(t => t.supervisorId === u.id) || null;
}
function teamName(u) { const t = teamOfUser(u); return t ? t.name : '—'; }

/* ---------- 权限 ---------- */
function can(p) {
  if (!state.user) return false;
  if (state.user.role === 'admin') return true;
  if ((state.user.extra || []).includes(p)) return true;
  return (DB.roles[state.user.role] || []).includes(p);
}
function scopeIds() {
  const u = state.user;
  if (!u) return [];
  if (u.role === 'admin') return DB.users.map(x => x.id);
  if (u.role === 'supervisor') return [u.id, ...teamIds(u.id)];
  return [u.id];
}
function canSeeCustomer(c) {
  if (!c || !state.user) return false;
  if (c.mergedInto) return false;
  if (!can('customer.view')) return false;
  return scopeIds().includes(c.ownerId);
}
function visibleCustomers() { return DB.customers.filter(c => canSeeCustomer(c)); }
function visibleTasks() { const ids = scopeIds(); return DB.tasks.filter(t => ids.includes(t.assigneeId)); }
function visibleNotes() { const ids = scopeIds(); return DB.notes.filter(n => ids.includes(n.userId)); }
function assignTargets() {
  const u = state.user;
  if (!u) return [];
  if (u.role === 'admin') return activeUsers();
  if (u.role === 'supervisor') return activeUsers().filter(x => x.id === u.id || x.managerId === u.id);
  return [];
}
// 分配下拉：员工排在前面，默认第一项就是下属，避免「默认分给自己」
function assignOptions(selectedId) {
  const list = assignTargets();
  const ordered = [...list.filter(x => x.role === 'agent'), ...list.filter(x => x.role !== 'agent')];
  const def = ordered.length ? ordered[0].id : 0;
  return ordered.map(u => '<option value="' + u.id + '"' +
    ((selectedId != null ? selectedId : def) === u.id ? ' selected' : '') + '>' +
    esc(u.name) + ' · ' + ({ admin: '管理员', supervisor: '主管', agent: '员工' }[u.role]) + '</option>').join('');
}
function revealQuota() {
  const used = DB.reveals.filter(r => r.userId === state.user.id && sameDay(new Date(r.at), now())).length;
  return { used, limit: DB.settings.revealDailyLimit, left: Math.max(0, DB.settings.revealDailyLimit - used) };
}

const CUST_BADGE = { '待联系': 'slate', '跟进中': 'blue', '有意向': 'amber', '已成交': 'green', '无意向': 'gray' };
const RESULT_BADGE = { '已接通': 'green', '无人接听': 'amber', '占线': 'amber', '号码无效': 'gray', '拒绝联系': 'red' };
function custBadge(s) { return '<span class="badge b-' + (CUST_BADGE[s] || 'slate') + '">' + s + '</span>'; }
function resultBadge(s) { return '<span class="badge b-' + (RESULT_BADGE[s] || 'slate') + '">' + s + '</span>'; }
function taskState(t) {
  if (t.status === 'completed') return { k: 'done', label: '已完成', cls: 'green' };
  if (t.status === 'cancelled') return { k: 'cancel', label: '已取消', cls: 'gray' };
  const left = ts(t.scheduledAt) - Date.now();
  if (left < 0) return { k: 'overdue', label: '已逾期', cls: 'red' };
  if (left < 2 * 36e5) return { k: 'soon', label: '即将到期', cls: 'amber' };
  return { k: 'pending', label: '待回访', cls: 'blue' };
}
function taskBadge(t) { const s = taskState(t); return '<span class="badge b-' + s.cls + '">' + s.label + '</span>'; }
function nextCallback(custId) {
  const list = DB.tasks.filter(t => t.custId === +custId && t.status === 'pending').sort((a, b) => ts(a.scheduledAt) - ts(b.scheduledAt));
  return list.length ? list[0].scheduledAt : null;
}
function custNotes(id) { return DB.notes.filter(n => n.custId === +id && !n.voided).sort((a, b) => ts(b.at) - ts(a.at)); }
function attemptsOf(id) {
  const ns = custNotes(id);
  return { total: ns.length, miss: ns.filter(n => n.result === '无人接听' || n.result === '占线').length, last: ns[0] ? ns[0].result : null };
}
function hasPending(id) { return DB.tasks.some(t => t.custId === +id && t.status === 'pending'); }

/* ---------- 客户资产体检 ---------- */
function dupGroups() {
  const list = visibleCustomers();
  const byPhone = {};
  list.forEach(c => { const k = normPhone(c.phone); if (k) (byPhone[k] = byPhone[k] || []).push(c); });
  const groups = [];
  Object.keys(byPhone).forEach(k => {
    if (byPhone[k].length > 1) groups.push({ key: k, reason: '号码相同', items: byPhone[k] });
  });
  // 同名同公司（号码不同）也提示
  const byName = {};
  list.forEach(c => { const k = c.name + '|' + c.company; (byName[k] = byName[k] || []).push(c); });
  Object.keys(byName).forEach(k => {
    const g = byName[k];
    if (g.length > 1 && !groups.some(x => x.items.length === g.length && x.items[0].id === g[0].id)) {
      groups.push({ key: k, reason: '同名同公司', items: g });
    }
  });
  return groups;
}
function invalidList() {
  return visibleCustomers().filter(c => c.invalid || !isMobile(c.phone));
}
function cycleLists() {
  const max = DB.settings.cycleMax;
  const base = visibleCustomers().filter(c => !c.dnc && !c.invalid && isMobile(c.phone));
  const waiting = [], recycle = [];
  base.forEach(c => {
    const a = attemptsOf(c.id);
    if (!a.miss) return;
    const lastMiss = a.last === '无人接听' || a.last === '占线';
    if (!lastMiss) return;
    if (hasPending(c.id)) return;
    if (a.miss >= max) recycle.push({ c, a });
    else waiting.push({ c, a });
  });
  return { waiting, recycle, max };
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'ok');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.transition = '.2s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 220); }, 2600);
}
function audit(action, detail) {
  DB.audit.unshift({ id: ++DB.meta.seq.audit, at: iso(now()), userId: state.user ? state.user.id : 0, action, detail });
  if (DB.audit.length > 300) DB.audit.pop();
}

function trText(s) {
  if (EN[s]) return EN[s];
  for (const [re, rep] of EN_RULES) if (re.test(s)) return s.replace(re, rep);
  return null;
}
function applyLang() {
  if (LANG !== 'en') return;
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while (w.nextNode()) {
    const p = w.currentNode.parentNode;
    if (!p || /^(SCRIPT|STYLE)$/.test(p.nodeName)) continue;
    nodes.push(w.currentNode);
  }
  nodes.forEach(n => {
    const raw = n.nodeValue;
    const s = raw.trim();
    if (!s) return;
    const t = trText(s);
    if (t) n.nodeValue = raw.replace(s, t);
  });
  document.querySelectorAll('[placeholder]').forEach(el => {
    const t = trText(el.getAttribute('placeholder').trim());
    if (t) el.setAttribute('placeholder', t);
  });
  document.querySelectorAll('[title]').forEach(el => {
    const t = trText(el.getAttribute('title').trim());
    if (t) el.setAttribute('title', t);
  });
}

function isManagerOrSupervisor() { return state.user && state.user.role !== 'agent'; }

/* ---------- 客户列表 ---------- */
function filteredCustomers() {
  let list = visibleCustomers();
  const q = state.q.trim().toLowerCase();
  if (q) list = list.filter(c => (c.name + c.phone + c.company).toLowerCase().includes(q));
  if (state.fStatus) list = list.filter(c => c.status === state.fStatus);
  if (state.fOwner) list = list.filter(c => c.ownerId === +state.fOwner);
  if (state.fQuality === 'invalid') list = list.filter(c => c.invalid || !isMobile(c.phone));
  if (state.fQuality === 'cycle') {
    const ids = cycleLists();
    const set = new Set([...ids.waiting, ...ids.recycle].map(x => x.c.id));
    list = list.filter(c => set.has(c.id));
  }
  if (state.fQuality === 'dup') {
    const set = new Set();
    dupGroups().forEach(g => g.items.forEach(c => set.add(c.id)));
    list = list.filter(c => set.has(c.id));
  }
  // 最近联系过的排前面，未联系的新名单排后面
  return list.sort((a, b) => (ts(b.lastContactAt || 0) - ts(a.lastContactAt || 0)) || (b.id - a.id));
}

/* ---------- 客户体检 ---------- */
function datahealthView() {
  if (!can('customer.merge') && !can('customer.invalid')) return noPerm('你没有数据体检权限');
  const tabs = [
    { id: 'dup', label: '重复客户' },
    { id: 'invalid', label: '无效 / 异常号码' },
    { id: 'cycle', label: '周期重呼' }
  ];
  const dg = dupGroups(), inv = invalidList(), cy = cycleLists();
  const counts = { dup: dg.length, invalid: inv.length, cycle: cy.waiting.length + cy.recycle.length };
  const tabBar = '<div class="tabs">' + tabs.map(t =>
    '<a data-act="dh-tab" data-id="' + t.id + '" class="' + (state.dhTab === t.id ? 'on' : '') + '">' + t.label +
    ' <span class="badge b-slate">' + counts[t.id] + '</span></a>').join('') + '</div>';

  let body = '';
  if (state.dhTab === 'dup') {
    body = dg.length ? dg.map((g, gi) => {
      const items = g.items.slice().sort((a, b) => (b.lastContactAt ? 1 : 0) - (a.lastContactAt ? 1 : 0) || b.id - a.id);
      return '<div class="groupbox"><div class="gh"><span class="badge b-amber">' + g.reason + '</span>' +
        '<span class="mono tiny dim">' + esc(normPhone(items[0].phone)) + '</span><span class="sp"></span>' +
        '<button class="btn sm" data-act="merge" data-id="' + gi + '">合并…</button></div>' +
        '<table><thead><tr><th>客户</th><th>电话</th><th>公司</th><th>负责人</th><th>最近联系</th><th>记事</th><th>待办</th></tr></thead><tbody>' +
        items.map(c => '<tr class="click" data-act="open-customer" data-id="' + c.id + '">' +
          '<td>' + esc(c.name) + (c.id === items[0].id ? ' <span class="badge b-blue">建议主记录</span>' : '') + '</td>' +
          '<td class="mono tiny">' + esc(normPhone(c.phone)) + '</td>' +
          '<td class="tiny">' + esc(c.company) + '</td>' +
          '<td class="tiny">' + esc((getUser(c.ownerId) || {}).name) + '</td>' +
          '<td class="tiny dim">' + (c.lastContactAt ? fmtMD(c.lastContactAt) : '未联系') + '</td>' +
          '<td class="tiny">' + custNotes(c.id).length + '</td>' +
          '<td class="tiny">' + DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').length + '</td></tr>').join('') +
        '</tbody></table></div>';
    }).join('') : '<div class="card"><div class="empty">没有发现重复客户</div></div>';
    body += '<div class="help">判定规则：标准化手机号相同，或姓名 + 公司完全相同。合并后记事与未完成回访会转移到主记录，重复记录隐藏但保留可追溯。</div>';
  }

  if (state.dhTab === 'invalid') {
    const rows = inv.length ? inv.map(c => {
      const reason = c.invalidReason || (isMobile(c.phone) ? '' : '号码格式不符合手机号规则');
      return '<tr class="click" data-act="open-customer" data-id="' + c.id + '">' +
        '<td>' + esc(c.name) + '<div class="tiny dim">' + esc(c.company) + '</div></td>' +
        '<td class="mono tiny">' + esc(c.phone) + '</td>' +
        '<td class="tiny" style="color:#ff96a5">' + esc(reason) + '</td>' +
        '<td>' + (c.invalid ? '<span class="badge b-red">已停呼</span>' : '<span class="badge b-amber">待处理</span>') + '</td>' +
        '<td class="tiny">' + esc((getUser(c.ownerId) || {}).name) + '</td>' +
        '<td>' + (can('customer.invalid') ? (c.invalid
          ? '<button class="btn sm" data-act="toggle-invalid" data-id="' + c.id + '">解除</button>'
          : '<button class="btn sm danger" data-act="toggle-invalid" data-id="' + c.id + '">标记无效</button>') : '<span class="dim tiny">—</span>') + '</td></tr>';
    }).join('') : emptyRow(6, '没有异常号码');
    body = '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>客户</th><th>号码</th><th>判定原因</th><th>状态</th><th>负责人</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
      '<div class="help">标记无效后：该客户不进入周期重呼、不能新建回访，已有待办自动取消并留痕。解除需填写原因。</div>';
  }

  if (state.dhTab === 'cycle') {
    const st = DB.settings;
    const rowOf = (x, kind) => {
      const c = x.c, a = x.a;
      return '<tr class="click" data-act="open-customer" data-id="' + c.id + '">' +
        '<td>' + esc(c.name) + '<div class="tiny dim">' + esc(c.company) + '</div></td>' +
        '<td class="mono tiny">' + maskPhone(c.phone) + '</td>' +
        '<td class="num tiny">' + a.miss + ' 次</td>' +
        '<td class="tiny">' + resultBadge(a.last) + '</td>' +
        '<td class="tiny dim">' + (c.lastContactAt ? ago(c.lastContactAt) : '—') + '</td>' +
        '<td class="tiny">' + esc((getUser(c.ownerId) || {}).name) + '</td>' +
        '<td>' + (kind === 'wait'
          ? (can('task.create') ? '<button class="btn sm" data-act="cycle-create" data-id="' + c.id + '">按周期排下次</button>' : '<span class="dim tiny">—</span>')
          : (can('customer.invalid') ? '<button class="btn sm danger" data-act="toggle-invalid" data-id="' + c.id + '">标记无效</button>' : '<span class="dim tiny">—</span>')) +
        '</td></tr>';
    };
    body = '<div class="infobox" style="margin-bottom:12px">周期规则：未接通的客户每 <b>' + st.cycleDays + '</b> 天自动排下一次呼叫，最多 <b>' + st.cycleMax + '</b> 次；达到上限仍未接通进入「待回收」，由主管决定继续或标记无效。</div>' +
      '<div class="card" style="margin-bottom:12px"><div class="card-hd"><h3>待重呼</h3><span class="badge b-blue">' + cy.waiting.length + '</span><span class="sp"></span>' +
      (can('task.create') && cy.waiting.length ? '<button class="btn sm primary" data-act="cycle-create-all">全部按周期排期</button>' : '') + '</div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>客户</th><th>号码</th><th class="num">未接次数</th><th>最近结果</th><th>最近联系</th><th>负责人</th><th>操作</th></tr></thead><tbody>' +
      (cy.waiting.length ? cy.waiting.map(x => rowOf(x, 'wait')).join('') : emptyRow(7, '没有待重呼客户')) + '</tbody></table></div></div>' +
      '<div class="card"><div class="card-hd"><h3>待回收（已达 ' + cy.max + ' 次上限）</h3><span class="badge b-red">' + cy.recycle.length + '</span><span class="sp"></span>' +
      '<span class="tiny dim">建议核实号码或退回主管重新分配</span></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>客户</th><th>号码</th><th class="num">未接次数</th><th>最近结果</th><th>最近联系</th><th>负责人</th><th>操作</th></tr></thead><tbody>' +
      (cy.recycle.length ? cy.recycle.map(x => rowOf(x, 'recycle')).join('') : emptyRow(7, '没有待回收客户')) + '</tbody></table></div></div>';
  }

  return '<div class="banner">⌗ <span>客户体检把「重复、打不通、反复打不通」三类问题集中处理，避免坐席把时间花在无效号码上。</span></div>' +
    tabBar + body;
}

/* ---------- 日历 ---------- */
function calendarView() {
  const y = state.calY, m = state.calM;
  const first = new Date(y, m, 1);
  let lead = first.getDay() - 1; if (lead < 0) lead = 6;
  const start = addDays(first, -lead);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    const key = ymd(d);
    const dayTasks = visibleTasks().filter(t => ymd(new Date(t.scheduledAt)) === key);
    const evs = dayTasks.slice(0, 3).map(t => {
      const c = getCustomer(t.custId), st = taskState(t);
      const cls = st.k === 'overdue' ? 'od' : st.k === 'done' ? 'dn' : st.k === 'cancel' ? 'cn' : '';
      return '<span class="' + cls + '">' + fmtHm(t.scheduledAt) + ' ' + (c ? esc(c.name) : '') + '</span>';
    }).join('');
    cells.push('<div class="cell ' + (d.getMonth() === m ? '' : 'dim') + (sameDay(d, now()) ? ' today' : '') + '" data-act="open-day" data-id="' + key + '">' +
      '<span class="d">' + d.getDate() + '</span>' +
      (dayTasks.length ? '<span class="n">' + dayTasks.length + '</span>' : '') +
      '<div class="ev">' + evs + '</div></div>');
  }
  const wd = WD.map(w => '<div class="wd">周' + w + '</div>').join('');
  const pendingAll = visibleTasks().filter(t => t.status === 'pending').sort((a, b) => ts(a.scheduledAt) - ts(b.scheduledAt));
  const listRows = pendingAll.map(t => {
    const c = getCustomer(t.custId);
    return '<tr class="click" data-act="open-task" data-id="' + t.id + '">' +
      '<td class="mono tiny">' + fmtDT(t.scheduledAt) + '</td>' +
      '<td>' + (c ? esc(c.name) : '') + '<div class="tiny dim">' + esc(t.title) + '</div></td>' +
      '<td class="tiny">' + esc((getUser(t.assigneeId) || {}).name) + '</td>' +
      '<td>' + taskBadge(t) + '</td></tr>';
  }).join('') || emptyRow(4, '没有待处理回访');

  return '<div class="calbar">' +
    '<button class="btn sm" data-act="cal-prev">‹</button>' +
    '<b style="font-size:calc(14px * var(--fs));min-width:110px;display:inline-block;text-align:center">' + y + ' 年 ' + (m + 1) + ' 月</b>' +
    '<button class="btn sm" data-act="cal-next">›</button>' +
    '<button class="btn sm" data-act="cal-today">今天</button>' +
    '<span style="flex:1"></span>' +
    '<button class="btn sm ' + (state.calMode === 'month' ? 'primary' : '') + '" data-act="cal-mode" data-id="month">月视图</button>' +
    '<button class="btn sm ' + (state.calMode === 'list' ? 'primary' : '') + '" data-act="cal-mode" data-id="list">列表</button>' +
    '</div>' +
    (state.calMode === 'month'
      ? '<div class="cal">' + wd + cells.join('') + '</div><div class="help" style="margin-top:10px">日历直接读取回访任务，不维护第二套日期。红=逾期 · 绿=已完成 · 灰划线=已取消。点击任意日期查看当天安排。</div>'
      : '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>计划时间</th><th>客户 / 事项</th><th>执行人</th><th>状态</th></tr></thead><tbody>' + listRows + '</tbody></table></div></div>');
}

/* ---------- 主管看板 ---------- */
function boardView() {
  if (!can('report.team')) return noPerm('你没有团队统计权限');
  const ids = scopeIds();
  const team = DB.users.filter(u => ids.includes(u.id));
  const custs = visibleCustomers();
  const today0 = startOfDay(now()).getTime();
  const notes = visibleNotes().filter(n => !n.voided);
  const notesToday = notes.filter(n => sameDay(new Date(n.at), now()));
  const tasks = visibleTasks();
  const pending = tasks.filter(t => t.status === 'pending');
  const overdue = pending.filter(t => ts(t.scheduledAt) < today0);

  const kpi = '<div class="kpi">' +
    kpiCard('团队客户', custs.length, '今日新增 ' + custs.filter(c => sameDay(new Date(c.createdAt), now())).length, '') +
    kpiCard('今日登记外呼', notesToday.length, '较昨日 ' + ((notesToday.length - notes.filter(n => sameDay(new Date(n.at), addDays(now(), -1))).length) > 0 ? '+' : '') + (notesToday.length - notes.filter(n => sameDay(new Date(n.at), addDays(now(), -1))).length) + ' 条', '') +
    kpiCard('当前逾期回访', overdue.length, '涉及 ' + new Set(overdue.map(t => t.assigneeId)).size + ' 名员工', overdue.length ? 'alert' : 'ok') +
    kpiCard('今日完成回访', tasks.filter(t => t.status === 'completed' && t.completedAt && sameDay(new Date(t.completedAt), now())).length, '按完成时间统计', '') +
    '</div>';

  const rows = team.map(u => {
    const uc = custs.filter(c => c.ownerId === u.id);
    const un = notesToday.filter(n => n.userId === u.id);
    const ut = pending.filter(t => t.assigneeId === u.id);
    const uo = ut.filter(t => ts(t.scheduledAt) < today0);
    const udone = tasks.filter(t => t.assigneeId === u.id && t.status === 'completed' && t.completedAt && sameDay(new Date(t.completedAt), now()));
    const rate = ut.length ? Math.round((ut.length - uo.length) / ut.length * 100) : null;
    return '<tr class="click" data-act="open-agent" data-id="' + u.id + '">' +
      '<td><div style="display:flex;align-items:center;gap:8px">' + avatar(u.name) + '<div>' + esc(u.name) +
      '<div class="tiny dim">' + ({ admin: '管理员', supervisor: '主管', agent: '员工' }[u.role]) + '</div></div></div></td>' +
      '<td class="num">' + uc.length + '</td>' +
      '<td class="num">' + un.length + '</td>' +
      '<td class="num">' + new Set(un.map(n => n.custId)).size + '</td>' +
      '<td class="num">' + un.filter(n => n.result === '已接通').length + '</td>' +
      '<td class="num">' + udone.length + '</td>' +
      '<td class="num">' + (uo.length ? '<span class="badge b-red">' + uo.length + '</span>' : '<span class="dim">0</span>') + '</td>' +
      '<td>' + (rate === null ? '<span class="dim">—</span>' : '<span class="pbar"><i style="width:' + rate + '%"></i></span> <span class="tiny dim">' + rate + '%</span>') + '</td>' +
      '</tr>';
  }).join('');

  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(now(), -i);
    days.push({ d, n: notes.filter(x => sameDay(new Date(x.at), d)).length });
  }
  const max = Math.max(1, ...days.map(x => x.n));
  const bars = days.map(x => '<div class="b"><span class="v">' + x.n + '</span>' +
    '<div class="bar" style="height:' + Math.max(3, Math.round(x.n / max * 96)) + '%"></div>' +
    '<span class="l">' + (sameDay(x.d, now()) ? '今天' : (x.d.getMonth() + 1) + '/' + x.d.getDate()) + '</span></div>').join('');

  const recent = notes.sort((a, b) => ts(b.at) - ts(a.at)).slice(0, 7).map(n => {
    const c = getCustomer(n.custId), uu = getUser(n.userId);
    return '<div class="item"><div class="tm">' + fmtMD(n.at) + '</div><div class="bd">' +
      '<div class="t1">' + (uu ? esc(uu.name) : '') + ' → ' + (c ? esc(c.name) : '') + ' ' + resultBadge(n.result) + '</div>' +
      '<div class="t2">' + esc(n.content) + '</div></div></div>';
  }).join('');

  return kpi +
    '<div class="card" style="margin-bottom:14px"><div class="card-hd"><h3>下属统计</h3><span class="sp"></span>' +
    '<span class="tiny dim">点击姓名查看预览 · 数据为当前团队范围</span></div>' +
    '<div class="tbl-wrap"><table><thead><tr>' +
    '<th>员工</th><th class="num">客户数</th><th class="num">今日登记</th><th class="num">联系客户</th><th class="num">已接通</th><th class="num">今日完成</th><th class="num">当前逾期</th><th>按时率</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
    '<div class="grid-2">' +
    '<div class="card"><div class="card-hd"><h3>近 7 日登记外呼</h3><span class="sp"></span><span class="tiny dim">人工登记次数</span></div>' +
    '<div class="card-bd"><div class="bars">' + bars + '</div></div></div>' +
    '<div class="card"><div class="card-hd"><h3>最近团队动态</h3></div><div class="card-bd tight">' + (recent || '<div class="empty">暂无</div>') + '</div></div>' +
    '</div>' +
    '<div class="help" style="margin-top:10px">统计口径：登记外呼 = 未作废记事数；联系客户 = 有记事的客户去重数；已接通 = 人工标记为已接通；' +
    '当前逾期 = 待处理且计划时间早于今日 0 点。系统不采集通话时长与真实接通率。</div>';
}

/* ---------- 呼叫台 ---------- */
function callQueue() {
  const u = state.user;
  const mine = DB.customers.filter(c => canSeeCustomer(c) && c.ownerId === u.id && !c.dnc && !c.invalid && isMobile(c.phone)
    && c.status !== '已成交' && c.status !== '无意向');
  const tasks = DB.tasks.filter(t => t.assigneeId === u.id && t.status === 'pending').sort((a, b) => ts(a.scheduledAt) - ts(b.scheduledAt));
  const seen = new Set(), out = [];
  tasks.forEach(t => {
    if (seen.has(t.custId)) return;
    const c = getCustomer(t.custId);
    if (!c || c.dnc || c.invalid) return;
    seen.add(t.custId); out.push({ c, t });
  });
  mine.filter(c => !seen.has(c.id) && !hasPending(c.id) && c.status === '待联系').forEach(c => { seen.add(c.id); out.push({ c, t: null }); });
  mine.filter(c => !seen.has(c.id) && !hasPending(c.id)).forEach(c => { seen.add(c.id); out.push({ c, t: null }); });
  return out.filter(x => !state.callSkip.has(x.c.id) && !state.callDone.has(x.c.id));
}

/* ---------- 日志 ---------- */
function logsView() {
  if (!can('user.manage')) return noPerm('你没有查看日志的权限');
  const ids = scopeIds();
  const tab = state.logTab;
  const tabs = '<div class="tabs">' +
    '<a data-act="log-tab" data-id="login" class="' + (tab === 'login' ? 'on' : '') + '">登录日志</a>' +
    '<a data-act="log-tab" data-id="audit" class="' + (tab === 'audit' ? 'on' : '') + '">操作日志</a></div>';

  if (tab === 'login') {
    const list = DB.logins.filter(l => (l.userId && ids.includes(l.userId)) || (!l.userId && state.user.role === 'admin'))
      .sort((a, b) => ts(b.at) - ts(a.at)).slice(0, 120);
    const rows = list.length ? list.map(l => {
      const u = l.userId ? getUser(l.userId) : null;
      return '<tr><td class="mono tiny">' + fmtDT(l.at) + '</td>' +
        '<td>' + (u ? esc(u.name) : '<span class="dim">' + esc(l.username || '未知') + '</span>') +
        (u ? '<div class="tiny dim">' + esc(u.username) + '</div>' : '') + '</td>' +
        '<td class="tiny">' + (u ? ({ admin: '管理员', supervisor: '主管', agent: '员工' }[u.role]) : '<span class="dim">—</span>') + '</td>' +
        '<td>' + (l.ok ? '<span class="badge b-green">成功</span>' : '<span class="badge b-red">失败</span>') + '</td>' +
        '<td class="mono tiny">' + esc(l.ip) + '</td>' +
        '<td class="tiny dim">' + esc(l.device) + '</td>' +
        '<td class="tiny dim">' + esc(l.note) + '</td></tr>';
    }).join('') : emptyRow(7, '暂无登录记录');
    return tabs +
      '<div class="card"><div class="card-hd"><h3>登录日志</h3><span class="sp"></span>' +
      '<span class="tiny dim">' + (state.user.role === 'admin' ? '全部账号' : '本人及直属下属') + ' · 最近 ' + list.length + ' 条</span></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>时间</th><th>账号</th><th>角色</th><th>结果</th><th>IP</th><th>设备</th><th>说明</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
      '<div class="help">登录失败也会记录，用于发现异常尝试；真实系统应同时按 IP 做失败限速。</div>';
  }

  const list = DB.audit.filter(a => ids.includes(a.userId)).slice(0, 120);
  const rows = list.length ? list.map(a => {
    const u = getUser(a.userId);
    return '<tr><td class="mono tiny">' + fmtDT(a.at) + '</td>' +
      '<td class="tiny">' + (u ? esc(u.name) : '—') + '</td>' +
      '<td class="tiny">' + esc(a.action) + '</td>' +
      '<td class="tiny dim">' + esc(a.detail) + '</td></tr>';
  }).join('') : emptyRow(4, '暂无操作记录');
  return tabs +
    '<div class="card"><div class="card-hd"><h3>操作日志</h3><span class="sp"></span>' +
    '<span class="tiny dim">' + (state.user.role === 'admin' ? '全部账号' : '本人及直属下属') + ' · 最近 ' + list.length + ' 条</span></div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>时间</th><th>操作人</th><th>操作</th><th>详情</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}

/* ---------- 抽屉 ---------- */
function drawerHtml() {
  const d = state.drawer;
  let title = '', body = '', foot = '';
  if (d.type === 'day') {
    const key = d.id;
    const list = visibleTasks().filter(t => ymd(new Date(t.scheduledAt)) === key).sort((a, b) => ts(a.scheduledAt) - ts(b.scheduledAt));
    title = key.replace(/-/g, '/') + '（周' + WD[(new Date(key + 'T09:00').getDay() + 6) % 7] + '）';
    body = list.length ? list.map(t => {
      const c = getCustomer(t.custId);
      return '<div class="card" style="margin-bottom:9px"><div class="card-bd" style="padding:11px 13px">' +
        '<div style="display:flex;align-items:center;gap:8px"><b style="font-size:calc(13px * var(--fs))">' + fmtHm(t.scheduledAt) + '</b>' +
        '<span style="font-size:calc(13px * var(--fs))">' + (c ? esc(c.name) : '') + '</span>' + taskBadge(t) + '</div>' +
        '<div class="tiny dim" style="margin-top:3px">' + esc(t.title) + ' · ' + (getUser(t.assigneeId) || {}).name +
        (t.rescheduleCount ? ' · 改期 ' + t.rescheduleCount + ' 次' : '') + '</div>' +
        (t.status === 'pending' ? '<div style="display:flex;gap:6px;margin-top:8px">' +
          '<button class="btn sm primary" data-act="new-note" data-id="' + t.custId + '" data-task="' + t.id + '">写跟进并完成</button>' +
          '<button class="btn sm" data-act="reschedule" data-id="' + t.id + '">改期</button>' +
          '<button class="btn sm" data-act="cancel-task" data-id="' + t.id + '">取消</button>' +
          '<button class="btn sm" data-act="open-customer" data-id="' + t.custId + '">客户</button></div>' : '') +
        '</div></div>';
    }).join('') : '<div class="empty">这天没有回访安排</div>';
    foot = '<button class="btn" data-act="close-drawer" style="flex:1">关闭</button>';
  } else if (d.type === 'task') {
    const t = getTask(d.id);
    if (!t) return '';
    const c = getCustomer(t.custId);
    title = '回访任务';
    body = '<div style="font-size:calc(15px * var(--fs));font-weight:600">' + esc(t.title) + '</div>' +
      '<div class="tiny dim" style="margin:4px 0 12px">' + (c ? esc(c.name) + ' · ' + esc(c.company) : '') + '</div>' +
      '<table style="font-size:calc(12.5px * var(--fs))"><tbody>' +
      '<tr><td class="dim" style="border:none;padding:5px 0;width:80px">计划时间</td><td style="border:none;padding:5px 0">' + fmtDT(t.scheduledAt) + ' ' + taskBadge(t) + '</td></tr>' +
      '<tr><td class="dim" style="border:none;padding:5px 0">原计划</td><td style="border:none;padding:5px 0">' + fmtDT(t.originalScheduledAt) + (t.rescheduleCount ? ' <span class="badge b-amber">改期 ' + t.rescheduleCount + ' 次</span>' : '') + '</td></tr>' +
      '<tr><td class="dim" style="border:none;padding:5px 0">执行人</td><td style="border:none;padding:5px 0">' + esc((getUser(t.assigneeId) || {}).name) + '</td></tr>' +
      '<tr><td class="dim" style="border:none;padding:5px 0">提前提醒</td><td style="border:none;padding:5px 0">' + t.remindBefore + ' 分钟</td></tr>' +
      (t.completedAt ? '<tr><td class="dim" style="border:none;padding:5px 0">完成时间</td><td style="border:none;padding:5px 0">' + fmtDT(t.completedAt) + '</td></tr>' : '') +
      (t.cancelReason ? '<tr><td class="dim" style="border:none;padding:5px 0">取消原因</td><td style="border:none;padding:5px 0">' + esc(t.cancelReason) + '</td></tr>' : '') +
      '</tbody></table>' +
      (t.status === 'pending' ? '<div class="warnbox" style="margin-top:12px">完成回访必须同时填写本次记事；新增记事不会自动完成其他任务。</div>' : '');
    foot = t.status === 'pending'
      ? '<button class="btn primary" data-act="new-note" data-id="' + t.custId + '" data-task="' + t.id + '" style="flex:1">写跟进并完成</button>' +
        '<button class="btn" data-act="reschedule" data-id="' + t.id + '">改期</button>' +
        '<button class="btn" data-act="cancel-task" data-id="' + t.id + '">取消</button>'
      : '<button class="btn" data-act="close-drawer" style="flex:1">关闭</button>';
  } else if (d.type === 'agent') {
    const u = getUser(d.id);
    if (!u) return '';
    const uc = visibleCustomers().filter(c => c.ownerId === u.id);
    const ut = visibleTasks().filter(t => t.assigneeId === u.id);
    const today0 = startOfDay(now()).getTime();
    const pend = ut.filter(t => t.status === 'pending');
    const od = pend.filter(t => ts(t.scheduledAt) < today0);
    const un = visibleNotes().filter(n => n.userId === u.id).sort((a, b) => ts(b.at) - ts(a.at));
    title = u.name + ' · 工作预览';
    body = '<div class="kpi" style="grid-template-columns:1fr 1fr;margin-bottom:12px">' +
      kpiCard('负责客户', uc.length, '', '') + kpiCard('当前逾期', od.length, '', od.length ? 'alert' : 'ok') + '</div>' +
      '<div style="font-size:calc(12.5px * var(--fs));color:#98a3b8;margin:10px 0 6px">今日待办</div>' +
      (pend.filter(t => sameDay(new Date(t.scheduledAt), now())).map(t => {
        const c = getCustomer(t.custId);
        return '<div class="item" style="padding:9px 0;border-color:var(--cellline)"><div class="tm">' + fmtHm(t.scheduledAt) + '</div>' +
          '<div class="bd"><div class="t1">' + (c ? esc(c.name) : '') + ' ' + taskBadge(t) + '</div><div class="t2">' + esc(t.title) + '</div></div></div>';
      }).join('') || '<div class="tiny dim" style="padding:6px 0">今天没有安排</div>') +
      '<div class="hr"></div><div style="font-size:calc(12.5px * var(--fs));color:#98a3b8;margin:6px 0">最近记事</div>' +
      (un.slice(0, 5).map(n => {
        const c = getCustomer(n.custId);
        return '<div style="padding:8px 0;border-bottom:1px solid var(--cellline)"><div class="tiny">' +
          '<b>' + (c ? esc(c.name) : '') + '</b> ' + resultBadge(n.result) + ' <span class="dim">' + fmtDT(n.at) + '</span></div>' +
          '<div class="tiny dim" style="margin-top:2px">' + esc(n.content) + '</div></div>';
      }).join('') || '<div class="tiny dim">暂无</div>');
    foot = '<button class="btn" data-act="close-drawer" style="flex:1">关闭</button>';
  }
  return '<div class="drawer-mask" data-act="close-drawer"></div>' +
    '<div class="drawer"><div class="drawer-hd"><h3>' + esc(title) + '</h3><button class="x" data-act="close-drawer">×</button></div>' +
    '<div class="drawer-bd">' + body + '</div>' +
    (foot ? '<div class="drawer-ft">' + foot + '</div>' : '') + '</div>';
}

/* ---------- 渲染 ---------- */
function viewHtml() {
  switch (state.view) {
    case 'dashboard': return dashboardView();
    case 'customers': return customersView();
    case 'customer': return customerView();
    case 'datahealth': return datahealthView();
    case 'calendar': return calendarView();
    case 'notes': return notesView();
    case 'board': return boardView();
    case 'users': return usersView();
    case 'perms': return permsView();
    case 'settings': return settingsView();
    case 'call': return callView();
    case 'logs': return logsView();
    default: return '';
  }
}
function render() {
  if (!state.user) { $app.innerHTML = loginView(); applyLang(); return; }
  const sc = document.getElementById('content');
  const st = sc ? sc.scrollTop : 0;
  $app.innerHTML = shell(viewHtml());
  const nc = document.getElementById('content');
  if (nc) nc.scrollTop = st;
  applyLang();
}

/* ---------- 动作 ---------- */
function nextId(kind) { return ++DB.meta.seq[kind]; }
function expireNotifs(taskId) {
  DB.notifications.forEach(n => { if (n.taskId === taskId && n.status !== 'expired') n.status = 'expired'; });
}
function closeModal() { state.modal = null; render(); }
function logLogin(userId, username, ok, note) {
  const ips = ['192.168.1.34', '192.168.1.51', '192.168.1.77', '192.168.1.102', '192.168.1.118'];
  DB.logins.push({
    id: nextId('login'), userId: userId || null, username: username || null, ok,
    at: iso(now()), ip: ips[Math.floor(Math.random() * ips.length)],
    device: 'Windows 10 · Chrome 129', note
  });
}
function doLogin(username, pwd) {
  const uname = String(username).trim();
  const u = DB.users.find(x => x.username === uname);
  state.loginUser = uname;
  if (!u || u.pwd !== pwd) {
    state.loginErr = '账号或密码不正确';
    logLogin(u ? u.id : null, uname, false, u ? '密码错误' : '账号不存在');
    saveDB();
    return false;
  }
  if (!u.active) {
    state.loginErr = '该账号已被禁用，请联系管理员';
    logLogin(u.id, uname, false, '账号已禁用');
    saveDB();
    return false;
  }
  state.user = u; state.loginErr = ''; state.loginUser = ''; state.view = 'dashboard'; state.page = 1;
  state.selected.clear(); state.revealed.clear(); state.callDone.clear(); state.callSkip.clear();
  state.callResult = ''; state.callNote = ''; state.callStatus = '';
  try { localStorage.setItem(SESS, String(u.id)); } catch (e) { }
  logLogin(u.id, u.username, true, '密码登录');
  audit('登录', u.name + ' 登录系统');
  if (u.mustChange) state.modal = { type: 'change-pwd', force: true };
  saveDB();
  return true;
}

function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
function saveCall() {
  const q = callQueue();
  if (!q.length) return;
  const cur = q[0], c = cur.c;
  if (!state.callResult) { toast('请先选择联系结果', 'warn'); return; }
  const at = iso(now());
  const note = {
    id: nextId('note'), custId: c.id, at, result: state.callResult,
    content: state.callNote.trim() || ('（' + state.callResult + '）'), userId: state.user.id, voided: false
  };
  DB.notes.push(note);
  c.lastContactAt = at;
  if (state.callStatus) c.status = state.callStatus;
  if (cur.t) {
    cur.t.status = 'completed'; cur.t.completedAt = at; cur.t.completedBy = state.user.id;
    cur.t.completionNoteId = note.id; expireNotifs(cur.t.id);
  }
  if (state.callResult === '号码无效') {
    c.invalid = true; c.invalidReason = '呼叫台标记：号码无效';
    DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').forEach(t => {
      t.status = 'cancelled'; t.cancelReason = '号码无效，停止呼叫'; expireNotifs(t.id);
    });
  } else if (state.callResult === '无人接听' || state.callResult === '占线') {
    const a = attemptsOf(c.id);
    if (a.miss < DB.settings.cycleMax && !hasPending(c.id)) {
      const d = addDays(now(), DB.settings.cycleDays); d.setHours(10, 0, 0, 0);
      DB.tasks.push({
        id: nextId('task'), custId: c.id, title: '周期重呼（第 ' + (a.miss + 1) + ' 次）',
        assigneeId: c.ownerId, scheduledAt: iso(d), originalScheduledAt: iso(d),
        status: 'pending', remindBefore: 30, rescheduleCount: 0,
        completedAt: null, completedBy: null, cancelReason: null, createdAt: iso(now()), version: 1
      });
    }
  }
  state.callDone.add(c.id);
  state.callResult = ''; state.callNote = ''; state.callStatus = '';
  audit('呼叫台登记', c.name + ' · ' + note.result);
  saveDB(); render();
  const nq = callQueue();
  toast(nq.length ? '已保存，下一位：' + nq[0].c.name : '已保存，队列已清空');
}

document.addEventListener('click', e => {
  if (e.target.type === 'checkbox' && !e.target.dataset.act) return;
  if (e.target.classList && e.target.classList.contains('mask')) { closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, task = el.dataset.task;
  if (A[act]) { e.preventDefault(); A[act](id, task, el); }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.sel) {
    const sid = +el.dataset.sel;
    if (el.checked) state.selected.add(sid); else state.selected.delete(sid);
    const tr = el.closest('tr');
    if (tr) tr.classList.toggle('sel', el.checked);
    const mount = document.getElementById('bulkMount');
    if (mount) mount.innerHTML = (state.selected.size && state.view === 'customers') ? bulkBar() : '';
    return;
  }
  if (el.dataset.rolePerm) {
    const [role, perm] = el.dataset.rolePerm.split('|');
    if (role === 'admin') return;
    const arr = DB.roles[role] || [];
    if (el.checked) { if (!arr.includes(perm)) arr.push(perm); }
    else { DB.roles[role] = arr.filter(x => x !== perm); }
    audit('修改角色权限', role + ' · ' + perm + (el.checked ? ' 开启' : ' 关闭'));
    saveDB(); render(); toast('权限已更新');
    return;
  }
  if (el.dataset.userPerm) {
    const pu = getUser(state.permUser || DB.users[0].id);
    if (!pu) return;
    pu.extra = pu.extra || [];
    if (el.checked) { if (!pu.extra.includes(el.dataset.userPerm)) pu.extra.push(el.dataset.userPerm); }
    else pu.extra = pu.extra.filter(x => x !== el.dataset.userPerm);
    audit('个人授权', pu.name + ' · ' + el.dataset.userPerm + (el.checked ? ' 授予' : ' 撤销'));
    saveDB(); render(); toast('个人权限已更新');
    return;
  }
  if (el.dataset.set) {
    const k = el.dataset.set;
    DB.settings[k] = el.type === 'checkbox' ? el.checked : Math.max(1, +el.value || 1);
    audit('修改系统设置', k + ' = ' + DB.settings[k]);
    saveDB(); render(); toast('设置已保存');
    return;
  }
  const ch = el.dataset.change;
  if (ch === 'switch-user') {
    state.user = getUser(el.value); state.view = 'dashboard'; state.page = 1;
    state.drawer = null; state.notif = false; state.selected.clear(); state.revealed.clear();
    render(); toast('已切换为 ' + state.user.name);
  } else if (ch === 'f-status') { state.fStatus = el.value; state.page = 1; render(); }
  else if (ch === 'f-owner') { state.fOwner = el.value; state.page = 1; render(); }
  else if (ch === 'f-quality') { state.fQuality = el.value; state.page = 1; render(); }
  else if (ch === 'f-result') { state.fResult = el.value; render(); }
  else if (ch === 'f-emp') { state.fEmp = el.value; render(); }
  else if (ch === 'perm-user') { state.permUser = el.value; render(); }
  else if (ch === 'toggle-next') {
    const box = document.getElementById('nextBox');
    if (box) box.classList.toggle('hidden', !el.checked);
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  const fd = new FormData(f);

  if (kind === 'login') {
    const ok = doLogin(fd.get('username') || '', fd.get('password') || '');
    if (ok) { render(); toast('欢迎回来，' + state.user.name); }
    else { render(); }
    return;
  }

  if (kind === 'note') {
    const custId = +f.dataset.cust, taskId = f.dataset.task ? +f.dataset.task : 0;
    const c = getCustomer(custId);
    const note = {
      id: nextId('note'), custId, at: fd.get('at'), result: fd.get('result'),
      content: (fd.get('content') || '').trim(), userId: state.user.id, voided: false
    };
    if (!note.content) { toast('请填写记事内容', 'warn'); return; }
    DB.notes.push(note);
    c.lastContactAt = note.at;
    const st = fd.get('status');
    if (st) c.status = st;
    let msg = '记事已保存';
    if (taskId) {
      const t = getTask(taskId);
      t.status = 'completed'; t.completedAt = note.at; t.completedBy = state.user.id;
      t.completionNoteId = note.id; t.version++;
      expireNotifs(taskId);
      msg = '回访已完成，记事已记录';
    }
    if (fd.get('next') && !c.dnc) {
      DB.tasks.push({
        id: nextId('task'), custId, title: (fd.get('nextTitle') || '后续跟进').trim() || '后续跟进',
        assigneeId: c.ownerId, scheduledAt: fd.get('nextAt'), originalScheduledAt: fd.get('nextAt'),
        status: 'pending', remindBefore: +fd.get('nextRemind') || 30, rescheduleCount: 0,
        completedAt: null, completedBy: null, cancelReason: null, createdAt: iso(now()), version: 1
      });
      msg += '，已安排下次回访';
    }
    if (note.result === '号码无效') msg += '；建议标记无效号码';
    audit('新增记事', c.name + ' · ' + note.result + (taskId ? ' · 完成回访' : ''));
    saveDB(); state.modal = null; state.drawer = null; render(); toast(msg);
    return;
  }

  if (kind === 'task') {
    const custId = +f.dataset.cust, c = getCustomer(custId);
    if (c.dnc) { toast('该客户已禁止联系，无法安排回访', 'err'); return; }
    if (c.invalid) { toast('该客户号码已标记无效，无法安排回访', 'err'); return; }
    const assignee = fd.get('assignee') ? +fd.get('assignee') : c.ownerId;
    DB.tasks.push({
      id: nextId('task'), custId, title: fd.get('title').trim(),
      assigneeId: assignee, scheduledAt: fd.get('at'), originalScheduledAt: fd.get('at'),
      status: 'pending', remindBefore: +fd.get('remind') || 30, rescheduleCount: 0,
      completedAt: null, completedBy: null, cancelReason: null, createdAt: iso(now()), version: 1
    });
    audit('安排回访', c.name + ' · ' + fd.get('title') + ' · ' + fmtDT(fd.get('at')));
    saveDB(); state.modal = null; render(); toast('回访已安排：' + fmtDT(fd.get('at')));
    return;
  }

  if (kind === 'customer') {
    const id = f.dataset.id ? +f.dataset.id : 0;
    const phone = (fd.get('phone') || '').trim();
    const dup = DB.customers.find(x => normPhone(x.phone) === normPhone(phone) && x.id !== id && !x.mergedInto);
    if (dup) { toast('该号码已存在客户：' + dup.name + '（负责人 ' + (getUser(dup.ownerId) || {}).name + '）', 'err'); return; }
    if (id) {
      const c = getCustomer(id);
      Object.assign(c, {
        name: fd.get('name').trim(), phone, company: fd.get('company').trim(),
        source: fd.get('source'), category: fd.get('category'),
        status: fd.get('status'), remark: fd.get('remark').trim(), version: c.version + 1
      });
      const newOwner = fd.get('owner') ? +fd.get('owner') : c.ownerId;
      if (newOwner !== c.ownerId) {
        const old = c.ownerId; c.ownerId = newOwner;
        audit('转移客户', c.name + ' · ' + (getUser(old) || {}).name + ' → ' + (getUser(newOwner) || {}).name);
      } else audit('编辑客户', c.name);
      saveDB(); state.modal = null; render(); toast('客户资料已更新');
    } else {
      const c = {
        id: nextId('customer'), name: fd.get('name').trim(), phone,
        company: fd.get('company').trim(), source: fd.get('source'), category: fd.get('category'),
        status: fd.get('status'), ownerId: fd.get('owner') ? +fd.get('owner') : state.user.id,
        remark: fd.get('remark').trim(), dnc: false, invalid: false, invalidReason: null, mergedInto: null,
        lastContactAt: null, archived: false, version: 1, createdAt: iso(now())
      };
      DB.customers.push(c);
      audit('新增客户', c.name + ' · ' + c.company);
      saveDB(); state.modal = null; state.view = 'customer'; state.custId = c.id; render();
      toast('客户已创建');
    }
    return;
  }

  if (kind === 'reschedule') {
    const t = getTask(f.dataset.id);
    const at = fd.get('at');
    t.scheduledAt = at; t.rescheduleCount++; t.scheduleVersion = (t.scheduleVersion || 0) + 1; t.version++;
    expireNotifs(t.id);
    audit('回访改期', (getCustomer(t.custId) || {}).name + ' · ' + fmtDT(t.originalScheduledAt) + ' → ' + fmtDT(at) + ' · 原因：' + fd.get('reason'));
    saveDB(); state.modal = null; state.drawer = null; render();
    toast('已改期至 ' + fmtDT(at) + '，原提醒已失效');
    return;
  }

  if (kind === 'cancel-task') {
    const t = getTask(f.dataset.id);
    t.status = 'cancelled'; t.cancelReason = fd.get('reason'); t.version++;
    expireNotifs(t.id);
    audit('取消回访', (getCustomer(t.custId) || {}).name + ' · 原因：' + fd.get('reason'));
    saveDB(); state.modal = null; state.drawer = null; render(); toast('回访已取消');
    return;
  }

  if (kind === 'transfer') {
    const c = getCustomer(f.dataset.id);
    const newOwner = +fd.get('owner'), old = c.ownerId;
    c.ownerId = newOwner;
    let moved = 0;
    if (fd.get('moveTasks')) {
      DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').forEach(t => {
        t.assigneeId = newOwner; moved++;
        DB.notifications.filter(n => n.taskId === t.id).forEach(n => { n.status = 'expired'; });
      });
    }
    audit('转移客户', c.name + ' · ' + (getUser(old) || {}).name + ' → ' + (getUser(newOwner) || {}).name + ' · 同步转移 ' + moved + ' 条回访');
    saveDB(); state.modal = null; render();
    toast('已转给 ' + (getUser(newOwner) || {}).name + '，同步转移 ' + moved + ' 条未完成回访');
    return;
  }

  if (kind === 'bulk-assign') {
    const newOwner = +fd.get('owner');
    const ids = [...state.selected];
    let moved = 0;
    ids.forEach(cid => {
      const c = getCustomer(cid);
      if (!c) return;
      c.ownerId = newOwner;
      if (fd.get('moveTasks')) {
        DB.tasks.filter(t => t.custId === cid && t.status === 'pending').forEach(t => {
          t.assigneeId = newOwner; moved++;
          DB.notifications.filter(n => n.taskId === t.id).forEach(n => { n.status = 'expired'; });
        });
      }
    });
    if (fd.get('notify')) {
      DB.notifications.unshift({
        id: nextId('notif'), userId: newOwner, taskId: 0,
        title: '收到 ' + ids.length + ' 位新客户', body: '由 ' + state.user.name + ' 分配，请尽快首次联系',
        createdAt: iso(now()), status: 'unread'
      });
    }
    audit('批量分配', ids.length + ' 位客户 → ' + (getUser(newOwner) || {}).name + ' · 同步转移 ' + moved + ' 条回访');
    state.selected.clear(); saveDB(); state.modal = null; render();
    toast('已把 ' + ids.length + ' 位客户分配给 ' + (getUser(newOwner) || {}).name);
    return;
  }

  if (kind === 'merge') {
    const g = dupGroups()[+f.dataset.gi];
    if (!g) return;
    const master = getCustomer(+fd.get('master'));
    let movedNotes = 0, movedTasks = 0;
    g.items.filter(c => c.id !== master.id).forEach(c => {
      DB.notes.forEach(n => { if (n.custId === c.id) { n.custId = master.id; movedNotes++; } });
      DB.tasks.forEach(t => {
        if (t.custId === c.id) {
          if (t.status === 'pending') { t.custId = master.id; movedTasks++; }
          else t.custId = master.id;
        }
      });
      if (!master.lastContactAt && c.lastContactAt) master.lastContactAt = c.lastContactAt;
      c.mergedInto = master.id;
    });
    audit('合并重复客户', '主记录 ' + master.name + ' · 合并 ' + (g.items.length - 1) + ' 条 · 转移记事 ' + movedNotes + ' / 回访 ' + movedTasks);
    saveDB(); state.modal = null; render();
    toast('已合并到「' + master.name + '」，转移 ' + movedNotes + ' 条记事、' + movedTasks + ' 条待办');
    return;
  }

  if (kind === 'import') {
    const mode = fd.get('mode');
    const targets = assignTargets().filter(u => u.role === 'agent');
    const pool = targets.length ? targets : assignTargets();
    const add = [
      ['林小雨', '13600001111', '宁波恒达五金', '展会', 'B类'],
      ['陈可', '13600002222', '温州嘉禾食品', '电话名单', 'C类'],
      ['黄伟', '13600003333', '绍兴越光纺织', '转介绍', 'A类'],
      ['刘婷', '13600004444', '嘉兴南湖电子', '官网表单', 'B类'],
      ['吴迪', '13600006666', '台州海翔模具', '转介绍', 'A类']
    ];
    const counts = {};
    add.forEach((r, i) => {
      let owner;
      if (mode === 'single') owner = +fd.get('owner');
      else if (mode === 'even' && pool.length) owner = pool[i % pool.length].id;
      else owner = state.user.id;
      counts[owner] = (counts[owner] || 0) + 1;
      DB.customers.push({
        id: nextId('customer'), name: r[0], phone: r[1], company: r[2], source: r[3], category: r[4],
        status: '待联系', ownerId: owner, remark: 'XLSX 导入 · 批次 ' + ymd(now()),
        dnc: false, invalid: false, invalidReason: null, mergedInto: null,
        lastContactAt: null, archived: false, version: 1, createdAt: iso(now())
      });
    });
    const dist = Object.keys(counts).map(uid => (getUser(uid) || {}).name + ' ' + counts[uid]).join('、');
    audit('导入客户', '成功 5 / 跳过 2 / 失败 1 · 分配：' + dist);
    saveDB(); state.modal = null; state.view = 'customers'; state.page = 1; render();
    toast('导入完成：5 条已入库，分配给 ' + dist);
    return;
  }

  if (kind === 'export') {
    const scope = fd.get('scope'), mask = fd.get('mask');
    let list = scope === 'mine' ? visibleCustomers().filter(c => c.ownerId === state.user.id) : filteredCustomers();
    const limit = DB.settings.exportLimit;
    const over = list.length > limit;
    if (over) list = list.slice(0, limit);
    if (mask === 'full' && !can('customer.export.full')) { toast('你没有导出明文号码的权限', 'err'); return; }
    audit('导出客户', (mask === 'full' ? '明文' : '脱敏') + ' · ' + (scope === 'mine' ? '仅本人' : '当前筛选') + ' · ' + ({ admin: '全部', supervisor: '团队', agent: '本人' }[state.user.role]) + ' · ' + list.length + ' 条' + (over ? '（已达上限截断）' : ''));
    saveDB(); state.modal = null; render();
    toast('已导出 ' + list.length + ' 条（' + (mask === 'full' ? '明文' : '脱敏') + '）' + (over ? '，超出上限已截断' : '') + '，本次操作已记审计');
    return;
  }

  if (kind === 'user') {
    const name = fd.get('name').trim(), username = fd.get('username').trim();
    if (DB.users.some(u => u.username === username)) { toast('账号已存在', 'err'); return; }
    const role = state.user.role === 'admin' ? fd.get('role') : 'agent';
    const managerId = fd.get('manager') ? +fd.get('manager') : (state.user.role === 'admin' ? null : state.user.id);
    if (role === 'agent' && !managerId) { toast('员工必须指定直属主管', 'warn'); return; }
    DB.users.push({
      id: Math.max(...DB.users.map(u => u.id)) + 1, username, name, role,
      managerId, active: true, pwd: '123456', extra: []
    });
    audit('新增账号', name + ' · ' + ({ admin: '管理员', supervisor: '主管', agent: '员工' }[role]) + ' · 初始密码需首次登录修改');
    saveDB(); state.modal = null; render(); toast('账号已创建，初始密码需首次登录修改');
    return;
  }

  if (kind === 'edit-user') {
    const u = getUser(f.dataset.id);
    const role = fd.get('role');
    u.name = fd.get('name').trim();
    u.role = role;
    u.managerId = fd.get('manager') ? +fd.get('manager') : null;
    audit('编辑账号', u.name + ' · 角色 ' + role + ' · 直属 ' + (u.managerId ? (getUser(u.managerId) || {}).name : '无'));
    saveDB(); state.modal = null; render(); toast('账号已更新，数据范围随之变化');
    return;
  }

  if (kind === 'change-pwd') {
    const u = state.user;
    const old = fd.get('old'), p1 = fd.get('p1'), p2 = fd.get('p2');
    if (old !== u.pwd) { toast('当前密码不正确', 'err'); return; }
    if (String(p1).length < 6) { toast('新密码至少 6 位', 'warn'); return; }
    if (p1 !== p2) { toast('两次输入的新密码不一致', 'err'); return; }
    if (p1 === old) { toast('新密码不能与当前密码相同', 'warn'); return; }
    u.pwd = p1; u.mustChange = false;
    audit('修改密码', u.name + ' 修改了自己的密码');
    saveDB(); state.modal = null; render(); toast('密码已更新');
    return;
  }

  if (kind === 'set-pwd') {
    const u = getUser(f.dataset.id);
    const p1 = fd.get('p1'), p2 = fd.get('p2');
    if (u.id === state.user.id && fd.get('old') !== u.pwd) { toast('当前密码不正确', 'err'); return; }
    if (String(p1).length < 6) { toast('新密码至少 6 位', 'warn'); return; }
    if (p1 !== p2) { toast('两次输入的新密码不一致', 'err'); return; }
    u.pwd = p1;
    if (u.id !== state.user.id) u.mustChange = true;
    audit('重设密码', u.name + '（' + u.username + '）· 由 ' + state.user.name + ' 重设，下次登录需修改');
    saveDB(); state.modal = null; render();
    toast(u.id === state.user.id ? '密码已更新' : '已重设 ' + u.name + ' 的密码，请告知临时密码');
    return;
  }

  if (kind === 'assign-plan') {
    const targets = fd.getAll('t').map(Number).filter(Boolean);
    if (!targets.length) { toast('至少选择一名组员', 'warn'); return; }
    const count = Math.min(1000, Math.max(1, +fd.get('count') || 0));
    if (count < 50) { toast('批量分配最少 50 位；少量客户请用「分配给…」', 'warn'); return; }
    const scope = fd.get('scope'), mode = fd.get('mode');
    let pool;
    if (scope === 'mine') pool = visibleCustomers().filter(c => c.ownerId === state.user.id);
    else if (scope === 'team') pool = visibleCustomers();
    else pool = filteredCustomers();
    if (!fd.get('includeOwned')) pool = pool.filter(c => !targets.includes(c.ownerId));
    pool = pool.filter(c => !c.dnc);
    if (mode === 'rand') pool = shuffle(pool);
    const picked = pool.slice(0, count);
    if (!picked.length) { toast('客户池里没有可分配的客户', 'warn'); return; }
    const counts = {};
    picked.forEach((c, i) => {
      const owner = targets[i % targets.length];
      c.ownerId = owner;
      counts[owner] = (counts[owner] || 0) + 1;
      if (fd.get('moveTasks')) {
        DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').forEach(t => {
          t.assigneeId = owner;
          DB.notifications.filter(n => n.taskId === t.id).forEach(n => { n.status = 'expired'; });
        });
      }
    });
    const dist = Object.keys(counts).map(uid => (getUser(+uid) || {}).name + ' ' + counts[uid]).join('、');
    targets.forEach(uid => DB.notifications.unshift({
      id: nextId('notif'), userId: uid, taskId: 0,
      title: '收到 ' + (counts[uid] || 0) + ' 位新客户',
      body: '由 ' + state.user.name + ' 分配（' + (mode === 'rand' ? '随机' : '顺序') + '），请尽快首次联系',
      createdAt: iso(now()), status: 'unread'
    }));
    audit('按数量分配', picked.length + ' 位客户 · ' + (mode === 'rand' ? '随机' : '顺序') + ' · ' + dist);
    saveDB(); state.modal = null; render();
    toast('已分配 ' + picked.length + ' 位：' + dist);
    return;
  }

  if (kind === 'team') {
    const name = fd.get('name').trim();
    const sid = +fd.get('supervisor');
    if (!name) { toast('请填写小组名', 'warn'); return; }
    if (DB.teams.some(t => t.name === name && String(t.id) !== f.dataset.id)) { toast('已有同名小组', 'warn'); return; }
    let t = f.dataset.id ? DB.teams.find(x => x.id === +f.dataset.id) : null;
    if (t) {
      t.name = name; t.supervisorId = sid;
      audit('设置小组', t.name + ' · 组长 ' + (getUser(sid) || {}).name);
      toast('小组已更新');
    } else {
      t = { id: nextId('team'), name, supervisorId: sid };
      DB.teams.push(t);
      audit('新建小组', t.name + ' · 组长 ' + (getUser(sid) || {}).name);
      toast('小组已创建，去「转移组员」把员工放进来');
    }
    saveDB(); state.modal = null; render();
    return;
  }

  if (kind === 'move-member') {
    const uid = +fd.get('member'), sid = +fd.get('supervisor');
    const u = getUser(uid);
    if (state.user.role !== 'admin') { toast('只有管理员可以转移组员', 'err'); return; }
    const old = u.managerId;
    if (old === sid) { toast(u.name + ' 已在该组', 'warn'); return; }
    u.managerId = sid;
    audit('转移组员', u.name + ' · ' + (getUser(old) || {}).name + ' → ' + (getUser(sid) || {}).name);
    saveDB(); render();
    toast(u.name + ' 已转给 ' + (getUser(sid) || {}).name);
    return;
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (state.modal) closeModal();
    else if (state.drawer) { state.drawer = null; render(); }
  }
});

/* ---------- 会话恢复 ---------- */
(function boot() {
  let sid = null;
  try { sid = localStorage.getItem(SESS); } catch (e) { }
  if (sid) {
    const u = getUser(+sid);
    if (u && u.active) state.user = u;
  }
  render();
})();
</script>
</body>
</html>
