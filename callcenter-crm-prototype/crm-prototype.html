<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CC CRM · 客户与外呼管理</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0c0f15; --bg2:#11151d; --panel:#151a23; --panel2:#1a212c; --panel3:#202836;
  --line:#232b39; --line2:#2d3748;
  --tx:var(--tx); --tx2:var(--tx2); --tx3:var(--tx3);
  --blue:#4c8dff; --green:#2ecc8f; --amber:#f5a524; --red:#f0556b; --purple:#a78bfa; --slate:#66718a;
  --th:#131923; --hover:#161d27; --hover2:#1a212c; --cellline:#1c2431; --dimcell:#10141c;
  --avbg:#243044; --avtx:#9db6dd; --chipbg:#1e2635; --chipbd:#2b3546;
  --brand:#f0824a; --brand-soft:rgba(240,130,74,.14); --brand2:#f5c518;
  --topbar:#11151d; --topbar-tx:var(--tx); --topbar-line:#232b39;
  --r:10px; --fs:1;
}
html[data-theme="light"]{
  --bg:#f2f4f7; --bg2:#ffffff; --panel:#ffffff; --panel2:#f7f9fc; --panel3:#eef2f7;
  --line:#e8ecf2; --line2:#d9e0ea;
  --tx:#1f2d3d; --tx2:#5f6f85; --tx3:#93a0b3;
  --blue:#3b6ef0; --green:#12a06a; --amber:#c47f00; --red:#d93a4b; --purple:#7c5cd6; --slate:#6b7789;
  --th:#f7f9fc; --hover:#f8fafc; --hover2:#f1f5f9; --cellline:#eef2f7; --dimcell:#f7f9fc;
  --avbg:#e8eef7; --avtx:#3b5478; --chipbg:#f2f5f9; --chipbd:#e2e8f0;
  --brand:#e8622a; --brand-soft:#fff3ec; --brand2:#f5c518;
  --topbar:#46566e; --topbar-tx:#ffffff; --topbar-line:#3b4a5f;
}
html[data-theme="contrast"]{
  --bg:#000000; --bg2:#000000; --panel:#080808; --panel2:#111111; --panel3:#1c1c1c;
  --line:#6a6a6a; --line2:#9a9a9a;
  --tx:#ffffff; --tx2:#f0f0f0; --tx3:#c8c8c8;
  --blue:#79b8ff; --green:#4ae3a0; --amber:#ffc247; --red:#ff7d8f; --purple:var(--purple); --slate:#b8c0cf;
  --th:#141414; --hover:#1a1a1a; --hover2:#222222; --cellline:#3a3a3a; --dimcell:#0a0a0a;
  --avbg:#1f1f1f; --avtx:#ffffff; --chipbg:#1c1c1c; --chipbd:#7a7a7a;
  --brand:#ffb070; --brand-soft:rgba(255,176,112,.16); --brand2:#ffd447;
  --topbar:#000000; --topbar-tx:#ffffff; --topbar-line:#6a6a6a;
}
html[data-theme="eye"]{
  --bg:#dde8d3; --bg2:#e7f0dd; --panel:#f1f7ea; --panel2:#e8f1de; --panel3:#dbe8cf;
  --line:#c2d3b4; --line2:#a9bf99;
  --tx:#1d2a1a; --tx2:#42533c; --tx3:#6b7d63;
  --blue:#2f6b46; --green:#2f7a4a; --amber:#8a6316; --red:#a83328; --purple:#5b4a8a; --slate:#5f6f58;
  --th:#e2eed7; --hover:#e6f0da; --hover2:#dcead0; --cellline:#cfdec2; --dimcell:#d6e3c9;
  --avbg:#d3e3c4; --avtx:#33502b; --chipbg:#e4efd9; --chipbd:#bccfad;
  --brand:#b4551f; --brand-soft:#f6e7d9; --brand2:#8a6316;
  --topbar:#3f4a37; --topbar-tx:#f2f7ec; --topbar-line:#33402c;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  font:calc(14px * var(--fs))/1.55 "Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a3342;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;height:100vh;overflow:hidden}
.side{width:212px;flex:0 0 212px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:16px 16px 13px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:calc(15px * var(--fs));letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.brand .dot{width:8px;height:8px;border-radius:2px;background:var(--blue);box-shadow:0 0 10px var(--blue)}
.brand p{margin:4px 0 0;font-size:calc(11px * var(--fs));color:var(--tx3);letter-spacing:.3px}
.nav{flex:1;padding:9px 8px;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:2px 0;border-radius:8px;
  color:var(--tx2);cursor:pointer;font-size:calc(13.5px * var(--fs));transition:.14s}
.nav a:hover{background:#18202b;color:var(--tx)}
.nav a.on{background:rgba(76,141,255,.15);color:#cfe0ff;box-shadow:inset 2px 0 0 var(--blue)}
.nav a .ic{width:16px;text-align:center;font-size:calc(13px * var(--fs));opacity:.9}
.nav .grp{font-size:calc(10.5px * var(--fs));color:#4f5a6e;padding:12px 12px 4px;letter-spacing:1px}
.side-ft{padding:11px 14px;border-top:1px solid var(--line);font-size:calc(11px * var(--fs));color:var(--tx3);line-height:1.7}
.side-ft b{color:var(--tx2);font-weight:500}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:54px;flex:0 0 54px;border-bottom:1px solid var(--line);background:var(--bg2);
  display:flex;align-items:center;gap:12px;padding:0 18px}
.top .crumb{font-size:calc(13px * var(--fs));color:var(--tx2)}
.top .crumb b{color:var(--tx);font-weight:500}
.top .sp{flex:1}
.content{flex:1;overflow:auto;padding:18px 20px 90px}

.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--tx);font-size:calc(13px * var(--fs));cursor:pointer;transition:.14s;white-space:nowrap}
.btn:hover{background:var(--panel3);border-color:#3a465c}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#3d7ef2}
.btn.ghost{background:transparent}
.btn.sm{height:26px;padding:0 9px;font-size:calc(12px * var(--fs));border-radius:6px}
.btn.danger{color:#ffb4be;border-color:#5a2a35;background:#2a1820}
.btn.danger:hover{background:#3a1d27}
.btn:disabled{opacity:.4;cursor:not-allowed}
select,input,textarea{font-family:inherit;font-size:calc(13px * var(--fs));background:var(--panel2);color:var(--tx);
  border:1px solid var(--line2);border-radius:8px;padding:7px 9px;outline:none;width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(76,141,255,.13)}
textarea{resize:vertical;line-height:1.6}
label.fl{display:block;font-size:calc(12px * var(--fs));color:var(--tx2);margin:0 0 5px}
.field{margin-bottom:12px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card-hd{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.card-hd h3{margin:0;font-size:calc(13.5px * var(--fs));font-weight:500;letter-spacing:.2px}
.card-hd .sp{flex:1}
.card-bd{padding:14px 15px}
.card-bd.tight{padding:0}
.muted{color:var(--tx2)}
.dim{color:var(--tx3)}
.tiny{font-size:calc(11.5px * var(--fs))}
.mono{font-variant-numeric:tabular-nums;font-family:"JetBrains Mono",Consolas,monospace}
.badge{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:5px;font-size:calc(11.5px * var(--fs));white-space:nowrap;border:1px solid transparent}
.b-slate{background:rgba(102,113,138,.16);color:#a8b3c8;border-color:rgba(102,113,138,.3)}
.b-blue{background:rgba(76,141,255,.14);color:var(--blue);border-color:rgba(76,141,255,.3)}
.b-amber{background:rgba(245,165,36,.13);color:var(--amber);border-color:rgba(245,165,36,.28)}
.b-green{background:rgba(46,204,143,.13);color:var(--green);border-color:rgba(46,204,143,.28)}
.b-red{background:rgba(240,85,107,.13);color:var(--red);border-color:rgba(240,85,107,.3)}
.b-purple{background:rgba(167,139,250,.14);color:var(--purple);border-color:rgba(167,139,250,.3)}
.b-gray{background:rgba(120,130,150,.1);color:#7e8899;border-color:rgba(120,130,150,.22)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi .k{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi .k .lb{font-size:calc(12px * var(--fs));color:var(--tx2)}
.kpi .k .vl{font-size:calc(27px * var(--fs));font-weight:600;margin-top:6px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .k .sub{font-size:calc(11.5px * var(--fs));color:var(--tx3);margin-top:2px}
.kpi .k.alert .vl{color:#ff8b9b}
.kpi .k.ok .vl{color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:calc(13px * var(--fs))}
th{text-align:left;font-weight:500;color:var(--tx2);font-size:calc(12px * var(--fs));padding:9px 12px;background:var(--th);
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:10px 12px;border-bottom:1px solid var(--cellline);vertical-align:middle}
tbody tr:hover{background:var(--hover)}
tbody tr.click{cursor:pointer}
tbody tr:last-child td{border-bottom:none}
tbody tr.sel{background:rgba(76,141,255,.07)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow:auto}
.empty{padding:40px 20px;text-align:center;color:var(--tx3);font-size:calc(13px * var(--fs))}
.pager{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:calc(12px * var(--fs));color:var(--tx2)}
.pager .sp{flex:1}
.grid-2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:14px;align-items:start}
.stack>*+*{margin-top:14px}
.hr{height:1px;background:var(--line);margin:12px 0}
.hidden{display:none!important}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;background:var(--chipbg);color:#9fb0c8;font-size:calc(11px * var(--fs));margin-right:4px}
.item{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid var(--cellline)}
.item:last-child{border-bottom:none}
.item:hover{background:var(--hover)}
.item .tm{width:48px;flex:0 0 48px;font-size:calc(12.5px * var(--fs));color:var(--tx2);font-variant-numeric:tabular-nums}
.item .bd{flex:1;min-width:0}
.item .bd .t1{font-size:calc(13px * var(--fs));display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.item .bd .t2{font-size:calc(11.5px * var(--fs));color:var(--tx3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ops{display:flex;gap:6px;opacity:.55;transition:.15s}
.item:hover .ops{opacity:1}
.avatar{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
  font-size:calc(11.5px * var(--fs));background:var(--avbg);color:var(--avtx);flex:0 0 26px;font-weight:500}

.calbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .wd{background:var(--th);padding:8px;text-align:center;color:var(--tx2);font-size:calc(12px * var(--fs))}
.cal .cell{background:var(--panel);min-height:92px;padding:6px 8px;cursor:pointer;position:relative;transition:.12s}
.cal .cell:hover{background:var(--hover2)}
.cal .cell.dim{background:var(--dimcell);color:var(--tx3)}
.cal .cell .d{font-size:calc(12px * var(--fs));color:var(--tx2);font-variant-numeric:tabular-nums}
.cal .cell.dim .d{color:var(--tx3)}
.cal .cell.today .d{color:#fff;background:var(--blue);width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:calc(11.5px * var(--fs))}
.cal .cell .n{position:absolute;right:8px;top:7px;font-size:calc(11px * var(--fs));color:var(--tx2)}
.cal .cell .ev{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.cal .cell .ev span{font-size:calc(10.5px * var(--fs));padding:1px 5px;border-radius:4px;background:var(--chipbg);color:#9fb0c8;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .cell .ev span.od{background:rgba(240,85,107,.16);color:var(--red)}
.cal .cell .ev span.dn{background:rgba(46,204,143,.13);color:var(--green)}
.cal .cell .ev span.cn{background:#1a1f29;color:#5d6779;text-decoration:line-through}

.mask{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:56px 20px 20px;overflow:auto}
.modal{width:100%;max-width:540px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;
  box-shadow:0 24px 60px rgba(0,0,0,.55);animation:pop .16s ease-out}
.modal.wide{max-width:720px}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.99)}to{opacity:1;transform:none}}
.modal-hd{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-hd h3{margin:0;font-size:calc(14px * var(--fs));font-weight:500}
.modal-hd .x{margin-left:auto;background:none;border:none;color:var(--tx2);font-size:calc(20px * var(--fs));cursor:pointer;line-height:1;padding:0 2px}
.modal-hd .x:hover{color:#fff}
.modal-bd{padding:16px 18px;max-height:66vh;overflow:auto}
.modal-ft{display:flex;justify-content:flex-end;gap:9px;padding:13px 18px;border-top:1px solid var(--line)}
.drawer-mask{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:55}
.drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:94vw;background:var(--bg2);
  border-left:1px solid var(--line2);z-index:56;display:flex;flex-direction:column;
  box-shadow:-20px 0 50px rgba(0,0,0,.45);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.drawer-hd{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-hd h3{margin:0;font-size:calc(14px * var(--fs));font-weight:500}
.drawer-hd .x{margin-left:auto;background:none;border:none;color:var(--tx2);font-size:calc(20px * var(--fs));cursor:pointer}
.drawer-bd{flex:1;overflow:auto;padding:16px}
.drawer-ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.notif{position:absolute;right:12px;top:46px;width:344px;background:var(--panel);border:1px solid var(--line2);
  border-radius:10px;box-shadow:0 18px 44px rgba(0,0,0,.5);z-index:50;overflow:hidden}
.notif-hd{display:flex;align-items:center;padding:10px 13px;border-bottom:1px solid var(--line);font-size:calc(12.5px * var(--fs));color:var(--tx2)}
.notif-hd .sp{flex:1}
.notif-bd{max-height:330px;overflow:auto}
.nitem{padding:11px 13px;border-bottom:1px solid var(--cellline);cursor:pointer}
.nitem:hover{background:var(--hover2)}
.nitem.unread{background:rgba(76,141,255,.055)}
.nitem .t{font-size:calc(12.5px * var(--fs));display:flex;gap:6px;align-items:center}
.nitem .t .p{width:5px;height:5px;border-radius:50%;background:var(--blue);flex:0 0 5px}
.nitem .b{font-size:calc(11.5px * var(--fs));color:var(--tx3);margin-top:2px}

.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tl .n{position:relative;padding:0 0 18px}
.tl .n::before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--panel);border:2px solid var(--line2)}
.tl .n.ok::before{border-color:var(--green)}
.tl .n.miss::before{border-color:var(--amber)}
.tl .n .h{display:flex;align-items:center;gap:8px;font-size:calc(12px * var(--fs));color:var(--tx2)}
.tl .n .c{margin-top:5px;font-size:calc(13px * var(--fs));line-height:1.65;color:var(--tx)}
.tl .n .f{margin-top:5px;font-size:calc(11.5px * var(--fs));color:var(--tx3);display:flex;gap:10px}

.bars{display:flex;align-items:flex-end;gap:14px;height:132px;padding:6px 4px 0}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b .bar{width:100%;max-width:38px;background:linear-gradient(180deg,#4c8dff,#2b5fc4);border-radius:5px 5px 2px 2px;min-height:3px;transition:.2s}
.bars .b .bar:hover{filter:brightness(1.18)}
.bars .b .v{font-size:calc(11px * var(--fs));color:var(--tx2);font-variant-numeric:tabular-nums}
.bars .b .l{font-size:calc(11px * var(--fs));color:var(--tx3)}
.pbar{height:5px;border-radius:3px;background:var(--chipbg);overflow:hidden;width:78px;display:inline-block;vertical-align:middle}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:3px}

/* 字号档位 */
html[data-fs="sm"]{--fs:.92}
html[data-fs="md"]{--fs:1}
html[data-fs="lg"]{--fs:1.12}
html[data-fs="xl"]{--fs:1.26}

/* 外观面板 */
.prefs{position:absolute;right:10px;top:44px;width:300px;background:var(--panel);border:1px solid var(--line2);
  border-radius:11px;box-shadow:0 18px 44px rgba(0,0,0,.5);z-index:52;padding:13px 14px}
.prefs h4{margin:0 0 8px;font-size:calc(12px * var(--fs));color:var(--tx2);font-weight:500;letter-spacing:.4px}
.prefs .grp{margin-bottom:13px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:56px;height:28px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);
  color:var(--tx2);font-size:calc(12px * var(--fs));cursor:pointer;transition:.14s}
.seg button:hover{background:var(--panel3);color:var(--tx)}
.seg button.on{background:rgba(76,141,255,.16);border-color:var(--blue);color:var(--blue)}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw i{width:38px;height:26px;border-radius:6px;border:2px solid transparent;cursor:pointer;display:block;position:relative}
.sw i.on{border-color:var(--blue)}
.sw i span{position:absolute;left:0;right:0;bottom:0;height:9px;border-radius:0 0 4px 4px}

/* 呼叫台 */
.callwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.callhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.callhead .prog{flex:1;height:6px;background:var(--panel3);border-radius:3px;overflow:hidden}
.callhead .prog i{display:block;height:100%;background:var(--blue)}
.callcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.callname{font-size:calc(22px * var(--fs));font-weight:600;letter-spacing:.5px}
.callphone{font-family:"JetBrains Mono",Consolas,monospace;font-size:calc(19px * var(--fs));letter-spacing:1px;margin-top:6px}
.resbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.resbtn{height:52px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);
  font-size:calc(13px * var(--fs));cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.14s}
.resbtn:hover{background:var(--panel3)}
.resbtn.on{border-color:var(--blue);background:rgba(76,141,255,.14);color:var(--blue);box-shadow:0 0 0 3px rgba(76,141,255,.1)}
.resbtn small{font-size:calc(10px * var(--fs));color:var(--tx3)}
.resbtn.on small{color:var(--blue)}
.callhist{max-height:280px;overflow:auto}
.callhist .n{padding:9px 0;border-bottom:1px solid var(--cellline)}
.callhist .n:last-child{border-bottom:none}
.selbox{max-height:170px;overflow:auto;border:1px solid var(--line2);border-radius:8px;padding:6px}
.selbox label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:calc(12.5px * var(--fs));cursor:pointer}
.selbox label:hover{background:var(--hover2)}
.kbdrow{display:flex;gap:14px;flex-wrap:wrap;font-size:calc(11px * var(--fs));color:var(--tx3)}
.kbdrow b{color:var(--tx2);font-weight:500}
.qitem{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--cellline)}
.qitem:last-child{border-bottom:none}
.qitem .qn{width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:var(--panel3);color:var(--tx3);
  font-size:calc(10.5px * var(--fs));display:flex;align-items:center;justify-content:center}
.qitem .qname{font-size:calc(12.5px * var(--fs));color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .badge{flex:0 0 auto;white-space:nowrap}
.row2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row2 .sv{font-size:calc(19px * var(--fs));font-weight:600;font-variant-numeric:tabular-nums}

/* 登录 */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 500px at 18% 0%,#16233a 0%,transparent 62%),var(--bg)}
.login .box{width:100%;max-width:880px;display:grid;grid-template-columns:1.05fr .95fr;
  background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.login .lft{padding:40px 36px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.login .lft h2{margin:0 0 2px;font-size:calc(21px * var(--fs));letter-spacing:.3px}
.lghead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lghead .logo{width:46px;height:46px;border-radius:11px;background:#fff;object-fit:contain;padding:3px;
  box-shadow:0 1px 3px rgba(16,32,56,.14),0 0 0 1px rgba(16,32,56,.06)}
.lghead .lgsub{margin:0;font-size:calc(11.5px * var(--fs));color:var(--tx3);letter-spacing:.2px}
.login .lft .sub{margin:0 0 22px;font-size:calc(12.5px * var(--fs));color:var(--tx3);line-height:1.8}
.login .lft ul{margin:0;padding:0;list-style:none}
.login .lft li{font-size:calc(12.5px * var(--fs));color:var(--tx2);padding:5px 0;display:flex;gap:8px;align-items:flex-start;line-height:1.6}
.login .lft li b{color:var(--blue);font-weight:500;flex:0 0 14px}
.login .lft .ft{margin-top:auto;font-size:calc(11px * var(--fs));color:#4f5a6e;line-height:1.7;padding-top:20px}
.login .rgt{padding:36px 34px;background:#12171f}
.login .rgt h3{margin:0 0 3px;font-size:calc(15px * var(--fs));font-weight:500}
.login .rgt .hint{margin:0 0 20px;font-size:calc(12px * var(--fs));color:var(--tx3)}
.login .rgt .field{margin-bottom:14px}
.login .rgt input{height:38px;font-size:calc(13.5px * var(--fs))}
.login .rgt .btn{width:100%;height:38px;justify-content:center;font-size:calc(13.5px * var(--fs));margin-top:4px}
.login .err{background:rgba(240,85,107,.1);border:1px solid rgba(240,85,107,.32);color:#ffa9b6;
  font-size:calc(12px * var(--fs));padding:8px 11px;border-radius:7px;margin-bottom:12px;display:flex;gap:7px;align-items:center}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.chip{font-size:calc(11.5px * var(--fs));padding:4px 9px;border-radius:6px;background:var(--chipbg);border:1px solid var(--chipbd);
  color:#9fb0c8;cursor:pointer;transition:.14s}
.chip:hover{background:var(--avbg);color:#cfe0ff;border-color:#3a4a63}
.login .rgt .demo{margin-top:14px;font-size:calc(11px * var(--fs));color:#5a6679;line-height:1.7}
.logincfg{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.logincfg .seg{flex:0 0 auto}
.lchips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.lchips span{font-size:calc(11px * var(--fs));color:var(--tx2);background:var(--chipbg);border:1px solid var(--chipbd);
  border-radius:5px;padding:3px 8px}
.seg.mini button{height:24px;min-width:48px;font-size:calc(11.5px * var(--fs));border-radius:6px}
.sw.mini{gap:5px}
.sw.mini i{width:26px;height:19px;border-radius:5px}
.sw.mini i span{height:6px}

/* 权限矩阵 / 数据体检 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs a{padding:9px 14px;font-size:calc(13px * var(--fs));color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--tx)}
.tabs a.on{color:#cfe0ff;border-bottom-color:var(--blue)}
.matrix td,.matrix th{padding:8px 12px}
.matrix .grp{background:var(--th);color:#7d8ba3;font-size:calc(11px * var(--fs));letter-spacing:.6px;padding:5px 12px}
.matrix .cap{font-size:calc(12.5px * var(--fs));color:var(--tx)}
.matrix .cap small{display:block;color:#5d6879;font-size:calc(11px * var(--fs));margin-top:1px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:15px;height:15px;border:1px solid var(--line2);
  border-radius:4px;background:var(--panel2);cursor:pointer;vertical-align:-2px;position:relative;transition:.12s;flex:0 0 15px}
input[type=checkbox]:hover{border-color:var(--brand)}
input[type=checkbox]:checked{background:var(--brand);border-color:var(--brand)}
input[type=checkbox]:checked:after{content:'';position:absolute;left:4.5px;top:1px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
html[data-theme="contrast"] input[type=checkbox]{border-color:#fff}
html[data-theme="contrast"] input[type=checkbox]:checked:after{border-color:#000}
input[type=checkbox]:disabled{cursor:not-allowed;opacity:.4}
.banner{display:flex;align-items:center;gap:11px;background:rgba(245,165,36,.07);border:1px solid rgba(245,165,36,.22);  border-radius:9px;padding:10px 13px;font-size:calc(12px * var(--fs));color:#e8c894;margin-bottom:12px;line-height:1.6}
.banner .sp{flex:1}
.bico{width:16px;height:16px;flex:0 0 16px;border-radius:50%;border:1.5px solid currentColor;position:relative;opacity:.85}
.bico:after{content:'!';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:calc(10px * var(--fs));font-weight:700;line-height:1}
.bulkbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:12px;
  background:var(--panel3);border:1px solid var(--line2);border-radius:11px;padding:9px 14px;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.bulkbar .n{font-size:calc(13px * var(--fs))}
.bulkbar .n b{color:var(--blue)}
.groupbox{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden}
.groupbox .gh{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--th);font-size:calc(12.5px * var(--fs))}
.groupbox .gh .sp{flex:1}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:99;
  background:#1d2735;border:1px solid var(--line2);color:#dfe7f5;padding:10px 16px;border-radius:9px;font-size:calc(13px * var(--fs));
  box-shadow:0 14px 34px rgba(0,0,0,.5);animation:tin .18s ease-out;display:flex;align-items:center;gap:8px;max-width:80vw}
.toast.ok{border-color:#2b6b52;background:#152a22;color:#a9ebcd}
.toast.warn{border-color:#6b5324;background:#2a2317;color:#f6d79a}
.toast.err{border-color:#6b2b36;background:#2a161c;color:#ffb3bf}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.help{font-size:calc(11.5px * var(--fs));color:var(--tx3);margin-top:5px;line-height:1.7}
.warnbox{background:rgba(245,165,36,.09);border:1px solid rgba(245,165,36,.28);border-radius:8px;padding:9px 12px;font-size:calc(12px * var(--fs));color:#f0cd94;line-height:1.65}
.infobox{background:rgba(76,141,255,.08);border:1px solid rgba(76,141,255,.24);border-radius:8px;padding:9px 12px;font-size:calc(12px * var(--fs));color:var(--blue);line-height:1.65}
.redbox{background:rgba(240,85,107,.08);border:1px solid rgba(240,85,107,.26);border-radius:8px;padding:9px 12px;font-size:calc(12px * var(--fs));color:#ffb3bf;line-height:1.65}
.masknum{font-family:"JetBrains Mono",Consolas,monospace;letter-spacing:.5px}
.eye{background:none;border:none;color:#6f7d95;cursor:pointer;font-size:calc(12px * var(--fs));padding:0 3px}
.eye:hover{color:var(--blue)}

/* 浅色 / 护眼主题：把深色底写死的颜色改写一遍 */
html[data-theme="light"] .nav a:hover,html[data-theme="eye"] .nav a:hover{background:var(--hover2);color:var(--tx)}
html[data-theme="light"] .nav a.on,html[data-theme="eye"] .nav a.on{background:rgba(37,99,235,.10);color:var(--blue)}
html[data-theme="light"] .nav .grp,html[data-theme="eye"] .nav .grp{color:var(--tx3)}
html[data-theme="light"] .btn:hover,html[data-theme="eye"] .btn:hover{border-color:var(--line2);background:var(--panel3)}
html[data-theme="light"] .btn.danger,html[data-theme="eye"] .btn.danger{color:#a3243a;border-color:#efc3cb;background:#fdf1f3}
html[data-theme="light"] .btn.danger:hover,html[data-theme="eye"] .btn.danger:hover{background:#fbe3e7}
html[data-theme="light"] .b-slate,html[data-theme="eye"] .b-slate{background:#eef1f6;color:#4e5b70;border-color:#dbe2ec}
html[data-theme="light"] .b-blue,html[data-theme="eye"] .b-blue{background:#e8effd;color:#1e50b5;border-color:#c9dafb}
html[data-theme="light"] .b-amber,html[data-theme="eye"] .b-amber{background:#fdf3e2;color:#8a5b06;border-color:#f2ddb7}
html[data-theme="light"] .b-green,html[data-theme="eye"] .b-green{background:#e6f7ef;color:#0b7a51;border-color:#c3e9d8}
html[data-theme="light"] .b-red,html[data-theme="eye"] .b-red{background:#fdecef;color:#a3243a;border-color:#f5c9d1}
html[data-theme="light"] .b-purple,html[data-theme="eye"] .b-purple{background:#f1ecfe;color:#5b3fbf;border-color:#ddd1fa}
html[data-theme="light"] .b-gray,html[data-theme="eye"] .b-gray{background:#f0f2f5;color:#5c6675;border-color:#e0e5ec}
html[data-theme="light"] .kpi .k.alert .vl,html[data-theme="eye"] .kpi .k.alert .vl{color:var(--red)}
html[data-theme="light"] .kpi .k.ok .vl,html[data-theme="eye"] .kpi .k.ok .vl{color:var(--green)}
html[data-theme="light"] .tag,html[data-theme="eye"] .tag{color:var(--tx2)}
html[data-theme="light"] .cal .cell.dim .d,html[data-theme="eye"] .cal .cell.dim .d{color:var(--tx3)}
html[data-theme="light"] .cal .cell .ev span,html[data-theme="eye"] .cal .cell .ev span{color:var(--tx2)}
html[data-theme="light"] .cal .cell .ev span.od,html[data-theme="eye"] .cal .cell .ev span.od{background:#fdecef;color:#a3243a}
html[data-theme="light"] .cal .cell .ev span.dn,html[data-theme="eye"] .cal .cell .ev span.dn{background:#e6f7ef;color:#0b7a51}
html[data-theme="light"] .cal .cell .ev span.cn,html[data-theme="eye"] .cal .cell .ev span.cn{background:#f0f2f5;color:#8b94a3}
html[data-theme="light"] .tl .n .c,html[data-theme="eye"] .tl .n .c{color:var(--tx)}
html[data-theme="light"] .matrix .grp,html[data-theme="eye"] .matrix .grp{color:var(--tx2)}
html[data-theme="light"] .matrix .cap small,html[data-theme="eye"] .matrix .cap small{color:var(--tx3)}
html[data-theme="light"] .banner,html[data-theme="eye"] .banner{background:#fdf6e7;border-color:#f0dcb4;color:#7a5a12}
html[data-theme="light"] .warnbox,html[data-theme="eye"] .warnbox{background:#fdf6e7;border-color:#f0dcb4;color:#7a5a12}
html[data-theme="light"] .infobox,html[data-theme="eye"] .infobox{background:#eef4fe;border-color:#cddcfa;color:#22467f}
html[data-theme="light"] .redbox,html[data-theme="eye"] .redbox{background:#fdeef0;border-color:#f3c9d1;color:#a3243a}
html[data-theme="light"] .toast,html[data-theme="eye"] .toast{background:var(--panel);border-color:var(--line2);color:var(--tx)}
html[data-theme="light"] .toast.ok,html[data-theme="eye"] .toast.ok{border-color:#a9dcc4;background:#effaf4;color:#0b7a51}
html[data-theme="light"] .toast.warn,html[data-theme="eye"] .toast.warn{border-color:#efd9ab;background:#fdf7ea;color:#8a5b06}
html[data-theme="light"] .toast.err,html[data-theme="eye"] .toast.err{border-color:#f2c3cc;background:#fdeef0;color:#a3243a}
html[data-theme="light"] .eye,html[data-theme="eye"] .eye{color:var(--tx3)}
html[data-theme="light"] .eye:hover,html[data-theme="eye"] .eye:hover{color:var(--blue)}
html[data-theme="light"] .seg button.on,html[data-theme="eye"] .seg button.on{color:var(--blue)}
html[data-theme="light"] .resbtn.on,html[data-theme="eye"] .resbtn.on{color:var(--blue)}
html[data-theme="light"] .resbtn.on small,html[data-theme="eye"] .resbtn.on small{color:var(--blue)}
html[data-theme="light"] .tabs a.on,html[data-theme="eye"] .tabs a.on{color:var(--blue)}
html[data-theme="light"] .bulkbar,html[data-theme="eye"] .bulkbar{background:var(--panel);border-color:var(--line2)}
html[data-theme="light"] .bulkbar .n b,html[data-theme="eye"] .bulkbar .n b{color:var(--blue)}
html[data-theme="light"] .modal-hd .x:hover,html[data-theme="eye"] .modal-hd .x:hover{color:var(--tx)}
html[data-theme="light"] ::-webkit-scrollbar-thumb,html[data-theme="eye"] ::-webkit-scrollbar-thumb{background:var(--line2)}
html[data-theme="light"] .login,html[data-theme="eye"] .login{background:radial-gradient(900px 500px at 18% 0%,#dbe6f7 0%,transparent 62%),var(--bg)}
html[data-theme="light"] .login .box,html[data-theme="eye"] .login .box{box-shadow:0 24px 60px rgba(20,35,60,.14)}
html[data-theme="light"] .login .rgt,html[data-theme="eye"] .login .rgt{background:#f7f9fc}
html[data-theme="light"] .login .lft li b,html[data-theme="eye"] .login .lft li b{color:var(--blue)}
html[data-theme="light"] .login .lft .ft,html[data-theme="eye"] .login .lft .ft{color:var(--tx3)}
html[data-theme="light"] .login .rgt .demo,html[data-theme="eye"] .login .rgt .demo{color:var(--tx3)}
html[data-theme="light"] .login .err,html[data-theme="eye"] .login .err{color:#a3243a}
html[data-theme="light"] .chip,html[data-theme="eye"] .chip{color:var(--tx2)}
html[data-theme="light"] .chip:hover,html[data-theme="eye"] .chip:hover{color:var(--blue);border-color:var(--line2)}
html[data-theme="light"] .avatar,html[data-theme="eye"] .avatar{background:var(--avbg);color:var(--avtx)}
/* 高对比主题：把半透明底改为实色边框，确保可读 */
html[data-theme="contrast"] .b-slate,html[data-theme="contrast"] .b-blue,html[data-theme="contrast"] .b-amber,
html[data-theme="contrast"] .b-green,html[data-theme="contrast"] .b-red,html[data-theme="contrast"] .b-purple,
html[data-theme="contrast"] .b-gray{background:#000;border-color:currentColor}
html[data-theme="contrast"] .banner{background:#000;border-color:#ffc247;color:#ffc247}
html[data-theme="contrast"] .nav a.on{background:#000;color:#79b8ff;box-shadow:inset 2px 0 0 #79b8ff}
html[data-theme="contrast"] .nav a:hover{background:#1a1a1a;color:#fff}
html[data-theme="contrast"] .toast{background:#000;border-color:#fff;color:#fff}
html[data-theme="contrast"] .infobox,html[data-theme="contrast"] .warnbox,html[data-theme="contrast"] .redbox{background:#000}

/* ===== v4 品牌化：logo 橙 + 参考稿的浅色简洁版 ===== */
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand);filter:brightness(.93)}
.btn.brand{color:var(--brand);border-color:rgba(232,98,42,.4);background:#fff}
.btn.brand:hover{background:var(--brand-soft);border-color:var(--brand)}
.nav a.on{background:var(--brand-soft);color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.tabs a.on{color:var(--brand);border-bottom-color:var(--brand)}
.seg button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.resbtn.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.resbtn.on small{color:var(--brand)}
.eye:hover{color:var(--brand)}
.bulkbar .n b{color:var(--brand)}
.side-ft a{color:var(--tx3)}
.side-ft a:hover{color:var(--brand)}
/* 顶栏：深板岩，白字，中间搜索 */
.top{background:var(--topbar);border-bottom:1px solid var(--topbar-line);color:var(--topbar-tx);gap:10px}
.top .crumb{color:rgba(255,255,255,.72)}
.top .crumb b{color:#fff}
.top .crumb a{color:rgba(255,255,255,.72)!important}
.top .tiny.dim{color:rgba(255,255,255,.55)}
.top .btn{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.16);color:#fff}
.top .btn:hover{background:rgba(255,255,255,.20);border-color:rgba(255,255,255,.28)}
.top select{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18);color:#fff}
.top select option{color:var(--tx);background:var(--panel)}
.gsearch{position:relative;width:min(320px,30vw)}
.gsearch input{height:32px;border-radius:16px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.14);color:#fff;padding:0 34px 0 14px;font-size:calc(12.5px * var(--fs))}
.gsearch input::placeholder{color:rgba(255,255,255,.5)}
.gsearch input:focus{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.34);box-shadow:none}
.gsearch .gi{position:absolute;left:12px;top:8px;color:rgba(255,255,255,.55);display:flex}
.gsearch input{padding-left:34px}
.gsearch kbd{position:absolute;right:9px;top:7px;font:11px/1 var(--mono);color:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.22);border-radius:4px;padding:2px 5px}
/* 侧栏品牌 */
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 13px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:#fff;object-fit:contain;padding:2px;
  box-shadow:0 1px 2px rgba(16,32,56,.10),0 0 0 1px rgba(16,32,56,.06)}
.brand h1{font-size:calc(15px * var(--fs));margin:0;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:calc(10.5px * var(--fs));color:var(--tx3);letter-spacing:0}
.nav a{border-radius:8px}
.nav a .ic{width:18px;display:inline-flex;align-items:center;justify-content:center;opacity:.9}
tbody tr.click:hover{background:var(--hover)}
.card{box-shadow:0 1px 2px rgba(16,32,56,.04)}
/* 浅色下的低噪音提示条 */
html[data-theme="light"] .banner{background:#fff;border-color:var(--line);border-left:3px solid var(--brand);color:var(--tx2)}
html[data-theme="light"] .warnbox{background:#fff8ec;border-color:#f3dfb8;color:#8a5b06}
html[data-theme="light"] .infobox{background:#f4f7ff;border-color:#dbe4f0;color:#2f4a7a}
html[data-theme="light"] .redbox{background:#fdf1f2;border-color:#f3cdd2;color:#a3243a}
html[data-theme="light"] .nav a.on{background:var(--brand-soft);color:var(--brand)}
html[data-theme="light"] .tabs a.on{color:var(--brand)}
</style>

<body>
<div id="app"></div>
<script>
/* =========================================================
   外呼 CRM 交互原型 v2.0
   登录 / 三级权限 / 客户资产保护 / 按量分配 / 呼叫台 / 数据体检 / 日志 / 小组
   四套主题 × 四档字号 × 中英全界面；纯前端 + localStorage

const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const ts = s => new Date(s).getTime();
const now = () => new Date();
function dAt(off, h, m) { const d = new Date(); d.setDate(d.getDate() + off); d.setHours(h || 9, m || 0, 0, 0); return d; }
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function sameDay(a, b) { return ymd(a) === ymd(b); }
const WD = ['一', '二', '三', '四', '五', '六', '日'];
function fmtDate(s) { const d = new Date(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
function fmtDT(s) { const d = new Date(s); return (d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtHm(s) { const d = new Date(s); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtMD(s) { const d = new Date(s); return pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function ago(s) {
  const diff = Date.now() - ts(s), h = diff / 36e5;
  if (h < 1) return Math.max(1, Math.round(diff / 6e4)) + ' 分钟前';
  if (h < 24) return Math.round(h) + ' 小时前';
  return Math.round(h / 24) + ' 天前';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function shortName(name) { const s = String(name || ''); return s.length > 3 ? s.slice(0, 2) : s.slice(-2); }
function avatar(name) { return '<span class="avatar">' + esc(shortName(name)) + '</span>'; }
// 马来西亚号码：本地 01X-XXXXXXX（10 位）或 011-XXXXXXXX（11 位），国际 +60 后去掉前导 0
function normPhone(p) { return String(p || '').replace(/\D/g, '').replace(/^60/, '').replace(/^0/, ''); }
function isMobile(p) { return /^1\d{8,9}$/.test(normPhone(p)); }
function maskPhone(p) {
  const d = String(p || '').replace(/\D/g, '');
  if (d.length < 9) return '***';
  return d.slice(0, 3) + '-*** ' + d.slice(-4);
}

/* ---------- 权限 ---------- */
function can(p) {
  if (!state.user) return false;
  if (state.user.role === 'admin') return true;
  if ((state.user.extra || []).includes(p)) return true;
  return (DB.roles[state.user.role] || []).includes(p);
}
function scopeIds() {
  const u = state.user;
  if (!u) return [];
  if (u.role === 'admin') return DB.users.map(x => x.id);
  if (u.role === 'supervisor') return [u.id, ...teamIds(u.id)];
  return [u.id];
}
function canSeeCustomer(c) {
  if (!c || !state.user) return false;
  if (c.mergedInto) return false;
  if (!can('customer.view')) return false;
  if (c.pool === 'public') return true;          // 公海对所有可见客户的人开放
  return scopeIds().includes(c.ownerId);
}
function visibleCustomers() { return DB.customers.filter(c => canSeeCustomer(c)); }
function visibleTasks() { const ids = scopeIds(); return DB.tasks.filter(t => ids.includes(t.assigneeId)); }
function visibleNotes() { const ids = scopeIds(); return DB.notes.filter(n => ids.includes(n.userId)); }
function assignTargets() {
  const u = state.user;
  if (!u) return [];
  if (u.role === 'admin') return activeUsers();
  if (u.role === 'supervisor') return activeUsers().filter(x => x.id === u.id || x.managerId === u.id);

}

/* ---------- 客户池：公海 / 回收 / 频次闸门 ---------- */
function ownerName(c) {
  if (!c) return '';
  if (c.pool === 'public') return '公海';
  return (getUser(c.ownerId) || {}).name || '—';
}
function myCustomers() { return visibleCustomers().filter(c => c.pool !== 'public' && c.ownerId === state.user.id); }
function privateCount(uid) { return DB.customers.filter(c => c.pool !== 'public' && c.ownerId === +uid && !c.mergedInto).length; }
function poolList() { return DB.customers.filter(c => c.pool === 'public' && !c.mergedInto); }
function lastFollowTs(c) {
  const n = DB.notes.filter(x => x.custId === c.id && !x.voided).sort((a, b) => ts(b.at) - ts(a.at))[0];
  return Math.max(n ? ts(n.at) : 0, c.claimedAt ? ts(c.claimedAt) : 0, c.lastContactAt ? ts(c.lastContactAt) : 0);
}
// 剩余保护期天数（负数=已超期）
function protectLeft(c) {
  if (!c || c.pool === 'public') return null;
  const due = lastFollowTs(c) + DB.settings.protectDays * 864e5;
  return Math.ceil((due - Date.now()) / 864e5);
}
function isRecyclable(c) {
  if (!DB.settings.poolOn || !DB.settings.autoRecycle) return false;
  if (!c || c.pool === 'public' || c.mergedInto || c.dnc) return false;
  if (hasPending(c.id)) return false;
  const left = protectLeft(c);
  return left !== null && left < 0;
}
function recycleCandidates() { return visibleCustomers().filter(isRecyclable); }
function runAutoRecycle(silent) {
  const list = recycleCandidates();
  list.forEach(c => {
    c.pool = 'public'; c.ownerId = null; c.claimedAt = null;
    DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').forEach(t => {
      t.status = 'cancelled'; t.cancelReason = '超保护期自动回收'; expireNotifs(t.id);
    });
  });
  if (list.length) { audit('自动回收', list.length + ' 位客户超保护期退回公海'); saveDB(); }
  if (!silent && list.length) toast('已回收 ' + list.length + ' 位超期客户');
  return list.length;
}
// 频次闸门：近 N 天内该客户的联系次数
function gateInfo(c) {
  const st = DB.settings;
  const used = DB.notes.filter(n => n.custId === c.id && !n.voided && (Date.now() - ts(n.at)) < st.gateDays * 864e5).length;
  return { on: !!st.gateOn, used, max: st.gateMax, days: st.gateDays, left: Math.max(0, st.gateMax - used) };
}
function gateCheck(c) {
  const st = DB.settings, g = gateInfo(c);
  if (!st.gateOn) return { ok: true };
  const h = now().getHours();
  if (h < st.gateStart || h >= st.gateEnd) {
    return { ok: false, reason: '不在允许联系时段（' + st.gateStart + ':00–' + st.gateEnd + ':00）' };
  }
  if (g.used >= g.max) {
    return { ok: false, reason: '该号码 ' + st.gateDays + ' 天内已联系 ' + g.used + ' 次，达到上限 ' + g.max + ' 次' };
  }
  return { ok: true };
}

function taskState(t) {

  if (t.status === 'cancelled') return { k: 'cancel', label: '已取消', cls: 'gray' };

  if (left < 2 * 36e5) return { k: 'soon', label: '即将到期', cls: 'amber' };
  return { k: 'pending', label: '待回访', cls: 'blue' };
}

/* ---------- 客户资产体检 ---------- */
function dupGroups() {
  const list = visibleCustomers();
  const byPhone = {};
  list.forEach(c => { const k = normPhone(c.phone); if (k) (byPhone[k] = byPhone[k] || []).push(c); });
  const groups = [];
  Object.keys(byPhone).forEach(k => {
    if (byPhone[k].length > 1) groups.push({ key: k, reason: '号码相同', items: byPhone[k] });
  });
  // 同名同公司（号码不同）也提示
  const byName = {};
  list.forEach(c => { const k = c.name + '|' + c.company; (byName[k] = byName[k] || []).push(c); });
  Object.keys(byName).forEach(k => {
    const g = byName[k];
    if (g.length > 1 && !groups.some(x => x.items.length === g.length && x.items[0].id === g[0].id)) {
      groups.push({ key: k, reason: '同名同公司', items: g });
    }
  });
  return groups;
}
function invalidList() {
  return visibleCustomers().filter(c => c.invalid || !isMobile(c.phone));
}
function cycleLists() {
  const max = DB.settings.cycleMax;
  const base = visibleCustomers().filter(c => !c.dnc && !c.invalid && isMobile(c.phone));
  const waiting = [], recycle = [];
  base.forEach(c => {
    const a = attemptsOf(c.id);
    if (!a.miss) return;
    const lastMiss = a.last === '无人接听' || a.last === '占线';
    if (!lastMiss) return;
    if (hasPending(c.id)) return;
    if (a.miss >= max) recycle.push({ c, a });
    else waiting.push({ c, a });
  });
  return { waiting, recycle, max };
}

function trText(s) {
  if (EN[s]) return EN[s];
  for (const [re, rep] of EN_RULES) if (re.test(s)) return s.replace(re, rep);
  return null;
}
function applyLang() {
  if (LANG !== 'en') return;
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while (w.nextNode()) {
    const p = w.currentNode.parentNode;
    if (!p || /^(SCRIPT|STYLE)$/.test(p.nodeName)) continue;
    nodes.push(w.currentNode);
  }
  nodes.forEach(n => {
    const raw = n.nodeValue;
    const s = raw.trim();
    if (!s) return;
    const t = trText(s);
    if (t) n.nodeValue = raw.replace(s, t);
  });
  document.querySelectorAll('[placeholder]').forEach(el => {
    const t = trText(el.getAttribute('placeholder').trim());
    if (t) el.setAttribute('placeholder', t);
  });
  document.querySelectorAll('[title]').forEach(el => {
    const t = trText(el.getAttribute('title').trim());
    if (t) el.setAttribute('title', t);
  });
}

  const recent = visibleNotes().filter(n => !n.voided).sort((a, b) => ts(b.at) - ts(a.at)).slice(0, 6);

  const dg = dupGroups(), inv = invalidList(), cy = cycleLists();

  const poolCard = isManagerOrSupervisor() ? (function () {

      cell(rq, '待审批流转', 'approvals', rq ? 'var(--amber)' : 'var(--green)') +
      '</div></div>';
  })() : '';

  const todoCard = (isManagerOrSupervisor()) ?
    '<div class="card"><div class="card-hd"><h3>客户资产待处理</h3><span class="sp"></span>' +
    '<button class="btn sm" data-act="nav" data-id="datahealth">打开客户体检</button></div>' +
    '<div class="card-bd" style="display:flex;gap:10px;text-align:center">' +

  return kpi +
    '<div class="grid-2">' +
    '<div class="stack">' +
    '<div class="card"><div class="card-hd"><h3>今日回访</h3><span class="badge b-blue">' + todayPending.length + '</span><span class="sp"></span>' +

    '<div class="card-bd tight">' + todayList + '</div></div>' +
    '<div class="card"><div class="card-hd"><h3>逾期未回访</h3><span class="badge b-red">' + overdue.length + '</span><span class="sp"></span>' +
    '<span class="tiny dim">按计划时间升序</span></div><div class="card-bd tight">' + overdueList + '</div></div>' +
    '</div>' +
    '<div class="stack">' +
    poolCard +
    todoCard +
    '<div class="card"><div class="card-hd"><h3>最近呼叫记事</h3><span class="sp"></span>' +
    '<button class="btn sm" data-act="nav" data-id="notes">全部</button></div>' +
    '<div class="card-bd tight">' + recentList + '</div></div>' +

    (can('customer.assign') ? '<button class="btn" data-act="nav" data-id="customers">⇄ 分配客户给下属</button>' : '') +
    (can('customer.create') ? '<button class="btn" data-act="new-customer">＋ 新增客户</button>' : '') +
    '<button class="btn" data-act="nav" data-id="calendar">▦ 安排回访</button>' +
    (can('report.team') ? '<button class="btn" data-act="nav" data-id="board">▩ 团队情况</button>' : '') +
    '</div></div>' +
    '</div></div>';
}
function isManagerOrSupervisor() { return state.user && state.user.role !== 'agent'; }

/* ---------- 客户列表 ---------- */
function filteredCustomers() {
  const tab = state.poolTab || 'mine';
  let list;
  if (tab === 'pool') list = poolList();
  else if (tab === 'recycle') list = recycleCandidates();
  else list = visibleCustomers().filter(c => c.pool !== 'public');
  const q = state.q.trim().toLowerCase();
  if (q) list = list.filter(c => (c.name + c.phone + c.company).toLowerCase().includes(q));
  if (state.fStatus) list = list.filter(c => c.status === state.fStatus);
  if (state.fOwner) list = list.filter(c => c.ownerId === +state.fOwner);
  if (state.fQuality === 'invalid') list = list.filter(c => c.invalid || !isMobile(c.phone));
  if (state.fQuality === 'cycle') {
    const ids = cycleLists();
    const set = new Set([...ids.waiting, ...ids.recycle].map(x => x.c.id));
    list = list.filter(c => set.has(c.id));
  }
  if (state.fQuality === 'dup') {
    const set = new Set();
    dupGroups().forEach(g => g.items.forEach(c => set.add(c.id)));
    list = list.filter(c => set.has(c.id));
  }
  // 最近联系过的排前面，未联系的新名单排后面
  return list.sort((a, b) => (ts(b.lastContactAt || 0) - ts(a.lastContactAt || 0)) || (b.id - a.id));
}

    '<div class="stack">' +
    '<div class="card"><div class="card-hd"><h3>回访安排</h3><span class="badge b-blue">待处理 ' + pending.length + '</span></div>' +
    '<div class="card-bd tight">' + taskList + '</div></div>' +
    '<div class="card"><div class="card-hd"><h3>客户资料</h3></div><div class="card-bd">' +
    '<table style="font-size:calc(12.5px * var(--fs))"><tbody>' +
    '<tr><td class="dim" style="width:78px;border:none;padding:5px 0">公司</td><td style="border:none;padding:5px 0">' + esc(c.company) + '</td></tr>' +
    '<tr><td class="dim" style="border:none;padding:5px 0">来源</td><td style="border:none;padding:5px 0">' + esc(c.source) + '</td></tr>' +
    '<tr><td class="dim" style="border:none;padding:5px 0">分类</td><td style="border:none;padding:5px 0">' + esc(c.category) + '</td></tr>' +
    '<tr><td class="dim" style="border:none;padding:5px 0">备注</td><td style="border:none;padding:5px 0">' + esc(c.remark) + '</td></tr>' +
    '</tbody></table>' +
    '<div class="hr"></div>' +
    (can('customer.invalid') ? '<button class="btn sm ' + (c.invalid ? '' : 'danger') + '" data-act="toggle-invalid" data-id="' + c.id + '" style="width:100%;margin-bottom:7px">' + (c.invalid ? '解除无效标记' : '标记无效号码') + '</button>' : '') +
    (can('customer.edit') ? '<button class="btn sm ' + (c.dnc ? '' : 'danger') + '" data-act="toggle-dnc" data-id="' + c.id + '" style="width:100%">' + (c.dnc ? '解除禁止联系' : '标记禁止联系') + '</button>' : '') +
    '</div></div>' +
    '</div></div>';
}

/* ---------- 客户体检 ---------- */
function datahealthView() {
  if (!can('customer.merge') && !can('customer.invalid')) return noPerm('你没有数据体检权限');
  const tabs = [
    { id: 'dup', label: '重复客户' },
    { id: 'invalid', label: '无效 / 异常号码' },
    { id: 'cycle', label: '周期重呼' }
  ];
  const dg = dupGroups(), inv = invalidList(), cy = cycleLists();
  const counts = { dup: dg.length, invalid: inv.length, cycle: cy.waiting.length + cy.recycle.length };
  const tabBar = '<div class="tabs">' + tabs.map(t =>
    '<a data-act="dh-tab" data-id="' + t.id + '" class="' + (state.dhTab === t.id ? 'on' : '') + '">' + t.label +
    ' <span class="badge b-slate">' + counts[t.id] + '</span></a>').join('') + '</div>';

  let body = '';
  if (state.dhTab === 'dup') {
    body = dg.length ? dg.map((g, gi) => {
      const items = g.items.slice().sort((a, b) => (b.lastContactAt ? 1 : 0) - (a.lastContactAt ? 1 : 0) || b.id - a.id);
      return '<div class="groupbox"><div class="gh"><span class="badge b-amber">' + g.reason + '</span>' +
        '<span class="mono tiny dim">' + esc(normPhone(items[0].phone)) + '</span><span class="sp"></span>' +
        '<button class="btn sm" data-act="merge" data-id="' + gi + '">合并…</button></div>' +
        '<table><thead><tr><th>客户</th><th>电话</th><th>公司</th><th>负责人</th><th>最近联系</th><th>记事</th><th>待办</th></tr></thead><tbody>' +
        items.map(c => '<tr class="click" data-act="open-customer" data-id="' + c.id + '">' +
          '<td>' + esc(c.name) + (c.id === items[0].id ? ' <span class="badge b-blue">建议主记录</span>' : '') + '</td>' +
          '<td class="mono tiny">' + esc(normPhone(c.phone)) + '</td>' +
          '<td class="tiny">' + esc(c.company) + '</td>' +
          '<td class="tiny">' + esc((getUser(c.ownerId) || {}).name) + '</td>' +
          '<td class="tiny dim">' + (c.lastContactAt ? fmtMD(c.lastContactAt) : '未联系') + '</td>' +
          '<td class="tiny">' + custNotes(c.id).length + '</td>' +
          '<td class="tiny">' + DB.tasks.filter(t => t.custId === c.id && t.status === 'pending').length + '</td></tr>').join('') +
        '</tbody></table></div>';
    }).join('') : '<div class="card"><div class="empty">没有发现重复客户</div></div>';
    body += '<div class="help">判定规则：标准化手机号相同，或姓名 + 公司完全相同。合并后记事与未完成回访会转移到主记录，重复记录隐藏但保留可追溯。</div>';
  }

  if (state.dhTab === 'invalid') {
    const rows = inv.length ? inv.map(c => {
      const reason = c.invalidReason || (isMobile(c.phone) ? '' : '号码格式不符合手机号规则');
      return '<tr class="click" data-act="open-customer" data-id="' + c.id + '">' +
        '<td>' + esc(c.name) + '<div class="tiny dim">' + esc(c.company) + '</div></td>' +
        '<td class="mono tiny">' + esc(c.phone) + '</td>' +
        '<td class="tiny" style="color:var(--red)">' + esc(reason) + '</td>' +
        '<td>' + (c.invalid ? '<span class="badge b-red">已停呼</span>' : '<span class="badge b-amber">待处理</span>') + '</td>' +
        '<td class="tiny">' + esc((getUser(c.ownerId) || {}).name) + '</td>' +
        '<td>' + (can('customer.invalid') ? (c.invalid
          ? '<button class="btn sm" data-act="toggle-invalid" data-id="' + c.id + '">解除</button>'
          : '<button class="btn sm danger" data-act="toggle-invalid" data-id="' + c.id + '">标记无效</button>') : '<span class="dim tiny">—</span>') + '</td></tr>';
    }).join('') : emptyRow(6, '没有异常号码');
    body = '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>客户</th><th>号码</th><th>判定原因</th><th>状态</th><th>负责人</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
      '<div class="help">标记无效后：该客户不进入周期重呼、不能新建回访，已有待办自动取消并留痕。解除需填写原因。</div>';
  }

  if (state.dhTab === 'cycle') {
    const st = DB.settings;
    const rowOf = (x, kind) => {
      const c = x.c, a = x.a;
      return '<tr class="click" data-act="open-customer" data-id="' + c.id + '">' +
        '<td>' + esc(c.name) + '<div class="tiny dim">' + esc(c.company) + '</div></td>' +
        '<td class="mono tiny">' + maskPhone(c.phone) + '</td>' +
        '<td class="num tiny">' + a.miss + ' 次</td>' +
        '<td class="tiny">' + resultBadge(a.last) + '</td>' +
        '<td class="tiny dim">' + (c.lastContactAt ? ago(c.lastContactAt) : '—') + '</td>' +
        '<td class="tiny">' + esc((getUser(c.ownerId) || {}).name) + '</td>' +
        '<td>' + (kind === 'wait'
          ? (can('task.create') ? '<button class="btn sm" data-act="cycle-create" data-id="' + c.id + '">按周期排下次</button>' : '<span class="dim tiny">—</span>')
          : (can('customer.invalid') ? '<button class="btn sm danger" data-act="toggle-invalid" data-id="' + c.id + '">标记无效</button>' : '<span class="dim tiny">—</span>')) +
        '</td></tr>';
    };
    body = '<div class="infobox" style="margin-bottom:12px">周期规则：未接通的客户每 <b>' + st.cycleDays + '</b> 天自动排下一次呼叫，最多 <b>' + st.cycleMax + '</b> 次；达到上限仍未接通进入「待回收」，由主管决定继续或标记无效。</div>' +
      '<div class="card" style="margin-bottom:12px"><div class="card-hd"><h3>待重呼</h3><span class="badge b-blue">' + cy.waiting.length + '</span><span class="sp"></span>' +
      (can('task.create') && cy.waiting.length ? '<button class="btn sm primary" data-act="cycle-create-all">全部按周期排期</button>' : '') + '</div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>客户</th><th>号码</th><th class="num">未接次数</th><th>最近结果</th><th>最近联系</th><th>负责人</th><th>操作</th></tr></thead><tbody>' +
      (cy.waiting.length ? cy.waiting.map(x => rowOf(x, 'wait')).join('') : emptyRow(7, '没有待重呼客户')) + '</tbody></table></div></div>' +
      '<div class="card"><div class="card-hd"><h3>待回收（已达 ' + cy.max + ' 次上限）</h3><span class="badge b-red">' + cy.recycle.length + '</span><span class="sp"></span>' +
      '<span class="tiny dim">建议核实号码或退回主管重新分配</span></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>客户</th><th>号码</th><th class="num">未接次数</th><th>最近结果</th><th>最近联系</th><th>负责人</th><th>操作</th></tr></thead><tbody>' +
      (cy.recycle.length ? cy.recycle.map(x => rowOf(x, 'recycle')).join('') : emptyRow(7, '没有待回收客户')) + '</tbody></table></div></div>';
  }

  return '<div class="banner">⌗ <span>客户体检把「重复、打不通、反复打不通」三类问题集中处理，避免坐席把时间花在无效号码上。</span></div>' +
    tabBar + body;
}

/* ---------- 日历 ---------- */
function calendarView() {
  const y = state.calY, m = state.calM;
  const first = new Date(y, m, 1);
  let lead = first.getDay() - 1; if (lead < 0) lead = 6;
  const start = addDays(first, -lead);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    const key = ymd(d);
    const dayTasks = visibleTasks().filter(t => ymd(new Date(t.scheduledAt)) === key);
    const evs = dayTasks.slice(0, 3).map(t => {
      const c = getCustomer(t.custId), st = taskState(t);
      const cls = st.k === 'overdue' ? 'od' : st.k === 'done' ? 'dn' : st.k === 'cancel' ? 'cn' : '';
      return '<span class="' + cls + '">' + fmtHm(t.scheduledAt) + ' ' + (c ? esc(c.name) : '') + '</span>';
    }).join('');
    cells.push('<div class="cell ' + (d.getMonth() === m ? '' : 'dim') + (sameDay(d, now()) ? ' today' : '') + '" data-act="open-day" data-id="' + key + '">' +
      '<span class="d">' + d.getDate() + '</span>' +
      (dayTasks.length ? '<span class="n">' + dayTasks.length + '</span>' : '') +
      '<div class="ev">' + evs + '</div></div>');
  }
  const wd = WD.map(w => '<div class="wd">周' + w + '</div>').join('');
  const pendingAll = visibleTasks().filter(t => t.status === 'pending').sort((a, b) => ts(a.scheduledAt) - ts(b.scheduledAt));
  const listRows = pendingAll.map(t => {
    const c = getCustomer(t.custId);
    return '<tr class="click" data-act="open-task" data-id="' + t.id + '">' +
      '<td class="mono tiny">' + fmtDT(t.scheduledAt) + '</td>' +
      '<td>' + (c ? esc(c.name) : '') + '<div class="tiny dim">' + esc(t.title) + '</div></td>' +
      '<td class="tiny">' + esc((getUser(t.assigneeId) || {}).name) + '</td>' +
      '<td>' + taskBadge(t) + '</td></tr>';
  }).join('') || emptyRow(4, '没有待处理回访');

  const today0 = startOfDay(now()).getTime(), tmr0 = addDays(startOfDay(now()), 1).getTime();
  const allPend = visibleTasks().filter(t => t.status === 'pending');
  const todayP = allPend.filter(t => ts(t.scheduledAt) >= today0 && ts(t.scheduledAt) < tmr0).sort((a, b) => ts(a.scheduledAt) - ts(b.scheduledAt));
  const overP = allPend.filter(t => ts(t.scheduledAt) < today0).sort((a, b) => ts(a.scheduledAt) - ts(b.scheduledAt));
  const doneWeek = visibleTasks().filter(t => t.status === 'completed' && t.completedAt && ts(t.completedAt) >= addDays(startOfDay(now()), -6).getTime()).length;
  const mine = state.user.role === 'agent' ? myCustomers() : visibleCustomers().filter(c => c.pool !== 'public');

  const kpi = '<div class="kpi">' +
    kpiCard('今日待回访', todayP.length, todayP.length ? '最早 ' + fmtHm(todayP[0].scheduledAt) : '今天没有安排', '') +
    kpiCard('逾期未回访', overP.length, overP.length ? '最早逾期 ' + ago(overP[0].scheduledAt) : '没有逾期，保持住', overP.length ? 'alert' : 'ok') +
    kpiCard('近 7 日已完成', doneWeek, '回访任务完成数', doneWeek ? 'ok' : '') +
    kpiCard(state.user.role === 'agent' ? '我名下客户' : '团队客户', mine.length, '公海可领取 ' + poolList().length + ' 位', '') +
    '</div>';

  const rowOf = (t, overdue) => {
    const c = getCustomer(t.custId), st = taskState(t);
    const gate = c ? gateInfo(c) : null;
    return '<div class="item"><div class="tm mono" style="' + (overdue ? 'color:var(--red)' : '') + '">' +
      (overdue ? fmtMD(t.scheduledAt) : fmtHm(t.scheduledAt)) + '</div>' +
      '<div class="bd"><div class="t1">' + (c ? esc(c.name) : '?') +
      ' <span class="dim tiny">' + (c ? esc(c.company) : '') + '</span>' +
      (overdue ? ' <span class="badge b-red">逾期 ' + Math.round((Date.now() - ts(t.scheduledAt)) / 36e5 / 24) + ' 天</span>' : '') +
      (st.k === 'soon' ? ' <span class="badge b-amber">即将到期</span>' : '') +
      (gate && gate.on && gate.left === 0 ? ' <span class="badge b-gray">频次已满</span>' : '') + '</div>' +
      '<div class="t2">' + esc(t.title) + ' · <span class="mono">' + maskPhone(c ? c.phone : '') + '</span></div></div>' +
      '<div class="ops">' +
      '<button class="btn sm" data-act="open-customer" data-id="' + t.custId + '">详情</button>' +
      '<button class="btn sm primary" data-act="new-note" data-id="' + t.custId + '" data-task="' + t.id + '">写跟进</button>' +
      '</div></div>';
  };

  const lists = '<div class="grid-2" style="margin-top:14px">' +
    '<div class="card"><div class="card-hd"><h3>今日待回访</h3><span class="badge b-blue">' + todayP.length + '</span><span class="sp"></span>' +
    '<span class="tiny dim">按计划时间升序</span></div><div class="card-bd tight">' +
    (todayP.length ? todayP.map(t => rowOf(t, false)).join('') : '<div class="empty">今天没有待回访，可以从公海领取新客户</div>') +
    '</div></div>' +
    '<div class="card"><div class="card-hd"><h3>逾期未回访</h3><span class="badge b-red">' + overP.length + '</span><span class="sp"></span>' +
    '<span class="tiny dim">越早越该先处理</span></div><div class="card-bd tight">' +
    (overP.length ? overP.slice(0, 8).map(t => rowOf(t, true)).join('') : '<div class="empty">没有逾期</div>') +
    '</div></div></div>';

  return kpi +
    '<div class="calbar">' +
    '<button class="btn sm" data-act="cal-prev">‹</button>' +
    '<b style="font-size:calc(14px * var(--fs));min-width:110px;display:inline-block;text-align:center">' + y + ' 年 ' + (m + 1) + ' 月</b>' +
    '<button class="btn sm" data-act="cal-next">›</button>' +
    '<button class="btn sm" data-act="cal-today">今天</button>' +
    '<span style="flex:1"></span>' +
    '<button class="btn sm ' + (state.calMode === 'month' ? 'primary' : '') + '" data-act="cal-mode" data-id="month">月视图</button>' +
    '<button class="btn sm ' + (state.calMode === 'list' ? 'primary' : '') + '" data-act="cal-mode" data-id="list">列表</button>' +
    '</div>' +
    (state.calMode === 'month'
      ? '<div class="cal">' + wd + cells.join('') + '</div><div class="help" style="margin-top:10px">日历直接读取回访任务，不维护第二套日期。红=逾期 · 绿=已完成 · 灰划线=已取消。点击任意日期查看当天安排。</div>'
      : '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>计划时间</th><th>客户 / 事项</th><th>执行人</th><th>状态</th></tr></thead><tbody>' + listRows + '</tbody></table></div></div>') +
    lists;
}

/* ---------- 呼叫记事 ---------- */
function notesView() {
  let list = visibleNotes().filter(n => !n.voided);
  if (state.fResult) list = list.filter(n => n.result === state.fResult);
  if (state.fEmp) list = list.filter(n => n.userId === +state.fEmp);
  list = list.sort((a, b) => ts(b.at) - ts(a.at)).slice(0, 80);
  const resultOpts = ['', '已接通', '无人接听', '占线', '号码无效', '拒绝联系'].map(r =>
    '<option value="' + r + '"' + (state.fResult === r ? ' selected' : '') + '>' + (r || '全部结果') + '</option>').join('');
  const empOpts = '<option value="">全部员工</option>' + DB.users.filter(u => scopeIds().includes(u.id)).map(u =>
    '<option value="' + u.id + '"' + (+state.fEmp === u.id ? ' selected' : '') + '>' + esc(u.name) + '</option>').join('');
  const rows = list.map(n => {
    const c = getCustomer(n.custId), uu = getUser(n.userId);

      '<td class="mono tiny">' + fmtDT(n.at) + '</td>' +
      '<td>' + (c ? esc(c.name) : '') + '<div class="tiny dim">' + (c ? esc(c.company) : '') + '</div></td>' +
      '<td>' + resultBadge(n.result) + '</td>' +
      '<td class="tiny" style="max-width:380px">' + esc(n.content) + '</td>' +
      '<td class="tiny dim">' + (uu ? esc(uu.name) : '') + '</td></tr>';

  return '<div class="card"><div class="card-hd">' +
    '<select data-change="f-result" style="width:130px">' + resultOpts + '</select>' +

    '<div class="tbl-wrap"><table><thead><tr><th>联系时间</th><th>客户</th><th>结果</th><th>记事内容</th><th>记录人</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}

/* ---------- 主管看板 ---------- */
function boardView() {
  if (!can('report.team')) return noPerm('你没有团队统计权限');
  const ids = scopeIds();
  const team = DB.users.filter(u => ids.includes(u.id));
  const custs = visibleCustomers();
  const today0 = startOfDay(now()).getTime();
  const notes = visibleNotes().filter(n => !n.voided);
  const notesToday = notes.filter(n => sameDay(new Date(n.at), now()));
  const tasks = visibleTasks();
  const pending = tasks.filter(t => t.status === 'pending');
  const overdue = pending.filter(t => ts(t.scheduledAt) < today0);

  const kpi = '<div class="kpi">' +
    kpiCard('团队客户', custs.length, '今日新增 ' + custs.filter(c => sameDay(new Date(c.createdAt), now())).length, '') +
    kpiCard('今日登记外呼', notesToday.length, '较昨日 ' + ((notesToday.length - notes.filter(n => sameDay(new Date(n.at), addDays(now(), -1))).length) > 0 ? '+' : '') + (notesToday.length - notes.filter(n => sameDay(new Date(n.at), addDays(now(), -1))).length) + ' 条', '') +
    kpiCard('当前逾期回访', overdue.length, '涉及 ' + new Set(overdue.map(t => t.assigneeId)).size + ' 名员工', overdue.length ? 'alert' : 'ok') +
    kpiCard('今日完成回访', tasks.filter(t => t.status === 'completed' && t.completedAt && sameDay(new Date(t.completedAt), now())).length, '按完成时间统计', '') +
    '</div>';

  const rows = team.map(u => {
    const uc = custs.filter(c => c.ownerId === u.id);
    const un = notesToday.filter(n => n.userId === u.id);
    const ut = pending.filter(t => t.assigneeId === u.id);
    const uo = ut.filter(t => ts(t.scheduledAt) < today0);
    const udone = tasks.filter(t => t.assigneeId === u.id && t.status === 'completed' && t.completedAt && sameDay(new Date(t.completedAt), now()));
    const rate = ut.length ? Math.round((ut.length - uo.length) / ut.length * 100) : null;
    return '<tr class="click" data-act="open-agent" data-id="' + u.id + '">' +
      '<td><div style="display:flex;align-items:center;gap:8px">' + avatar(u.name) + '<div>' + esc(u.name) +
      '<div class="tiny dim">' + ({ admin: '管理员', supervisor: '主管', agent: '员工' }[u.role]) + '</div></div></div></td>' +
      '<td class="num">' + uc.length + '</td>' +
      '<td class="num">' + un.length + '</td>' +
      '<td class="num">' + new Set(un.map(n => n.custId)).size + '</td>' +
      '<td class="num">' + un.filter(n => n.result === '已接通').length + '</td>' +
      '<td class="num">' + udone.length + '</td>' +
      '<td class="num">' + (uo.length ? '<span class="badge b-red">' + uo.length + '</span>' : '<span class="dim">0</span>') + '</td>' +
      '<td>' + (rate === null ? '<span class="dim">—</span>' : '<span class="pbar"><i style="width:' + rate + '%"></i></span> <span class="tiny dim">' + rate + '%</span>') + '</td>' +
      '</tr>';
  }).join('');

  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(now(), -i);
    days.push({ d, n: notes.filter(x => sameDay(new Date(x.at), d)).length });
  }
  const max = Math.max(1, ...days.map(x => x.n));
  const bars = days.map(x => '<div class="b"><span class="v">' + x.n + '</span>' +
    '<div class="bar" style="height:' + Math.max(3, Math.round(x.n / max * 96)) + '%"></div>' +
    '<span class="l">' + (sameDay(x.d, now()) ? '今天' : (x.d.getMonth() + 1) + '/' + x.d.getDate()) + '</span></div>').join('');

  const recent = notes.sort((a, b) => ts(b.at) - ts(a.at)).slice(0, 7).map(n => {
    const c = getCustomer(n.custId), uu = getUser(n.userId);
    return '<div class="item"><div class="tm">' + fmtMD(n.at) + '</div><div class="bd">' +
      '<div class="t1">' + (uu ? esc(uu.name) : '') + ' → ' + (c ? esc(c.name) : '') + ' ' + resultBadge(n.result) + '</div>' +
      '<div class="t2">' + esc(n.content) + '</div></div></div>';
  }).join('');

  return kpi +
    '<div class="card" style="margin-bottom:14px"><div class="card-hd"><h3>下属统计</h3><span class="sp"></span>' +
    '<span class="tiny dim">点击姓名查看预览 · 数据为当前团队范围</span></div>' +
    '<div class="tbl-wrap"><table><thead><tr>' +
    '<th>员工</th><th class="num">客户数</th><th class="num">今日登记</th><th class="num">联系客户</th><th class="num">已接通</th><th class="num">今日完成</th><th class="num">当前逾期</th><th>按时率</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
    '<div class="grid-2">' +
    '<div class="card"><div class="card-hd"><h3>近 7 日登记外呼</h3><span class="sp"></span><span class="tiny dim">人工登记次数</span></div>' +
    '<div class="card-bd"><div class="bars">' + bars + '</div></div></div>' +
    '<div class="card"><div class="card-hd"><h3>最近团队动态</h3></div><div class="card-bd tight">' + (recent || '<div class="empty">暂无</div>') + '</div></div>' +
    '</div>' +
    '<div class="help" style="margin-top:10px">统计口径：登记外呼 = 未作废记事数；联系客户 = 有记事的客户去重数；已接通 = 人工标记为已接通；' +
    '当前逾期 = 待处理且计划时间早于今日 0 点。系统不采集通话时长与真实接通率。</div>';
}

/* ---------- 权限管理 ---------- */
function permsView() {
  if (!can('perm.manage')) return noPerm('你没有权限配置权限');
  const groups = [...new Set(PERMS.map(p => p.g))];
  let rows = '';
  groups.forEach(g => {
    rows += '<tr><td class="grp" colspan="4">' + g + '</td></tr>';
    PERMS.filter(p => p.g === g).forEach(p => {
      rows += '<tr><td class="cap">' + p.n + '<small>' + p.d + '</small></td>' +
        ['admin', 'supervisor', 'agent'].map(r => {
          const on = (DB.roles[r] || []).includes(p.id);
          if (r === 'admin') return '<td style="text-align:center"><span style="color:var(--green);font-size:calc(13px * var(--fs))">✓</span></td>';
          return '<td style="text-align:center"><input type="checkbox" ' + (on ? 'checked' : '') +
            ' data-role-perm="' + r + '|' + p.id + '"></td>';
        }).join('') + '</tr>';
    });

  const userOpts = DB.users.map(u => '<option value="' + u.id + '">' + esc(u.name) + ' · ' + ({ admin: '管理员', supervisor: '主管', agent: '员工' }[u.role]) + '</option>').join('');
  const pick = state.permUser ? +state.permUser : DB.users[0].id;

        : '<span class="tiny dim">暂无组员</span>') + '</div></td>' +
      '<td class="num">' + mem.length + '</td>' +

  const moveForm = isAdmin ? '<form data-form="move-member"><div class="row" style="align-items:flex-end">' +
    '<div class="field"><label class="fl">组员</label><select name="member">' +
    DB.users.filter(u => u.role === 'agent').map(u =>
      '<option value="' + u.id + '">' + esc(u.name) + ' · 现属 ' + (getUser(u.managerId) || { name: '无' }).name + '</option>').join('') +

    '<div class="field" style="flex:0 0 auto"><button class="btn primary" style="height:34px">转移</button></div>' +
    '</div>' +
    '<div class="help">转移会改变该组员可见的客户范围（客户仍归本人，不随组长变化）；已完成回访与历史记事保留。</div>' +
    '</form>' : '<div class="help">只有管理员可以转移组员。主管可在「用户管理」里新增本组组员。</div>';

  const teamCard = '<div class="card"><div class="card-hd"><h3>小组管理</h3><span class="sp"></span>' +

    '<tr><td class="dim" style="border:none;padding:6px 0;width:80px">管理员</td><td style="border:none;padding:6px 0">全部客户、全部账号、可导出明文号码</td></tr>' +
    '<tr><td class="dim" style="border:none;padding:6px 0">主管</td><td style="border:none;padding:6px 0">本人 + 直属下属的客户；可分配客户、上传名单</td></tr>' +

    '<div class="field"><select data-change="perm-user">' + userOpts + '</select></div>' +
    (pu ? '<div class="tiny dim" style="margin-bottom:8px">' + esc(pu.name) + ' 当前角色：' + ({ admin: '管理员', supervisor: '主管', agent: '员工' }[pu.role]) + '。以下为角色未包含、可单独授予的权限：</div>' +

    '</div></div></div>';
}

/* ---------- 呼叫台 ---------- */
function callQueue() {
  const u = state.user;
  const gateOk = c => !DB.settings.gateOn || gateInfo(c).left > 0;
  const mine = DB.customers.filter(c => canSeeCustomer(c) && c.pool !== 'public' && c.ownerId === u.id
    && !c.dnc && !c.invalid && isMobile(c.phone)
    && c.status !== '已成交' && c.status !== '无意向' && gateOk(c));
  const tasks = DB.tasks.filter(t => t.assigneeId === u.id && t.status === 'pending').sort((a, b) => ts(a.scheduledAt) - ts(b.scheduledAt));
  const seen = new Set(), out = [];
  tasks.forEach(t => {
    if (seen.has(t.custId)) return;
    const c = getCustomer(t.custId);
    if (!c || c.dnc || c.invalid || c.pool === 'public' || !gateOk(c)) return;
    seen.add(t.custId); out.push({ c, t });
  });
  mine.filter(c => !seen.has(c.id) && !hasPending(c.id) && c.status === '待联系').forEach(c => { seen.add(c.id); out.push({ c, t: null }); });
  mine.filter(c => !seen.has(c.id) && !hasPending(c.id)).forEach(c => { seen.add(c.id); out.push({ c, t: null }); });
  return out.filter(x => !state.callSkip.has(x.c.id) && !state.callDone.has(x.c.id));
}

    '<div style="margin-left:auto;text-align:right">' + custBadge(c.status) +
    '<div class="tiny dim" style="margin-top:6px">累计呼叫 ' + a.total + ' 次 · 未接 ' + a.miss + ' 次</div>' +
    (gateInfo(c).on ? '<div class="tiny dim" style="margin-top:2px">近 ' + gateInfo(c).days + ' 天已联系 ' + gateInfo(c).used + '/' + gateInfo(c).max + ' 次</div>' : '') +
    (a.last ? '<div class="tiny dim" style="margin-top:2px">上次结果：' + a.last + '</div>' : '') +
    (nc ? '<div class="tiny dim" style="margin-top:2px">下次回访 ' + fmtDT(nc) + '</div>' : '') +
    '</div></div>' +
    '<div class="resbtns">' + RESULTS.map((r, i) =>
      '<button class="resbtn ' + (state.callResult === r ? 'on' : '') + '" data-act="call-result" data-id="' + r + '">' +
      r + '<small>' + (i + 1) + '</small></button>').join('') + '</div>' +
    '<div class="row"><div class="field" style="flex:2"><label class="fl">记事内容</label>' +

  const hist = '<div class="card"><div class="card-hd"><h3>历史记事</h3><span class="badge b-slate">' + notes.length + '</span><span class="sp"></span>' +

  // 队列预览 + 本次会话进度，让右侧不留大片空白
  const next = q.slice(1, 5);
  const doneToday = DB.notes.filter(n => n.userId === state.user.id && !n.voided && sameDay(new Date(n.at), now())).length;
  const connToday = DB.notes.filter(n => n.userId === state.user.id && !n.voided && n.result === '已接通' && sameDay(new Date(n.at), now())).length;
  const queueCard = '<div class="card"><div class="card-hd"><h3>队列预览</h3><span class="sp"></span>' +
    '<span class="tiny dim">接下来 ' + next.length + ' 位</span></div>' +
    '<div class="card-bd tight">' +
    (next.length ? next.map((x, i) => {
      const nc2 = nextCallback(x.c.id);
      return '<div class="qitem"><span class="qn">' + (i + 2) + '</span>' +
        '<div style="min-width:0"><div class="qname">' + esc(x.c.name) + '</div>' +
        '<div class="tiny dim">' + esc(x.c.company) + (nc2 ? ' · ' + fmtDT(nc2) : '') + '</div></div>' +
        custBadge(x.c.status) + '</div>';
    }).join('') : '<div class="empty" style="padding:16px">这是队列最后一位</div>') +
    '</div></div>' +
    '<div class="card" style="margin-top:12px"><div class="card-hd"><h3>本次会话</h3></div><div class="card-bd">' +
    '<div class="row2"><div><div class="tiny dim">已处理</div><div class="sv">' + state.callDone.size + '</div></div>' +
    '<div><div class="tiny dim">剩余</div><div class="sv">' + q.length + '</div></div>' +
    '<div><div class="tiny dim">今日登记</div><div class="sv">' + doneToday + '</div></div>' +
    '<div><div class="tiny dim">今日接通</div><div class="sv">' + connToday + '</div></div></div>' +
    '<div class="help">登记结果后自动跳下一位；队列按「到期回访 → 待联系 → 其他在跟客户」排序。</div>' +
    '</div></div>';

  return head + '<div class="callwrap"><div class="stack">' + left + '</div><div class="stack">' + hist + queueCard + '</div></div>';
}

/* ---------- 渲染 ---------- */
function viewHtml() {
  switch (state.view) {
    case 'dashboard': return state.user.role === 'agent' ? calendarView() : dashboardView();
    case 'customers': return customersView();
    case 'customer': return customerView();
    case 'datahealth': return datahealthView();
    case 'calendar': return calendarView();
    case 'notes': return notesView();
    case 'board': return boardView();
    case 'users': return usersView();
    case 'perms': return permsView();
    case 'settings': return settingsView();
    case 'call': return callView();
    case 'logs': return logsView();
    case 'approvals': return approvalsView();
    default: return '';
  }
}
function render() {
  if (!state.user) { $app.innerHTML = loginView(); applyLang(); return; }
  const sc = document.getElementById('content');
  const st = sc ? sc.scrollTop : 0;
  $app.innerHTML = shell(viewHtml());
  const nc = document.getElementById('content');
  if (nc) nc.scrollTop = st;
  applyLang();
}

/* ---------- 动作 ---------- */
function nextId(kind) { return ++DB.meta.seq[kind]; }
function expireNotifs(taskId) {
  DB.notifications.forEach(n => { if (n.taskId === taskId && n.status !== 'expired') n.status = 'expired'; });
}
function closeModal() { state.modal = null; render(); }
function logLogin(userId, username, ok, note) {
  const ips = ['192.168.1.34', '192.168.1.51', '192.168.1.77', '192.168.1.102', '192.168.1.118'];
  DB.logins.push({
    id: nextId('login'), userId: userId || null, username: username || null, ok,
    at: iso(now()), ip: ips[Math.floor(Math.random() * ips.length)],
    device: 'Windows 10 · Chrome 129', note
  });
}
function doLogin(username, pwd) {
  const uname = String(username).trim();
  const u = DB.users.find(x => x.username === uname);
  state.loginUser = uname;
  if (!u || u.pwd !== pwd) {
    state.loginErr = '账号或密码不正确';
    logLogin(u ? u.id : null, uname, false, u ? '密码错误' : '账号不存在');
    saveDB();
    return false;
  }
  if (!u.active) {
    state.loginErr = '该账号已被禁用，请联系管理员';
    logLogin(u.id, uname, false, '账号已禁用');
    saveDB();
    return false;
  }
  state.user = u; state.loginErr = ''; state.loginUser = ''; state.view = homeView(); state.page = 1;
  state.selected.clear(); state.revealed.clear(); state.callDone.clear(); state.callSkip.clear();
  state.callResult = ''; state.callNote = ''; state.callStatus = '';
  try { localStorage.setItem(SESS, String(u.id)); } catch (e) { }
  logLogin(u.id, u.username, true, '密码登录');
  audit('登录', u.name + ' 登录系统');
  if (u.mustChange) state.modal = { type: 'change-pwd', force: true };
  saveDB();
  return true;
}
