fields:
  - name: "pricing"
    description: "2026年10月现行价格与档位结构：月费、年付、免费试用、所处档位体系"
    detail_level: "详细"
  - name: "benefits"
    description: "订阅福利权益：存储空间、捆绑第三方服务、办公套件集成、无限/增强功能、独占权益"
    detail_level: "详细"
  - name: "limits"
    description: "使用额度限制：消息条数上限（含不同模型分别计量）、深度研究次数、图像/视频生成次数、高峰期限量规则、超额后的降级行为"
    detail_level: "详细"
  - name: "top_models"
    description: "该订阅内可用的最高级/最强模型名称、上下文窗口、是否有独占模型、与免费版/高档位的模型差异"
    detail_level: "详细"
  - name: "third_party_clients"
    description: "第三方客户端/第三方订阅通道支持：Hermes Agent、OpenClaw 等第三方客户端能否以该订阅账号直接使用；官方 API 是否可以单独付费调用同款模型；订阅账号登录第三方服务的情况"
    detail_level: "详细"
  - name: "builtin_tools"
    description: "内置工具与智能体能力：代码执行/沙盒、深度研究、Canvas/Artifacts、Agent 模式、CLI 工具（Claude Code / Codex CLI / Gemini CLI 等）、图像/视频/音乐生成、联网搜索、文件分析、连接器生态"
    detail_level: "详细"
  - name: "model_intelligence"
    description: "可用模型的最高智力水平：GPQA Diamond、SWE-bench Verified、AIME、ARC-AGI-2 等基准成绩，LMArena/Elo 排名"
    detail_level: "详细"
  - name: "hallucination"
    description: "幻觉率对比：AA-Omniscience 幻觉率/非幻觉率、引用真实性实测（学术引用、AI搜索引用）、工具幻觉率（智能体榜单）"
    detail_level: "详细"
  - name: "context_hit"
    description: "长上下文命中：GraphWalks（256K–1M）、MRCR v2 大海捞针（128K/1M）、DeepSWE 长程任务等检索与长程保持能力"
    detail_level: "详细"
  - name: "world_knowledge"
    description: "世界知识能力：知识截止时间、实时联网检索质量、时效性表现、评测成绩（如 SimpleQA、FRAMES）"
    detail_level: "详细"
  - name: "writing"
    description: "文字与写作能力：长文/创意写作、指令遵循、文风自然度、多语言（含中文）能力评价、第三方评测或公认口碑"
    detail_level: "详细"
  - name: "verdict"
    description: "一句话总结该订阅的定位与最适合人群"
    detail_level: "简要"
